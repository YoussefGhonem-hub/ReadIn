<!--

  The design canvas is 402×874 CSS px (iPhone 6.3"); render.mjs scales it to other sizes.

<style>
  :root {
    --paper: #FAF8F4; --surface: #FFFFFF; --surface-2: #F3F0EA; --ink: #1A1A1A; --muted: #6B6B6B;
    --line: #EAE6DE; --green: #0F5E52; --green-dark: #0A493F; --green-soft: #EAF4EF;

  }
  .dark {
    --paper: #121413; --surface: #1B1F1D; --surface-2: #252A27; --ink: #F2F1EC;
    --muted: #A3A9A4; --line: #303632; --green: #70B99B; --green-dark: #4F9A7C;
    --green-soft: #1F342B; --amber: #F2B84B; --amber-soft: #3A3020; --slate-soft: #293034;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0F5E52; }
  body { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  /* ---------- Marketing frame ---------- */
  .stage { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .shot { width: 402px; height: 874px; position: relative; overflow: hidden; }
  .shot.bg-green { background: radial-gradient(120% 70% at 50% 0%, #17745F 0%, #0F5E52 45%, #0A493F 100%); color: #fff; }
  .shot.bg-paper { background: radial-gradient(120% 70% at 50% 0%, #FFFFFF 0%, #FAF8F4 50%, #F1ECE2 100%); color: #1A1A1A; }
  .shot.bg-night { background: radial-gradient(120% 70% at 50% 0%, #22302A 0%, #151917 50%, #0D0F0E 100%); color: #F2F1EC; }
  .deco { position: absolute; border-radius: 50%; pointer-events: none; }
  .deco.a { width: 420px; height: 420px; top: -250px; left: -170px; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 0 0 40px rgba(255,255,255,.035), 0 0 0 80px rgba(255,255,255,.025); }
  .bg-paper .deco.a { border-color: rgba(15,94,82,.12); box-shadow: 0 0 0 40px rgba(15,94,82,.035), 0 0 0 80px rgba(15,94,82,.02); }
  .deco.b { width: 160px; height: 160px; top: 120px; right: -70px; background: radial-gradient(circle, rgba(242,169,59,.35), rgba(242,169,59,0) 70%); }
  .head { position: absolute; top: 46px; inset-inline: 26px; text-align: center; z-index: 3; }
  .brand { display: inline-flex; align-items: center; gap: 7px; direction: ltr; margin-bottom: 14px; }
  .brand .icon { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 15px "IBM Plex Sans", sans-serif; background: #fff; color: #0F5E52; }

  .brand .word { font: 700 19px "IBM Plex Sans", sans-serif; letter-spacing: -1px; }
  .brand .word .in { color: #F2A93B; }

  .headline { margin: 0; font-weight: 700; font-size: 27px; line-height: 1.32; letter-spacing: -.02em; }

  .headline .hl { color: #F2A93B; }
  .bg-paper .headline .hl { color: #0F5E52; }
  .sub { margin: 10px auto 0; max-width: 320px; font-size: 14px; line-height: 1.6; opacity: .82; }
  [lang="en"] .sub { font-family: "IBM Plex Sans", sans-serif; }
  .phone-wrap { position: absolute; left: 50%; top: 222px; transform: translateX(-50%) scale(.79); transform-origin: top center; z-index: 2; }

  /* ---------- Phone (from the approved mockup) ---------- */
  .phone {
    width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 44px;
    background: var(--paper); border: 9px solid #1E1F1C; box-shadow: var(--phone-shadow);
    direction: rtl; color: var(--ink); isolation: isolate;

  .status { height: 46px; padding: 14px 24px 0; display: flex; justify-content: space-between; direction: ltr; font: 600 12px "IBM Plex Sans",sans-serif; }

  .wordmark { display: inline-flex; align-items: center; direction: ltr; font-family: "IBM Plex Sans", sans-serif; font-weight: 700; letter-spacing: -1.5px; font-size: 31px; }
  .wordmark .read { color: var(--ink); } .wordmark .in { color: var(--green); }
  .app-icon { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 14px; color: #fff; background: var(--green); font-family: "IBM Plex Sans", sans-serif; font-weight: 700; font-size: 23px; direction: ltr; }
  .brand .icon, .app-icon { overflow: hidden; }
  .brand .icon svg, .app-icon svg { width: 100%; height: 100%; display: block; }
  .mini-brand { display: flex; justify-content: center; margin: 4px 0 24px; }
  .mini-brand .wordmark { font-size: 23px; }
  .mini-brand .app-icon { width: 29px; height: 29px; font-size: 16px; border-radius: 9px; margin-inline-start: 7px; }
  .onboard-progress { display: flex; justify-content: center; gap: 6px; margin: 26px 0 0; direction: ltr; }

  .onboard-progress i.active { width: 20px; background: var(--green); }
  .onboard h2 { font-size: 25px; margin: 22px 0 5px; letter-spacing: -.04em; }
  .onboard .subtitle { color: var(--muted); margin: 0 0 21px; font-size: 13px; }
  .interest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .interest { display: flex; align-items: center; justify-content: flex-start; gap: 8px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 10px; font-size: 11px; white-space: nowrap; }

  .time-picker strong { direction: ltr; }
  .primary-btn { border: 0; color: white; background: var(--green); border-radius: 12px; height: 48px; font-weight: 600; font-size: 14px; width: 100%; margin-top: 21px; }
  .home-header { display: flex; justify-content: space-between; align-items: center; margin: 3px 0 16px; }
  .greeting { margin: 0; font-size: 18px; font-weight: 700; }
  .greeting-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .header-actions { display: flex; gap: 7px; align-items: center; }
  .streak { color: #925A00; background: var(--amber-soft); border-radius: 99px; padding: 7px 9px; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .dark .streak { color: #F2C77A; }
  .icon-button { border: 1px solid var(--line); width: 33px; height: 33px; border-radius: 11px; background: var(--surface); display: grid; place-items: center; }
  .hero-card { border-radius: 17px; background: var(--surface); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(43,38,27,.05); }
  .cover-art { height: 127px; position: relative; overflow: hidden; background: #E5EEE7; }
  .cover-art::before { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid rgba(15,94,82,.23); border-radius: 50%; top: -87px; left: 46px; box-shadow: 0 0 0 18px rgba(255,255,255,.2), 0 0 0 38px rgba(15,94,82,.06); }
  .cover-art::after { content: ""; position: absolute; width: 70px; height: 125px; background: linear-gradient(145deg,#F1BD67,#F3D69C); left: 91px; top: 24px; border-radius: 6px 28px 4px 25px; transform: rotate(28deg); box-shadow: 43px 10px 0 -12px #0F5E52; opacity: .9; }
  .cover-stamp { position: absolute; top: 15px; inset-inline-start: 15px; z-index: 2; background: rgba(255,255,255,.85); color: var(--green); border-radius: 8px; padding: 5px 8px; font-size: 9px; font-weight: 700; }
  .hero-body { padding: 13px 14px 14px; }
  .tagline { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 10px; font-weight: 700; margin-bottom: 6px; }
  .tag { border-radius: 6px; padding: 3px 7px; background: var(--green-soft); }
  .review-tag { color: #47775E; background: #F0F6F1; }
  .dark .review-tag { background: #23372D; color: #A4CDB3; }

  .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; color: #fff; font-size: 10px; font-weight: 700; background: linear-gradient(145deg,#D2A482,#76554A); }

  .path-card { padding: 12px 13px; margin: 12px 0 13px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }

  .progress-track { height: 5px; border-radius: 99px; background: var(--surface-2); margin-top: 9px; overflow: hidden; }
  .progress-track i { display: block; height: 100%; width: 40%; border-radius: inherit; background: var(--green); }
  .field-row { display: flex; gap: 7px; overflow: hidden; margin: 0 -19px 14px; padding: 0 19px; }
  .filter-chip { flex: 0 0 auto; padding: 6px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 9px; color: var(--muted); }

  .feed-heading { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 8px; }

  .article-thumb { flex: 0 0 59px; height: 61px; border-radius: 10px; background: linear-gradient(135deg,#D6E4DC,#95B8A7); position: relative; overflow: hidden; }
  .article-thumb::before { content: "</>"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(15,94,82,.65); font: 600 15px "IBM Plex Mono",monospace; }
  .article-thumb.orange { background: linear-gradient(135deg,#F8E3B7,#E7AF58); }

    <div class="reading-card"><div class="reading-heading">${ar ? "رحلة القراءة" : "Reading journey"} <span>${ar ? "كل يوم خطوة صغيرة ✦" : "A small step every day ✦"}</span></div>
      <div class="reading-metrics"><div class="metric"><strong class="fire">🔥 12</strong><span>${ar ? "السلسلة الحالية" : "Current streak"}</span></div><div class="metric"><strong>${ar ? "23 يوم" : "23 days"}</strong><span>${ar ? "أطول سلسلة" : "Longest streak"}</span></div><div class="metric"><strong>18</strong><span>${ar ? "مقال الشهر ده" : "Read this month"}</span></div></div>
      <div class="heatmap-label"><span>${ar ? "آخر 12 أسبوع" : "Last 12 weeks"}</span><span>${ar ? "أقل　▫ ▧ ▩　أكتر" : "Less　▫ ▧ ▩　More"}</span></div>
      <div class="heatmap">${lv.map((c) => `<i class="${c}"></i>`).join("")}</div></div>
    <div class="profile-tabs"><button>${ar ? "مقالاتي" : "My articles"}</button><button class="active">${ar ? "المحفوظات" : "Saved"}</button><button>${ar ? "المسارات" : "Paths"}</button></div>
    <div class="saved-label">${ar ? "مقالات محفوظة" : "Saved articles"} <span>${ar ? "عرض الكل ←" : "See all →"}</span></div>
    ${ar ? saved("", `إزاي تختار بين ${L("Transient")} و ${L("Scoped")}؟`, `منة عادل · ${L(".NET")} · 5 دقايق`) : saved("", "Transient vs Scoped: which one?", "Menna Adel · .NET · 5 min")}
    ${ar ? saved("orange", `دليلك العملي لـ ${L("Clean Architecture")}`, "أحمد سامي · Backend · 8 دقايق") : saved("orange", "A practical guide to Clean Architecture", "Ahmed Samy · Backend · 8 min")}
    ${ar ? saved("blue", `إمتى تستخدم ${L("Caching")} في تطبيقك؟`, `عمر فؤاد · ${L(".NET")} · 6 دقايق`) : saved("blue", "When should you use caching?", "Omar Fouad · .NET · 6 min")}
  </div></div>`;
}

const SCREENS = [home, () => reader("ar"), onboarding, comments, profile, reader];
const head = T[lang].heads[shot - 1];

document.getElementById("stage").innerHTML = `
