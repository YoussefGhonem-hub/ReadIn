<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ReadIn logo concepts, round 2</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Round 2 logo concepts (abstract, Arabic calligraphy, wordmark-led, mascot). Rendered by render-logo-concepts.mjs 2:
    logo-concepts-2.html?v=icon&c=1..5   one 1024×1024 icon
    logo-concepts-2.html?v=sheet         identity sheet: icon + lockups on light/dark + home-screen sizes
-->
<style>
  html, body { margin: 0; background: #EFEBE3; font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; }
  .icon svg { display: block; width: 1024px; height: 1024px; }
  .sheet { width: 1800px; padding: 64px 72px 72px; box-sizing: border-box; }
  .sheet h1 { margin: 0 0 6px; font: 700 44px "IBM Plex Sans", sans-serif; letter-spacing: -1.5px; color: #141615; }
  .sheet h1 span { color: #0F5E52; }
  .lead { margin: 0 0 38px; color: #6B6B6B; font-size: 20px; }
  .list { display: flex; flex-direction: column; gap: 26px; }
  .card { background: #fff; border: 1px solid #E3DED3; border-radius: 30px; padding: 30px 34px; display: grid; grid-template-columns: 250px 1fr 560px; gap: 36px; align-items: center; }
  .big { width: 250px; height: 250px; border-radius: 56px; overflow: hidden; box-shadow: 0 16px 36px rgba(10,60,50,.2); }
  .big svg, .small svg, .mark svg { width: 100%; height: 100%; display: block; }
  .meta { display: flex; flex-direction: column; gap: 8px; }
  .tag { align-self: flex-start; font: 700 13px "IBM Plex Sans", sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #0F5E52; background: #E7F2EE; padding: 6px 10px; border-radius: 8px; }
  .name { font: 700 34px "IBM Plex Sans", sans-serif; color: #141615; letter-spacing: -1px; }
  .name small { font: 700 24px "IBM Plex Sans Arabic", sans-serif; color: #6B6B6B; margin-inline-start: 10px; }
  .idea { color: #4A4A4A; font-size: 18px; line-height: 1.75; direction: rtl; text-align: right; }
  .lockups { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
  .lockup { border-radius: 20px; padding: 18px 24px; display: flex; align-items: center; gap: 18px; }
  .lockup.light { background: #FAF8F4; border: 1px solid #ECE7DD; }
  .lockup.dark { background: #121413; }
  .mark { width: 74px; height: 74px; border-radius: 18px; overflow: hidden; flex: 0 0 auto; }
  .word { font: 700 46px "IBM Plex Sans", sans-serif; letter-spacing: -2px; line-height: 1; }
  .light .word .r { color: #141615; } .light .word .i { color: #0F5E52; }
  .dark .word .r { color: #F2F1EC; } .dark .word .i { color: #70B99B; }
  .word-ar { font: 600 15px "IBM Plex Sans Arabic", sans-serif; margin-top: 6px; }
  .light .word-ar { color: #6B6B6B; } .dark .word-ar { color: #A3A9A4; }
  .homes { margin-inline-start: auto; display: flex; gap: 10px; align-items: center; }
  .small { width: 46px; height: 46px; border-radius: 11px; overflow: hidden; }
  .tiny { width: 28px; height: 28px; border-radius: 7px; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const defs = (id) => `
  <defs>
    <radialGradient id="bg${id}" cx="26%" cy="16%" r="100%">
      <stop offset="0" stop-color="#1D8A71"/><stop offset=".5" stop-color="#0F5E52"/><stop offset="1" stop-color="#073A32"/>
    </radialGradient>
    <linearGradient id="am${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD37A"/><stop offset=".55" stop-color="#F2A93B"/><stop offset="1" stop-color="#DE8A1E"/>
    </linearGradient>
    <linearGradient id="wh${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4F0EB"/>
    </linearGradient>
    <filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021F1A" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg${id})"/>`;

const CONCEPTS = [
  {
    tag: "Abstract", name: "Meeting Pages", ar: "صفحتين بيتقابلوا",
    idea: "صفحتين بيميلوا على بعض: الأبيض سطوره من الشمال لليمين (English)، والبرتقالي سطوره من اليمين للشمال (عربي). مكان ما بيتقابلوا بيتولد لون تالت. ده بالظبط ReadIn: لغتين في صفحة واحدة.",
    svg: (i) => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs(i)}
      <defs><clipPath id="clipA${i}"><rect x="232" y="262" width="340" height="500" rx="64" transform="rotate(-12 402 512)"/></clipPath></defs>
      <g filter="url(#sh${i})">
        <rect x="232" y="262" width="340" height="500" rx="64" transform="rotate(-12 402 512)" fill="url(#wh${i})"/>
        <rect x="452" y="262" width="340" height="500" rx="64" transform="rotate(12 622 512)" fill="url(#am${i})"/>
      </g>
      <rect x="452" y="262" width="340" height="500" rx="64" transform="rotate(12 622 512)" fill="#FFF1D2" clip-path="url(#clipA${i})"/>
      <g transform="rotate(-12 402 512)" fill="#0F5E52" fill-opacity=".30">
        <rect x="282" y="350" width="150" height="26" rx="13"/><rect x="282" y="410" width="110" height="26" rx="13"/><rect x="282" y="470" width="135" height="26" rx="13"/>
      </g>
      <g transform="rotate(12 622 512)" fill="#7A4A08" fill-opacity=".30">
        <rect x="592" y="560" width="150" height="26" rx="13"/><rect x="632" y="620" width="110" height="26" rx="13"/><rect x="607" y="680" width="135" height="26" rx="13"/>
      </g>
    </svg>`,
  },
  {
    tag: "Wordmark-led", name: "Ribbon R", ar: "R برجل Bookmark",
    idea: "حرف R مرسوم مخصوص، ورجله اتحولت لشريط Bookmark بالبرتقالي. شكل واحد بيقول ReadIn وبيقول «احفظ وكمّل بعدين». نفس الشريط بيظهر في الكلمة الكاملة.",
    svg: (i) => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs(i)}
      <g filter="url(#sh${i})">
        <path fill="url(#wh${i})" fill-rule="evenodd" d="M300 230 H560 C680 230 760 312 760 418 C760 524 680 606 560 606 H424 V794 H300 Z M424 336 V500 H552 C606 500 640 466 640 418 C640 370 606 336 552 336 Z"/>
        <path fill="url(#am${i})" d="M532 560 H690 V860 L611 800 L532 860 Z"/>
      </g>
    </svg>`,
  },
  {
    tag: "Mascot", name: "Bomy the Owl", ar: "بومي البومة",
    idea: "بومة (رمز الحكمة) ماسكة كتاب ومركّزة في القراية. شخصية تقدر تستخدمها في الإشعارات («بومي جابلك مقال النهارده ☕»)، والـ Onboarding، والاحتفال بالـ Streak.",
    svg: (i) => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs(i)}
      <g filter="url(#sh${i})">
        <path d="M300 420 L318 236 L430 330 Q512 300 594 330 L706 236 L724 420 Q766 560 718 680 Q660 820 512 824 Q364 820 306 680 Q258 560 300 420 Z" fill="url(#am${i})"/>
      </g>
      <path d="M512 330 Q560 330 594 350 Q560 470 512 470 Q464 470 430 350 Q464 330 512 330 Z" fill="#E08C1F" fill-opacity=".35"/>
      <circle cx="420" cy="470" r="104" fill="#FFFFFF"/><circle cx="604" cy="470" r="104" fill="#FFFFFF"/>
      <circle cx="432" cy="504" r="50" fill="#0B3B33"/><circle cx="592" cy="504" r="50" fill="#0B3B33"/>
      <circle cx="448" cy="488" r="15" fill="#fff"/><circle cx="608" cy="488" r="15" fill="#fff"/>
      <path d="M512 548 L486 584 Q512 606 538 584 Z" fill="#0F5E52"/>
      <g filter="url(#sh${i})">
        <path d="M512 668 C440 628 340 620 250 646 V790 C340 766 440 774 512 812 Z" fill="url(#wh${i})"/>
        <path d="M512 668 C584 628 684 620 774 646 V790 C684 766 584 774 512 812 Z" fill="#FFFFFF"/>
      </g>
      <path d="M512 668 V812" stroke="#0F5E52" stroke-opacity=".3" stroke-width="10"/>
      <g fill="#0F5E52" fill-opacity=".22"><rect x="300" y="690" width="150" height="18" rx="9"/><rect x="300" y="730" width="120" height="18" rx="9"/><rect x="574" y="690" width="150" height="18" rx="9"/><rect x="604" y="730" width="120" height="18" rx="9"/></g>
    </svg>`,
  },
];

const q = new URLSearchParams(location.search);
const root = document.getElementById("root");
const lockup = (c, n, mode) => `<div class="lockup ${mode}"><div class="mark">${c.svg(mode + n)}</div>
  <div><div class="word"><span class="r">Read</span><span class="i">In</span></div><div class="word-ar">مقال كل يوم يفرق معاك</div></div>
  <div class="homes"><div class="small">${c.svg(mode + "s" + n)}</div><div class="tiny">${c.svg(mode + "t" + n)}</div></div></div>`;
if (q.get("v") === "icon") {
  root.innerHTML = `<div class="icon">${CONCEPTS[Number(q.get("c") || 1) - 1].svg("i")}</div>`;
} else {
  root.innerHTML = `<div class="sheet">
    <h1>Read<span>In</span> · Brand concepts, round 2</h1>
    <p class="lead" dir="rtl" style="text-align:left">كل فكرة معروضة كهوية كاملة: الأيقونة، والاسم جنبها على خلفية فاتحة وغامقة، ومقاسها الصغير على الموبايل.</p>
    <div class="list">${CONCEPTS.map((c, n) => `
      <div class="card">
        <div class="big">${c.svg("b" + n)}</div>
        <div class="meta"><span class="tag">0${n + 1} · ${c.tag}</span><div class="name">${c.name}<small>${c.ar}</small></div><div class="idea">${c.idea}</div></div>
        <div class="lockups">${lockup(c, n, "light")}${lockup(c, n, "dark")}</div>
      </div>`).join("")}
    </div></div>`;
}
</script>
</body>
</html>
