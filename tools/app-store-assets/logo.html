<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ReadIn logo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@700&display=swap" rel="stylesheet">
<!--
  Final ReadIn logo: "R + ر" (the Latin R and the Arabic ر side by side: one platform, two languages).
  Rendered by render.mjs:
    logo.html?v=icon            app icon, fills the viewport (square, full-bleed; iOS/Android apply their own mask)
    logo.html?v=fg              Android adaptive icon foreground (transparent, inside the 66/108 safe zone)
    logo.html?v=bg              Android adaptive icon background (gradient only)
    logo.html?v=lockup          icon + "ReadIn" wordmark, for light backgrounds (transparent)
    logo.html?v=lockup-dark     icon + "ReadIn" wordmark, for dark backgrounds (transparent)
    logo.html?v=wordmark        "ReadIn" wordmark, for light backgrounds (transparent)
    logo.html?v=wordmark-dark   "ReadIn" wordmark, for dark backgrounds (transparent)
-->
<style>
  html, body { margin: 0; background: transparent; }
  .full, .full svg { display: block; width: 100vw; height: 100vh; }
  .lockup { display: inline-flex; align-items: center; gap: 44px; padding: 32px 40px; }
  .lockup .mark { width: 300px; height: 300px; border-radius: 68px; overflow: hidden; }
  .lockup .mark svg { width: 100%; height: 100%; display: block; }
  .wordmark { display: inline-flex; padding: 24px 32px; font: 700 220px/1 "IBM Plex Sans", sans-serif; letter-spacing: -11px; }
  .lockup .wordmark { padding: 0; }
  .wordmark .read { color: #1A1A1A; } .wordmark .in { color: #0F5E52; }
  .dark .wordmark .read, .wordmark.dark .read { color: #F2F1EC; } .dark .wordmark .in, .wordmark.dark .in { color: #70B99B; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// The letters "R + ر", drawn on a 1024 canvas. `id` keeps gradient ids unique when several copies share a page.
const art = (id) => `
  <defs>
    <linearGradient id="am${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C062"/><stop offset="1" stop-color="#E8962A"/></linearGradient>
  </defs>
  <text x="410" y="735" text-anchor="middle" font-family="IBM Plex Sans" font-weight="700" font-size="600" fill="#FFFFFF" letter-spacing="-10">R</text>
  <text x="690" y="760" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="470" fill="url(#am${id})">ر</text>`;
const bg = (id) => `
  <defs><radialGradient id="bg${id}" cx="28%" cy="18%" r="95%"><stop offset="0" stop-color="#1C806A"/><stop offset=".55" stop-color="#0F5E52"/><stop offset="1" stop-color="#083F36"/></radialGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg${id})"/>
  <circle cx="250" cy="170" r="430" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>`;
const svg = (inner) => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">${inner}</svg>`;
const icon = (id) => svg(bg(id) + art(id));
const word = (dark) => `<div class="wordmark${dark ? " dark" : ""}"><span class="read">Read</span><span class="in">In</span></div>`;

const v = new URLSearchParams(location.search).get("v") || "icon";
const root = document.getElementById("root");
root.innerHTML = {
  icon: `<div class="full">${icon("i")}</div>`,
  // 66/108 of the canvas is the safe zone launchers never crop; the art is scaled to sit inside it.
  fg: `<div class="full">${svg(`<g transform="translate(512 512) scale(.66) translate(-512 -540)">${art("f")}</g>`)}</div>`,
  bg: `<div class="full">${svg(bg("b"))}</div>`,
  lockup: `<div class="lockup"><div class="mark">${icon("l")}</div>${word(false)}</div>`,
  "lockup-dark": `<div class="lockup dark"><div class="mark">${icon("d")}</div>${word(true)}</div>`,
  wordmark: word(false),
  "wordmark-dark": word(true),
}[v];
</script>
</body>
</html>
