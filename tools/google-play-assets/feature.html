<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ReadIn Google Play feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
<!--
  Google Play feature graphic: 1024×500, no transparency. Text stays inside the middle of the image, since Play may
  crop the edges or cover the bottom with a play button. One graphic per page load: feature.html?lang=ar|en
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  [lang="en"] body { font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", sans-serif; }
  .g { position: relative; width: 1024px; height: 500px; overflow: hidden; color: #fff;
    background: radial-gradient(90% 120% at 30% 0%, #17745F 0%, #0F5E52 50%, #0A493F 100%); }
  .ring { position: absolute; width: 760px; height: 760px; top: -470px; left: -260px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.12); box-shadow: 0 0 0 60px rgba(255,255,255,.035), 0 0 0 120px rgba(255,255,255,.02); }
  .glow { position: absolute; width: 360px; height: 360px; bottom: -160px; right: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242,169,59,.32), rgba(242,169,59,0) 70%); }
  .text { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 520px; z-index: 2; }
  [dir="ltr"] .text { left: 84px; }
  [dir="rtl"] .text { right: 84px; }
  .brand { display: inline-flex; align-items: center; gap: 16px; direction: ltr; margin-bottom: 26px; align-self: flex-start; }
  [dir="rtl"] .brand { align-self: flex-end; }
  .brand img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .brand .word { font: 700 60px "IBM Plex Sans", sans-serif; letter-spacing: -2.5px; }
  .brand .word b { color: #F2A93B; font-weight: 700; }
  h1 { margin: 0; font-size: 44px; line-height: 1.3; font-weight: 700; }
  [lang="en"] h1 { font-size: 42px; line-height: 1.18; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #F2A93B; }
  .phone { position: absolute; top: 46px; width: 330px; height: 733px; padding: 9px; border-radius: 40px; background: #1C1D1B;
    box-shadow: 0 30px 80px rgba(0,0,0,.38), inset 0 0 0 2px #3A3B38; z-index: 1; }
  [dir="ltr"] .phone { right: 92px; }
  [dir="rtl"] .phone { left: 92px; }
  .phone img { display: block; width: 312px; height: 693px; border-radius: 32px; }
</style>
</head>
<body>
<div class="g">
  <div class="ring"></div><div class="glow"></div>
  <div class="text">
    <div class="brand"><img src="../../docs/design/app-store/logo/app-icon-1024.png" alt=""><span class="word">Read<b>In</b></span></div>
    <h1 id="headline"></h1>
  </div>
  <div class="phone"><img id="screen" alt=""></div>
</div>
<script>
  const COPY = {
    ar: "مقال كل يوم <em>يُحدث فرقًا</em><br>بالعربية والإنجليزية",
    en: "Read daily. <em>Grow daily.</em><br>In Arabic and English.",
  };
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ar";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("headline").innerHTML = COPY[lang];
  document.getElementById("screen").src = `../../docs/google-play/screenshots/raw/${lang}/01-home.png`;
</script>
</body>
</html>
