<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ReadIn article cover</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* 1200×630 article cover (Open Graph size). A deep field-colored canvas with white text reads well on the
     light and the dark theme alike; nothing in it depends on the page background. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0B1F1B; }
  body { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; color: #FFFFFF; }

  .cover {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(120% 140% at 85% 0%, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .10;
    background-image: radial-gradient(#FFFFFF 1.4px, transparent 1.6px);
    background-size: 28px 28px;
    mask-image: linear-gradient(to left, transparent 0%, #000 55%);
  }
  .glyph { position: absolute; left: -60px; bottom: -90px; width: 460px; height: 460px; opacity: .13; }
  .glyph svg { width: 100%; height: 100%; stroke: #FFFFFF; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .stripe { position: absolute; top: 0; right: 0; width: 100%; height: 8px; background: linear-gradient(to left, var(--accent), transparent 70%); }

  .content { position: absolute; inset: 64px 72px 56px 72px; display: flex; flex-direction: column; }
  .field {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 20px 10px 22px; border-radius: 999px; background: rgba(255, 255, 255, .14);
    font-weight: 700; font-size: 24px; line-height: 1;
  }
  .field svg { width: 26px; height: 26px; stroke: #FFFFFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .titles { margin-top: 40px; max-width: 960px; }
  .title-ar { font-weight: 700; line-height: 1.32; letter-spacing: 0; text-wrap: balance; }
  .title-ar bdi { font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", sans-serif; }
  .title-en {
    margin-top: 22px; font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 26px; line-height: 1.35;
    color: rgba(255, 255, 255, .78); text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 12px; }
  .chip {
    padding: 8px 16px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, .35);
    font-size: 21px; font-weight: 600; line-height: 1.2;
  }
  .chip.version { font-family: "IBM Plex Sans", sans-serif; }
  .brand { display: flex; align-items: center; gap: 14px; direction: ltr; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
  .brand span { font-family: "IBM Plex Sans", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -.5px; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="grid"></div>
  <div class="stripe"></div>
  <div class="glyph" id="glyph"></div>
  <div class="content">
    <div class="field" id="field"></div>
    <div class="titles">
      <h1 class="title-ar" id="titleAr"></h1>
      <p class="title-en" dir="ltr" id="titleEn"></p>
    </div>
    <div class="footer">
      <div class="chips" id="chips"></div>
      <div class="brand"><img id="logo" alt=""><span>ReadIn</span></div>
    </div>
  </div>
</div>
<script>
  // Latin runs inside the Arabic title are isolated like in the readers (SPEC §14.2). Short runs ("value types") never
  // wrap, and neither does the gap after "الـ"/"لـ", so a line never ends on half of an English term or on a bare "الـ".
  const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const isolate = (s) => escape(s).replace(/(?:\.|@|#)?[A-Za-z][^؀-ۿ،؛؟]*/g, (run) => {
    const trimmed = run.replace(/[\s.,:;!?'"-]+$/, "");
    const text = trimmed.length <= 24 ? trimmed.replace(/ /g, "&nbsp;") : trimmed;
    return `<bdi>${text}</bdi>${run.slice(trimmed.length)}`;
  }).replace(/ـ (?=<bdi>)/g, "ـ&nbsp;");

  window.renderCover = async (d) => {
    const cover = document.getElementById("cover");
    cover.style.setProperty("--c1", d.colors[0]);
    cover.style.setProperty("--c2", d.colors[1]);
    cover.style.setProperty("--c3", d.colors[2]);
    cover.style.setProperty("--accent", d.accent);
    document.getElementById("glyph").innerHTML = d.iconSvg;
    document.getElementById("field").innerHTML = `${d.iconSvg}<span>${isolate(d.fieldAr)}</span>`;
    document.getElementById("titleEn").textContent = d.titleEn;
    document.getElementById("chips").innerHTML = d.chips
      .map((c) => `<span class="chip${c.latin ? " version" : ""}" ${c.latin ? 'dir="ltr"' : ""}>${escape(c.text)}</span>`)
      .join("");
    document.getElementById("logo").src = d.logo;

    // Largest size (66 → 46 px) that keeps the Arabic title within 3 lines.
    const title = document.getElementById("titleAr");
    title.innerHTML = isolate(d.titleAr);
    for (let size = 66; size >= 46; size -= 2) {
      title.style.fontSize = `${size}px`;
      if (title.getBoundingClientRect().height <= size * 1.32 * 3 + 2) break;
    }
    await document.fonts.ready;
    await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = img.onerror = r)))));
  };

  // Screenshot (PNG) → WebP with the browser's own encoder.
  window.toWebp = async (pngBase64, quality) => {
    const img = new Image();
    img.src = `data:image/png;base64,${pngBase64}`;
    await img.decode();
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    return canvas.toDataURL("image/webp", quality).split(",")[1];
  };
</script>
</body>
</html>
