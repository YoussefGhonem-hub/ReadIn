# Local development services (SPEC §28.2): `docker compose up -d`
# SQL Server is published on host port 14333 (1433 is often taken by a local SQL Server install).
# The SA password below is for this throwaway local container only. It matches
# backend/src/ReadIn.Api/appsettings.Development.json. Override with MSSQL_SA_PASSWORD in a .env file.
name: readin

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: readin-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ReadIn_Local_Dev_1}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seq:
    image: datalust/seq:latest
    container_name: readin-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  sqlserver-data:
  seq-data:
