# Local development services (SPEC §28.2): `docker compose up -d`
# SQL Server is published on host port 14333 (1433 is often taken by a local SQL Server install).
# The SA password below is for this throwaway local container only. It matches
# backend/src/ReadIn.Api/appsettings.Development.json. Override with MSSQL_SA_PASSWORD in a .env file.
name: readin

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: readin-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ReadIn_Local_Dev_1}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seq:
    image: datalust/seq:latest
    container_name: readin-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # Optional: the API as a container, production-style (`docker compose --profile api up -d`, API on :5080).
  # Build the image first: dotnet publish backend/src/ReadIn.Api -c Release /t:PublishContainer
  #   -p:ContainerRepository=readin-api -p:ContainerImageTag=local
  # Uploads live in the named volume `api-uploads`, so they survive rebuilds (ADR 0010, docs/setup/deployment.md).
  # `docker compose down -v` deletes that volume and every uploaded image.
  api-uploads-init:
    image: busybox:1.37
    profiles: ["api"]
    # The .NET image runs as the non-root `app` user (UID 1654); a new named volume belongs to root.
    command: ["chown", "-R", "1654:1654", "/uploads"]
    volumes:
      - api-uploads:/uploads

  api:
    image: ${READIN_API_IMAGE:-readin-api:local}
    container_name: readin-api
    profiles: ["api"]
    depends_on:
      sqlserver:
        condition: service_healthy
      api-uploads-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ReadIn: "Server=sqlserver,1433;Database=ReadIn;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ReadIn_Local_Dev_1};TrustServerCertificate=True;Encrypt=False"
      Firebase__AuthEmulatorHost: host.docker.internal:9099
      Storage__PublicBaseUrl: http://localhost:5080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5080:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads

volumes:
  sqlserver-data:
  seq-data:
  api-uploads:
