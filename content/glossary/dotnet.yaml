terms:
  - id: value-type
    term: Value type
    definitionEn: A type (struct, enum, or a built-in like int) whose variables hold the data itself, so assigning or passing one copies the whole value.
    definitionAr: نوع (struct أو enum أو حاجة زي int) المتغير بتاعه شايل الداتا نفسها، فلما تعمله assign أو تبعته لـ method بيتنسخ كله.
  - id: boxing
    term: Boxing
    definitionEn: Converting a value type to object or to an interface it implements, which copies the value into a new object, normally on the managed heap.
    definitionAr: تحويل value type لـ object أو لـ interface بيعمله implement، وده بينسخ القيمة جوه object جديد، غالبًا على الـ managed heap.
  - id: escape-analysis
    term: Escape analysis
    definitionEn: A JIT check that proves an object can't outlive the method that creates it, so the object can be allocated on the stack instead of the heap.
    definitionAr: فحص بيعمله الـ JIT عشان يتأكد إن الـ object مش هيعيش بعد ما الـ method اللي عملته تخلص، فيقدر يحطه على الـ stack بدل الـ heap.
  - id: closure
    term: Closure
    definitionEn: A function, such as a C# lambda, together with the outer variables it captures. The C# compiler stores those variables as fields of a hidden class.
    definitionAr: function زي الـ lambda في C# ومعاها المتغيرات اللي من برّه واللي بتستخدمها. الـ C# compiler بيخزّن المتغيرات دي كـ fields في class مخفية.
  - id: utc-offset
    term: UTC offset
    definitionEn: How far a local time is ahead of or behind Coordinated Universal Time (UTC) at a given moment, such as +02:00. A time zone's offset can change during the year.
    definitionAr: الفرق بين الوقت المحلي والـ UTC في لحظة معينة، زي +02:00. والـ offset بتاع المنطقة الزمنية ممكن يتغير خلال السنة.
  - id: daylight-saving-time
    term: Daylight saving time
    definitionEn: Moving local clocks forward for part of the year and back again later, so each year one local hour is skipped and another one happens twice.
    definitionAr: إن الساعة المحلية تتقدم لفترة من السنة وبعدين ترجع تاني، فكل سنة فيه ساعة محلية بتتنط وساعة تانية بتتكرر مرتين.
  - id: immutability
    term: Immutability
    definitionEn: The guarantee that an object's data can't change after it's created. To get a different value, you create a new object.
    definitionAr: ضمان إن داتا الـ object مش هتتغير بعد ما يتعمل. لو عايز قيمة مختلفة، بتعمل object جديد.
  - id: read-only-view
    term: Read-only view
    definitionEn: An object or interface that lets you read a collection but not change it through that reference, while the collection behind it can still change.
    definitionAr: object أو interface بيخليك تقرا collection من غير ما تقدر تغيّرها من خلاله، مع إن الـ collection اللي وراه لسه ممكن تتغير.
  - id: deferred-execution
    term: Deferred execution
    definitionEn: Running a LINQ query only when its results are enumerated, not when it's defined. Each new enumeration runs the query again.
    definitionAr: إن الـ LINQ query ما تتنفذش وقت ما تكتبها، وتتنفذ بس لما حد يعمل enumeration على النتايج. وكل enumeration جديد بيشغّلها من الأول.
  - id: materialization
    term: Materialization
    definitionEn: Running a lazy query once and storing its results in a real collection, for example with ToList() or ToArray(), so later reads don't run it again.
    definitionAr: إنك تشغّل الـ query الـ lazy مرة واحدة وتخزّن نتايجها في collection حقيقية، زي بـ ToList() أو ToArray()، عشان القراية بعد كده ما تشغّلهاش تاني.
  - id: null-state-analysis
    term: Null-state analysis
    definitionEn: The C# compiler's static analysis that tracks whether each expression is not-null or maybe-null and reports warnings. It runs at compile time only and adds no runtime checks.
    definitionAr: التحليل اللي بيعمله الـ C# compiler عشان يعرف كل expression حالتها not-null ولا maybe-null ويطلّع warnings. بيشتغل وقت الـ compile بس ومش بيضيف أي checks وقت التشغيل.
  - id: null-forgiving-operator
    term: Null-forgiving operator
    definitionEn: The postfix ! operator, as in name!.Length, which tells the compiler to treat an expression as not-null. It silences the warning and generates no runtime check.
    definitionAr: الـ operator ! اللي بيتكتب بعد الـ expression، زي name!.Length، وبيقول للـ compiler يعاملها كأنها not-null. بيسكّت الـ warning ومش بيعمل أي check وقت التشغيل.
  - id: value-equality
    term: Value equality
    definitionEn: Treating two objects as equal when they have the same type and their data members are equal, even if they are different instances in memory.
    definitionAr: إنك تعتبر اتنين objects متساويين لو من نفس النوع والداتا اللي جواهم متساوية، حتى لو كانوا instances مختلفة في الـ memory.
  - id: thread-pool
    term: Thread pool
    definitionEn: A set of worker threads that the .NET runtime creates and reuses for short pieces of work, such as Task.Run delegates and the code that runs after an await, so your code doesn't create a thread each time.
    definitionAr: مجموعة threads جاهزة الـ runtime بتاع .NET بيعملها ويعيد استخدامها للشغل القصير، زي الـ delegates بتاعة Task.Run والكود اللي بيكمّل بعد الـ await، عشان الكود بتاعك ما يعملش thread جديد كل مرة.
  - id: continuation
    term: Continuation
    definitionEn: The code that runs after an awaited operation completes. For an await in an async method, it's the rest of the method, which the compiler packages so it can resume later.
    definitionAr: الكود اللي بيشتغل بعد ما العملية اللي عملتلها await تخلص. في الـ async method هو باقي الـ method، والـ compiler بيجهّزه عشان يكمّل بعدين.
  - id: synchronization-context
    term: SynchronizationContext
    definitionEn: An object that decides where queued work runs. UI frameworks such as WPF and WinForms install one that sends the code after an await back to the UI thread; ASP.NET Core and console apps don't have one.
    definitionAr: object بيحدد الشغل اللي في الطابور هيشتغل فين. الـ UI frameworks زي WPF و WinForms بتحط واحد بيرجّع الكود اللي بعد الـ await للـ UI thread، أما ASP.NET Core والـ console apps فمفيهمش.
  - id: fire-and-forget
    term: Fire-and-forget
    definitionEn: Starting an asynchronous operation without awaiting it or keeping its Task, so nothing waits for it to finish and nothing observes its exceptions.
    definitionAr: إنك تبدأ عملية asynchronous من غير ما تعملها await أو تحتفظ بالـ Task بتاعها، فمحدش بيستنى لما تخلص ومحدش بيشوف الـ exceptions اللي بتطلع منها.
  - id: cooperative-cancellation
    term: Cooperative cancellation
    definitionEn: A cancellation model where the requester only signals that work should stop, and the running code checks for that signal and stops itself at a safe point. CancellationToken in .NET works this way.
    definitionAr: طريقة للإلغاء اللي بيطلب فيها حد إن الشغل يقف بيبعت إشارة وبس، والكود الشغال هو اللي بيشيّك على الإشارة دي ويوقف نفسه عند نقطة آمنة. والـ CancellationToken في .NET شغال بالطريقة دي.
  - id: deadlock
    term: Deadlock
    definitionEn: A state where two pieces of code each wait for something the other holds, so neither can continue. A blocked thread waiting for work that can only run on that same thread is a common example.
    definitionAr: حالة فيها جزءين من الكود كل واحد مستني حاجة ماسكها التاني، فمحدش فيهم يقدر يكمّل. ومثال مشهور ليها thread واقف مستني شغل مينفعش يتنفذ غير على نفس الـ thread ده.
  - id: gc-root
    term: GC root
    definitionEn: A starting point the garbage collector trusts to be alive, such as a static field, a local variable the JIT still reports, a CPU register or a GC handle. Objects reachable from a root survive; the rest are garbage.
    definitionAr: نقطة بداية الـ garbage collector واثق إنها عايشة، زي static field، أو local variable الـ JIT لسه بيبلّغ عنه، أو CPU register، أو GC handle. أي object يتوصله من root بيفضل عايش، والباقي garbage.
  - id: gc-generations
    term: GC generations
    definitionEn: The .NET GC splits the managed heap into generations 0, 1 and 2. New objects start in gen 0, survivors are promoted, and a gen 2 collection is a full collection of the whole heap.
    definitionAr: الـ GC في .NET بيقسم الـ managed heap لـ generations 0 و 1 و 2. الـ objects الجديدة بتبدأ في gen 0، واللي يعيش بيترقّى، والـ gen 2 collection معناها collection كاملة للـ heap كله.
  - id: large-object-heap
    term: Large object heap (LOH)
    definitionEn: A separate part of the managed heap for objects of 85,000 bytes or more, usually big arrays. It's collected only with generation 2 and usually isn't compacted.
    definitionAr: جزء منفصل من الـ managed heap للـ objects اللي حجمها 85,000 byte أو أكتر، وغالبًا بتبقى arrays كبيرة. بيتعمله collection مع generation 2 بس، وعادةً مش بيتعمله compaction.
  - id: unmanaged-resource
    term: Unmanaged resource
    definitionEn: Something an object holds outside the managed heap, such as an operating system file handle, a socket or a database connection. The garbage collector can't release it; Dispose (or a finalizer as a last resort) has to.
    definitionAr: حاجة الـ object ماسكها برّه الـ managed heap، زي file handle من نظام التشغيل أو socket أو connection للداتابيز. الـ garbage collector مايعرفش يحررها، واللي بيحررها هو الـ Dispose (أو الـ finalizer كآخر حل).
  - id: finalizer
    term: Finalizer
    definitionEn: A method (~ClassName() in C#) that the garbage collector calls at an unspecified time after an object becomes unreachable, so the object can release an unmanaged resource that nobody disposed.
    definitionAr: method بتتكتب ~ClassName() في C#، والـ garbage collector بيناديها في وقت مش محدد بعد ما الـ object يبقى محدش بيوصله، عشان يحرر unmanaged resource محدش عمله Dispose.
  - id: connection-pool
    term: Connection pool
    definitionEn: A set of open database connections that a data provider keeps and reuses. Opening a connection borrows one from the pool; closing or disposing it returns it.
    definitionAr: مجموعة connections مفتوحة للداتابيز الـ data provider بيحتفظ بيها ويعيد استخدامها. لما تفتح connection بتستلف واحد من الـ pool، ولما تعمله Close أو Dispose بيرجع له.
  - id: async-state-machine
    term: Async state machine
    definitionEn: The type the C# compiler generates for an async method. It stores the method's local variables and where it stopped, so the method can pause at an await and resume later.
    definitionAr: الـ type اللي الـ C# compiler بيولّده لأي async method. بيخزّن الـ local variables بتاعتها والنقطة اللي وقفت عندها، عشان الـ method تقدر تقف عند await وتكمّل بعدين.
  - id: object-pooling
    term: Object pooling
    definitionEn: Keeping objects after they're used and handing them out again for new work instead of allocating new ones. Once an object goes back to the pool, its previous user must not touch it again.
    definitionAr: إنك تحتفظ بالـ objects بعد ما تخلص منها وتديها لشغل جديد بدل ما تعمل allocate لـ objects جديدة. وأول ما الـ object يرجع للـ pool، اللي كان بيستخدمه قبل كده مينفعش يلمسه تاني.
  - id: ref-struct
    term: ref struct
    definitionEn: A struct declared with the ref modifier, such as Span<T>. The compiler keeps it on the stack, so it can't be a field of a class, an array element or boxed, can't be captured by a lambda and can't live across an await.
    definitionAr: struct متعرّف بكلمة ref، زي Span<T>. الـ compiler بيخلّيه على الـ stack بس، فمينفعش يبقى field في class، ولا element في array، ولا يتعمله boxing، ولا يتمسك في lambda، ولا يعيش بعد await.
  - id: interior-pointer
    term: Interior pointer
    definitionEn: A managed reference that points into the middle of an object, such as to one element of an array, rather than to the object's start. Span<T> holds one.
    definitionAr: managed reference بيشاور على حتة جوه object، زي element واحد جوه array، مش على أول الـ object. والـ Span<T> ماسك واحد منهم.
  - id: atomic-operation
    term: Atomic operation
    definitionEn: An operation that other threads see as a single step, either not started or fully done, never halfway. A sequence of atomic calls isn't atomic as a whole.
    definitionAr: عملية الـ threads التانية بتشوفها كخطوة واحدة، يا إما لسه ما بدأتش يا إما خلصت كلها، عمرها ما بتبان في النص. ومجموعة calls كل واحد فيها atomic مش بتبقى atomic كلها على بعض.
  - id: middleware
    term: Middleware
    definitionEn: A component in the ASP.NET Core request pipeline. It receives each request, can do work before and after calling the next component, or can end the request itself.
    definitionAr: component في الـ request pipeline بتاع ASP.NET Core. بيستلم كل request، ويقدر يعمل شغل قبل وبعد ما ينادي الـ component اللي بعده، أو يقفل الـ request بنفسه.
  - id: short-circuiting
    term: Short-circuiting
    definitionEn: When a middleware answers a request without calling the next one, so the rest of the pipeline never runs for that request.
    definitionAr: إن middleware يرد على الـ request من غير ما ينادي اللي بعده، فباقي الـ pipeline مش بيشتغل خالص للـ request ده.
  - id: route-group
    term: Route group
    definitionEn: A set of minimal API endpoints created with MapGroup that share a URL prefix. Authorization, filters or metadata added to the group apply to every endpoint in it.
    definitionAr: مجموعة endpoints في الـ Minimal APIs بتتعمل بـ MapGroup وليها نفس الـ URL prefix. أي authorization أو filters أو metadata تضيفها على الـ group بتتطبق على كل endpoint جواها.
  - id: endpoint-filter
    term: Endpoint filter
    definitionEn: Code attached to a minimal API endpoint or route group with AddEndpointFilter. It runs before and after the handler, can read or change its arguments, and can return a response without calling it.
    definitionAr: كود بتربطه بـ endpoint أو route group في الـ Minimal APIs بـ AddEndpointFilter. بيشتغل قبل الـ handler وبعده، ويقدر يقرا الـ arguments بتاعته أو يغيّرها، ويقدر يرجّع response من غير ما يناديه أصلًا.
  - id: dependency-injection
    term: Dependency Injection
    definitionEn: A technique where a class or function receives the objects it depends on from the outside, usually from a container, instead of creating them itself. Frameworks such as ASP.NET Core and Angular register services and supply them wherever they're asked for.
    definitionAr: إن الـ class أو الـ function تستلم الحاجات اللي محتاجاها من برّه، وغالبًا من container، بدل ما تعملها بنفسها. وframeworks زي ASP.NET Core و Angular بتسجّل الـ services وتديها لأي حد يطلبها.
  - id: parameter-binding
    term: Parameter binding
    definitionEn: How ASP.NET Core fills a handler's parameters before calling it, from the route, query string, headers, body or form, or from dependency injection.
    definitionAr: الطريقة اللي ASP.NET Core بيملا بيها الـ parameters بتاعة الـ handler قبل ما يناديه، من الـ route أو الـ query string أو الـ headers أو الـ body أو الـ form، أو من الـ dependency injection.
  - id: configuration-provider
    term: Configuration provider
    definitionEn: A component that reads settings from one source, such as a JSON file, environment variables or command-line arguments, as flat key-value pairs. When several providers set the same key, the one added last wins.
    definitionAr: component بيقرا الـ settings من مصدر واحد، زي ملف JSON أو environment variables أو command-line arguments، على شكل key وقيمته. ولو كذا provider حطوا نفس الـ key، اللي اتضاف الآخر هو اللي بيكسب.
  - id: problem-details
    term: Problem Details
    definitionEn: The standard JSON shape for HTTP API errors defined by RFC 9457, sent as application/problem+json, with members such as type, title, status, detail and instance.
    definitionAr: الشكل القياسي لأخطاء الـ HTTP APIs اللي معرّف في RFC 9457، وبيتبعت كـ application/problem+json وفيه حاجات زي type و title و status و detail و instance.
  - id: options-pattern
    term: Options pattern
    definitionEn: Binding a section of configuration to a plain C# class and receiving it through dependency injection as IOptions<T>, IOptionsSnapshot<T> or IOptionsMonitor<T>, instead of reading string keys directly.
    definitionAr: إنك تعمل bind لـ section من الـ configuration على class عادية في C#، وتستلمها من الـ dependency injection كـ IOptions<T> أو IOptionsSnapshot<T> أو IOptionsMonitor<T>، بدل ما تقرا keys كـ strings بنفسك.
  - id: service-lifetime
    term: Service lifetime
    definitionEn: How long the dependency injection container keeps an instance of a service. Singleton means one instance for the whole app, scoped means one per request, and transient means a new one every time it's resolved.
    definitionAr: المدة اللي الـ dependency injection container بيحتفظ فيها بـ instance من الـ service. الـ Singleton يعني instance واحدة للتطبيق كله، والـ scoped يعني واحدة لكل request، والـ transient يعني واحدة جديدة كل مرة تتطلب.
  - id: captive-dependency
    term: Captive dependency
    definitionEn: A service held by another service that lives longer than it, such as a scoped DbContext injected into a singleton. The captured service then lives as long as its holder and is shared by everyone who uses the holder.
    definitionAr: service ماسكها service تانية عمرها أطول منها، زي DbContext متسجل scoped ومتعمله inject في singleton. ساعتها الـ service المحبوسة بتعيش قد اللي ماسكها، وبتبقى مشتركة بين كل اللي بيستخدموه.
  - id: cross-cutting-concern
    term: Cross-cutting concern
    definitionEn: Behavior that many parts of an app need but that belongs to none of them in particular, such as logging, error handling, authorization or input checks.
    definitionAr: سلوك أجزاء كتير من التطبيق محتاجاه بس مش تبع جزء واحد فيهم بالتحديد، زي الـ logging أو التعامل مع الأخطاء أو الـ authorization أو التشييك على الـ input.
  - id: structured-logging
    term: Structured logging
    definitionEn: Writing each log entry as named values, such as OrderId = 81723, alongside the text, so a log store can filter, group and count entries by those values instead of searching the text.
    definitionAr: إنك تكتب كل log entry على شكل قيم ليها أسماء، زي OrderId = 81723، جنب النص، عشان مكان تخزين الـ logs يقدر يفلتر ويجمّع ويعدّ الـ entries بالقيم دي بدل ما يدوّر في النص.
  - id: message-template
    term: Message template
    definitionEn: A constant log message with named placeholders, such as "Payment declined for order {OrderId}". The logger keeps the template and the values separately and only builds the text when a provider needs it.
    definitionAr: رسالة log ثابتة فيها placeholders ليها أسماء، زي "Payment declined for order {OrderId}". الـ logger بيحتفظ بالـ template والقيم كل واحد لوحده، ومش بيبني النص غير لما provider يحتاجه.
  - id: polymorphic-serialization
    term: Polymorphic serialization
    definitionEn: Writing an object according to its runtime type rather than the type it's declared as, so a CardPayment stored in a Payment property keeps its extra properties in the JSON.
    definitionAr: إنك تكتب الـ object حسب الـ type الحقيقي بتاعه وقت التشغيل، مش الـ type اللي متعرّف بيه، فـ CardPayment متخزن في property نوعها Payment يفضل محتفظ بالـ properties الزيادة بتاعته في الـ JSON.
  - id: port-exhaustion
    term: Port exhaustion
    definitionEn: Running out of the local TCP ports the operating system hands to outgoing connections. Each closed connection keeps its port reserved for a while in the TIME-WAIT state, so opening and closing connections quickly can use them all up.
    definitionAr: إن الـ TCP ports المحلية اللي نظام التشغيل بيديها للـ connections الخارجة تخلص. كل connection بتتقفل بتفضل حاجزة الـ port بتاعها شوية في حالة الـ TIME-WAIT، فلو فتحت وقفلت connections بسرعة ممكن تخلّصهم كلهم.
  - id: shared-cache
    term: Shared cache
    definitionEn: An HTTP cache that stores responses for reuse by more than one user, such as a proxy, a CDN or the ASP.NET Core response caching middleware. A browser's own cache is a private cache, dedicated to one user.
    definitionAr: HTTP cache بيخزّن الـ responses عشان يعيد استخدامها لأكتر من user، زي الـ proxy أو الـ CDN أو الـ response caching middleware في ASP.NET Core. أما الـ cache اللي جوه الـ browser فده private cache لـ user واحد بس.
  - id: cache-stampede
    term: Cache stampede
    definitionEn: When a popular cache entry is missing or has just expired and many concurrent requests miss it at once, so each one rebuilds the same value and the database or API behind the cache takes the whole burst.
    definitionAr: لما entry مشهور في الـ cache يبقى مش موجود أو مدته لسه خالصة، و requests كتير في نفس اللحظة متلاقيهوش، فكل واحد فيهم يبني نفس القيمة من الأول، والداتابيز أو الـ API اللي ورا الـ cache ياخد الضربة كلها.
  - id: sync-over-async
    term: Sync over async
    definitionEn: Calling an asynchronous method and then blocking the current thread until it finishes, with .Result, .Wait() or GetAwaiter().GetResult(), so the thread is held for the whole wait.
    definitionAr: إنك تنادي async method وبعدين توقّف الـ thread الحالي لحد ما تخلص، بـ .Result أو .Wait() أو GetAwaiter().GetResult()، فالـ thread بيفضل محجوز طول فترة الانتظار.
  - id: thread-pool-starvation
    term: Thread pool starvation
    definitionEn: When every thread pool thread is busy or blocked, so new work, including incoming requests and the continuations that would release the waiting threads, sits in the queue until the pool slowly adds threads.
    definitionAr: لما كل threads الـ thread pool تبقى مشغولة أو واقفة، فالشغل الجديد، ومنه الـ requests اللي داخلة والـ continuations اللي المفروض تفك الـ threads الواقفة، يفضل مستني في الطابور لحد ما الـ pool يضيف threads واحدة واحدة.
  - id: hosted-service
    term: Hosted service
    definitionEn: A class that implements IHostedService, usually by deriving from BackgroundService. The .NET host starts it with the app and, during a graceful shutdown, signals it to stop and waits for it to finish, up to the shutdown timeout.
    definitionAr: class بتعمل implement لـ IHostedService، وغالبًا بتورث من BackgroundService. الـ host بتاع .NET بيشغّلها مع التطبيق، ووقت الـ graceful shutdown بيقولها تقف وبيستناها تخلص، لحد الـ shutdown timeout.
  - id: backpressure
    term: Backpressure
    definitionEn: Slowing down the code that produces work when the code that processes it can't keep up, for example by making a write to a full bounded queue wait for free space, instead of letting pending work grow without limit.
    definitionAr: إنك تبطّأ الكود اللي بيضيف شغل لما الكود اللي بيعالجه مش لاحق، زي إن الكتابة في queue محدود ومليان تستنى لحد ما يفضى مكان، بدل ما الشغل المستني يكبر من غير حد.
  - id: distributed-cache
    term: Distributed cache
    definitionEn: A cache stored outside the app's process, such as Redis, SQL Server or Postgres, that every instance of the app reads and writes through IDistributedCache, so entries survive restarts and are shared between servers.
    definitionAr: cache متخزن برّه الـ process بتاع التطبيق، زي Redis أو SQL Server أو Postgres، وكل instance من التطبيق بيقرا ويكتب فيه من خلال IDistributedCache، فالـ entries بتعيش بعد الـ restart وبتبقى مشتركة بين السيرفرات.
  - id: expression-tree
    term: Expression tree
    definitionEn: Code represented as data, a tree of objects that describes a lambda such as o => o.CustomerId == 42. The compiler builds one when a lambda is assigned to Expression<Func<...>>, so a provider like EF Core can read it and translate it into SQL.
    definitionAr: كود متمثّل كداتا، يعني شجرة objects بتوصف lambda زي o => o.CustomerId == 42. الـ compiler بيبنيها لما الـ lambda تتحط في Expression<Func<...>>، فـ provider زي EF Core يقدر يقراها ويترجمها لـ SQL.
  - id: client-evaluation
    term: Client evaluation
    definitionEn: Running part of a LINQ query in your .NET process instead of in the database. EF Core does it on its own only in the final Select; anywhere else you opt in with AsEnumerable or ToList, and every operator after that works on rows already loaded.
    definitionAr: إن جزء من الـ LINQ query يتنفذ جوه الـ process بتاع .NET بدل الداتابيز. EF Core بيعمله لوحده في آخر Select بس، وفي أي مكان تاني انت اللي بتختاره بـ AsEnumerable أو ToList، وكل operator بعدها بيشتغل على rows اتحمّلت خلاص.
  - id: change-tracker
    term: Change tracker
    definitionEn: The part of an EF Core DbContext that records every entity instance it has loaded or been given, with its state and original property values, so SaveChanges knows what to insert, update or delete.
    definitionAr: الجزء من الـ DbContext في EF Core اللي بيسجّل كل entity حمّلها أو اتدّتله، ومعاها حالتها والقيم الأصلية بتاعة الـ properties، عشان الـ SaveChanges يعرف يعمل insert أو update أو delete لإيه.
  - id: identity-resolution
    term: Identity resolution
    definitionEn: Keeping at most one instance per entity key in a DbContext. When a tracking query returns a row whose key is already tracked, EF Core returns the existing instance instead of building a new one from the row.
    definitionAr: إن الـ DbContext يفضل ماسك instance واحدة بس لكل key. فلما tracking query ترجّع row الـ key بتاعه متتبّع أصلًا، EF Core بيرجّع الـ instance الموجودة بدل ما يبني واحدة جديدة من الـ row.
  - id: unit-of-work
    term: Unit of work
    definitionEn: One business operation whose changes are collected and then written to the database together. An EF Core DbContext instance is designed to live for a single unit of work.
    definitionAr: عملية business واحدة التغييرات بتاعتها بتتجمّع وبعدين تتكتب في الداتابيز مع بعض. والـ DbContext في EF Core معمول عشان يعيش لـ unit of work واحدة بس.
  - id: execution-strategy
    term: Execution strategy
    definitionEn: The EF Core component that runs each database operation and, when configured to retry (for example with EnableRetryOnFailure), replays an operation that failed with a transient error such as a dropped connection.
    definitionAr: الـ component في EF Core اللي بيشغّل كل عملية على الداتابيز، ولو متظبط إنه يعيد (زي بـ EnableRetryOnFailure) بيعيد تشغيل العملية اللي فشلت بسبب error مؤقت زي connection اتقطع.
  - id: savepoint
    term: Savepoint
    definitionEn: A named point inside a database transaction that you can roll back to without abandoning the whole transaction, so the work done before it is kept.
    definitionAr: نقطة ليها اسم جوه transaction في الداتابيز، تقدر ترجع لها بـ rollback من غير ما تلغي الـ transaction كلها، فالشغل اللي اتعمل قبلها بيفضل زي ما هو.
  - id: dependency-rule
    term: Dependency Rule
    definitionEn: The core rule of Robert C. Martin's Clean Architecture. Source code dependencies point only inward, toward business policy, so inner code never names a class, function or data format that belongs to an outer layer such as the web, the database or a framework.
    definitionAr: القاعدة الأساسية في الـ Clean Architecture بتاعة Robert C. Martin. الـ dependencies في الكود بتشاور لجوه بس، ناحية الـ business policy، فالكود اللي جوه عمره ما يذكر class أو function أو شكل داتا تبع layer برّه زي الـ web أو الداتابيز أو أي framework.
  - id: dependency-inversion
    term: Dependency inversion
    definitionEn: Making high-level code depend on an abstraction it owns, such as an interface, while the low-level code implements that abstraction. The call still goes from high to low level at run time, but the compile-time dependency points the other way.
    definitionAr: إنك تخلّي الكود الـ high-level يعتمد على abstraction هو اللي بيملكها، زي interface، والكود الـ low-level هو اللي يعملها implement. الـ call وقت التشغيل لسه رايح من الـ high للـ low، بس الـ dependency وقت الـ compile بتشاور في الاتجاه العكسي.
  - id: composition-root
    term: Composition root
    definitionEn: The single place, usually Program.cs, where an app registers concrete implementations for the interfaces its code depends on, so the rest of the code never creates or names those implementations.
    definitionAr: المكان الوحيد، وغالبًا بيبقى Program.cs، اللي التطبيق بيسجّل فيه الـ implementations الحقيقية للـ interfaces اللي الكود معتمد عليها، فباقي الكود عمره ما يعمل الـ implementations دي أو يذكرها بالاسم.
  - id: cqrs
    term: CQRS
    definitionEn: Command Query Responsibility Segregation. Using one model for operations that change state (commands) and a separate model for operations that read it (queries), where a design would otherwise use one model for both.
    definitionAr: اختصار Command Query Responsibility Segregation. إنك تستخدم model للعمليات اللي بتغيّر الحالة (commands) و model تاني منفصل للعمليات اللي بتقراها (queries)، بدل model واحد للاتنين.
  - id: event-sourcing
    term: Event sourcing
    definitionEn: Storing an entity's state as the append-only sequence of events that changed it, instead of storing its current values. The current state is rebuilt by replaying the events.
    definitionAr: إنك تخزّن حالة الـ entity على شكل سلسلة events بتتضاف بس ومش بتتعدّل، وكل event غيّر فيها حاجة، بدل ما تخزّن القيم الحالية بتاعتها. والحالة الحالية بتتبني من جديد بإعادة تشغيل الـ events دي.
  - id: eventual-consistency
    term: Eventual consistency
    definitionEn: A guarantee that copies of the same data will agree once updates stop arriving, but not immediately. For a while after a write, a read from another copy can return older data.
    definitionAr: ضمان إن النسخ المختلفة من نفس الداتا هتتطابق في الآخر لما التحديثات تقف، بس مش على طول. فلفترة بعد الكتابة، القراية من نسخة تانية ممكن ترجّع داتا أقدم.
  - id: n-plus-one-problem
    term: N+1 problem
    definitionEn: Running one query to load a list and then one more query for each item to load its related data, so a page of N items costs N+1 database round trips. Lazy loading and queries inside loops are the usual causes.
    definitionAr: إنك تشغّل query واحدة تجيب لستة، وبعدين query زيادة لكل item عشان تجيب الداتا المرتبطة بيه، فصفحة فيها N items تكلفك N+1 رحلة للداتابيز. والـ lazy loading والـ queries اللي جوه loops هما السبب المعتاد.
  - id: cartesian-explosion
    term: Cartesian explosion
    definitionEn: The row multiplication you get when one SQL query joins a parent to two or more of its collections at the same level. Each row of one collection is paired with each row of the other, so 10 lines and 3 payments return 30 rows for one order.
    definitionAr: تضاعف الـ rows اللي بيحصل لما query واحدة تعمل join للـ parent مع 2 collections أو أكتر في نفس المستوى. كل row من collection بيتجمع مع كل row من التانية، فـ 10 lines و 3 payments بيرجّعوا 30 row لـ order واحد.
  - id: split-query
    term: Split query
    definitionEn: An EF Core query mode, turned on with AsSplitQuery, that loads each included or projected collection with its own SQL query instead of joining them all into one, which avoids a cartesian explosion at the cost of extra round trips.
    definitionAr: mode في EF Core بيتشغّل بـ AsSplitQuery، وبيحمّل كل collection متضافة أو معمولها projection بـ SQL query لوحدها بدل ما يعمل join ليهم كلهم في query واحدة، وده بيمنع الـ cartesian explosion مقابل رحلات زيادة للداتابيز.
