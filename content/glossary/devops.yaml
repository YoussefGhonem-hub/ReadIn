terms:
  - id: git-commit
    term: Commit (Git)
    definitionEn: >-
      A snapshot of every tracked file in the project, stored with its author, message and a pointer to the commit or
      commits before it. Git names it by a hash of its content, so a commit never changes once written.
    definitionAr: >-
      snapshot لكل الملفات اللي Git متابعها في المشروع، متخزّنة مع اسم اللي عملها والرسالة و pointer للـ commit أو
      الـ commits اللي قبلها. Git بيسمّيها بـ hash محسوب من محتواها، فالـ commit مابتتغيّرش بعد ما تتكتب.
  - id: git-branch
    term: Branch (Git)
    definitionEn: >-
      A name that points to one commit, stored as a tiny ref file. When you commit on a branch, Git moves that pointer
      to the new commit; no project files are copied.
    definitionAr: >-
      اسم بيشاور على commit واحدة، ومتخزّن في ملف ref صغير جدًا. ولما تعمل commit وانت على branch، Git بيحرّك الـ
      pointer ده للـ commit الجديدة، ومفيش ولا ملف من ملفات المشروع بيتنسخ.
  - id: git-head
    term: HEAD (Git)
    definitionEn: >-
      Git's pointer to what you have checked out. Usually it names a branch (ref: refs/heads/main), which is how Git
      knows which branch a new commit should move. When it holds a commit hash directly, it's a "detached HEAD".
    definitionAr: >-
      الـ pointer اللي Git بيعرف بيه انت عامل checkout لإيه. غالبًا بيشاور على branch (ref: refs/heads/main)، وبكده
      Git بيعرف أنهي branch تتحرك مع الـ commit الجديدة. ولو شايل hash بتاع commit على طول يبقى اسمه "detached HEAD".
  - id: remote-tracking-branch
    term: Remote-tracking branch
    definitionEn: >-
      A local bookmark such as origin/main that records where a branch on a remote was the last time you talked to it.
      Git moves it when it talks to the remote, as in fetch and pull; you don't move it yourself, and moving it never
      moves your own branches.
    definitionAr: >-
      علامة محلية زي origin/main بتسجّل الـ branch اللي على الـ remote كانت فين آخر مرة كلّمته. Git بيحرّكها لما يكلّم
      الـ remote، زي في الـ fetch والـ pull، وانت مابتحرّكهاش بإيدك، وحركتها عمرها ما بتحرّك الـ branches بتاعتك.
  - id: fast-forward
    term: Fast-forward (Git)
    definitionEn: >-
      Updating a branch by moving its pointer ahead to a newer commit that already contains it. It's only possible when
      the branch has no commits of its own that the other side lacks, and it creates no merge commit.
    definitionAr: >-
      إنك تحدّث branch بإنك تقدّم الـ pointer بتاعها لـ commit أحدث فيها كل اللي عندها. وده ممكن بس لما الـ branch
      مايكونش فيها commits خاصة بيها مش موجودة عند الناحية التانية، ومش بيعمل merge commit.
  - id: os-kernel
    term: Kernel
    definitionEn: >-
      The core of an operating system. It runs every process, hands out memory and CPU time, talks to the hardware and
      answers system calls. All containers on a Linux host run on that host's one kernel.
    definitionAr: >-
      قلب الـ operating system. هو اللي بيشغّل كل process، ويوزّع الـ memory ووقت الـ CPU، ويكلّم الـ hardware، ويرد على
      الـ system calls. وكل الـ containers اللي على Linux host واحد بتشتغل على الـ kernel الواحد بتاعه.
  - id: linux-namespace
    term: Namespace (Linux)
    definitionEn: >-
      A Linux kernel feature that gives a group of processes their own view of a global resource, such as process IDs,
      mount points, the network stack or the hostname. Containers are built from a set of namespaces.
    definitionAr: >-
      feature في الـ Linux kernel بتدّي مجموعة processes نظرة خاصة بيها لـ resource عام، زي الـ process IDs أو الـ mount
      points أو الـ network stack أو الـ hostname. والـ containers معمولة من مجموعة namespaces.
  - id: cgroup
    term: cgroup (control group)
    definitionEn: >-
      A Linux kernel feature that puts processes into groups whose use of resources such as memory, CPU and disk I/O can
      be limited and measured. Docker's --memory limit, for example, is enforced through a cgroup.
    definitionAr: >-
      feature في الـ Linux kernel بتحط الـ processes في مجموعات، وتقدر تحدّد وتقيس استهلاكها للـ resources زي الـ memory
      والـ CPU والـ disk I/O. والـ limit بتاع --memory في Docker مثلًا بيتنفّذ عن طريق cgroup.
  - id: container-image
    term: Container image
    definitionEn: >-
      A read-only package of files, libraries and settings that containers start from, built as a stack of layers.
      Running a container never changes its image; to change it, you build a new image.
    definitionAr: >-
      package للقراية بس فيها الملفات والـ libraries والـ settings اللي الـ containers بتبدأ منها، ومتبنية كـ layers فوق بعض.
      وتشغيل container عمره ما بيغيّر الـ image بتاعته، ولو عايز تغيّرها بتعمل build لـ image جديدة.
  - id: container-layer
    term: Container layer (writable layer)
    definitionEn: >-
      The thin writable layer Docker adds on top of an image's read-only layers for each container. Every file the
      container creates, changes or deletes is recorded there, and it's deleted together with the container.
    definitionAr: >-
      الـ layer الرفيعة اللي بتقبل الكتابة، و Docker بيحطها لكل container فوق الـ layers اللي للقراية بس بتاعة الـ image. أي
      ملف الـ container بيعمله أو يعدّله أو يمسحه بيتسجّل فيها، وبتتمسح مع الـ container نفسه.
  - id: docker-volume
    term: Volume (Docker)
    definitionEn: >-
      Persistent storage created and managed by Docker and mounted into containers at a path. Its contents live outside
      any container's lifecycle, so they survive removing and recreating the container.
    definitionAr: >-
      storage دايمة Docker بيعملها ويديرها، وبتتركّب جوه الـ containers على path معيّن. ومحتواها عايش بره دورة حياة أي
      container، فبيفضل موجود لو مسحت الـ container وعملته من جديد.
  - id: continuous-integration
    term: Continuous Integration (CI)
    definitionEn: >-
      A team practice where everyone merges their work into the shared mainline at least daily, and every merge is
      verified by an automated build with tests. A CI server helps, but running one on long-lived branches isn't CI.
    definitionAr: >-
      ممارسة بيعملها الفريق: كل واحد بيدمج شغله في الـ mainline المشتركة مرة في اليوم على الأقل، وكل دمج بيتأكد منه
      automated build فيه tests. والـ CI server بيساعد، لكن تشغيله على branches بتعيش أسابيع مش CI.
  - id: continuous-delivery
    term: Continuous Delivery
    definitionEn: >-
      Building software so that it can be released to production at any time, on demand. Every change is kept
      deployable and pushed through a deployment pipeline, but a person may still decide when to release.
    definitionAr: >-
      إنك تبني السوفتوير بطريقة تخلّيه جاهز يطلع production في أي وقت تطلبه. كل تغيير بيفضل قابل للـ deploy وبيعدّي على
      deployment pipeline، بس ممكن لسه حد يقرر إمتى يعمل release.
  - id: continuous-deployment
    term: Continuous Deployment
    definitionEn: >-
      Going one step past continuous delivery: every change that passes the deployment pipeline goes to production
      automatically, with no human decision in between. It requires continuous delivery first.
    definitionAr: >-
      خطوة بعد الـ continuous delivery: أي تغيير بيعدّي الـ deployment pipeline بيروح production لوحده، من غير قرار من حد
      في النص. ولازم يكون قبله continuous delivery.
  - id: deployment-pipeline
    term: Deployment pipeline
    definitionEn: >-
      The automated path a change takes from commit to production, split into stages: a fast build and test first,
      slower tests and checks after. Its job is to catch changes that would cause problems in production.
    definitionAr: >-
      الطريق الـ automated اللي أي تغيير بيمشيه من الـ commit لحد الـ production، ومقسوم stages: build و tests سريعة الأول،
      وبعدها tests وchecks أبطأ. وشغلته إنه يمسك التغييرات اللي هتعمل مشاكل في الـ production.
  - id: shared-responsibility-model
    term: Shared responsibility model
    definitionEn: >-
      The split of duties between a cloud provider and its customers. The provider runs and protects the platform; the
      customer chooses and configures the reliability and security features it offers, designs the application and
      owns its data.
    definitionAr: >-
      تقسيم المسؤوليات بين الـ cloud provider والعميل. الـ provider بيشغّل الـ platform ويحميها، والعميل هو اللي بيختار
      ويظبط features الـ reliability والأمان اللي بتقدّمها، وبيصمّم الـ application، والداتا بتاعته مسؤوليته.
  - id: availability-zone
    term: Availability zone
    definitionEn: >-
      A group of one or more datacenters inside a cloud region with its own power, cooling and networking, so a failure
      in one zone leaves the others running. A resource survives a zone outage only when it runs in two or more zones.
    definitionAr: >-
      مجموعة فيها datacenter واحد أو أكتر جوه الـ region، ليها كهربا وتبريد و networking مستقلين، فلو zone وقعت الباقي
      بيفضل شغال. والـ resource مابتعدّيش وقوع zone غير لو شغالة في zone اتنين أو أكتر.
  - id: service-level-agreement
    term: Service-level agreement (SLA)
    definitionEn: >-
      A provider's contractual uptime commitment for a service in a specific configuration. When it's missed, the
      remedy it defines is a service credit on the bill, not compensation for the customer's losses.
    definitionAr: >-
      التزام تعاقدي من الـ provider بنسبة uptime لـ service بـ configuration معيّنة. ولو ماتحققش، التعويض اللي بيحدّده
      هو service credit على الفاتورة، مش تعويض عن خسارة العميل.
  - id: distributed-trace
    term: Distributed trace
    definitionEn: >-
      The record of one request's path through a system, across every service it touches. It's a tree of spans that
      share a trace ID, so you can see which step the request spent its time in.
    definitionAr: >-
      سجل الطريق اللي request واحد مشيه جوه السيستم، عبر كل service عدّى عليها. هو شجرة من الـ spans بتشترك في trace ID
      واحد، فتقدر تشوف الـ request ضيّع وقته في أنهي خطوة.
  - id: trace-span
    term: Span
    definitionEn: >-
      One unit of work inside a trace, such as an HTTP call or a database query, with a name, a start time, a duration,
      attributes and a link to its parent span. In .NET, spans are represented by System.Diagnostics.Activity.
    definitionAr: >-
      وحدة شغل واحدة جوه الـ trace، زي HTTP call أو database query، ليها اسم ووقت بداية ومدة و attributes ورابط للـ span
      الأب بتاعها. وفي .NET الـ spans بيمثّلها System.Diagnostics.Activity.
  - id: merge-commit
    term: Merge commit
    definitionEn: >-
      A commit with two or more parents, created when Git joins lines of history that have diverged. It records the
      combined snapshot and leaves every earlier commit, and its ID, unchanged.
    definitionAr: >-
      commit ليها اتنين parents أو أكتر، Git بيعملها لما يجمع خطين history اتفرقوا. بتسجّل الـ snapshot المجمّعة، وبتسيب
      كل الـ commits اللي قبلها والـ IDs بتاعتها زي ما هي.
  - id: force-push
    term: Force push
    definitionEn: >-
      A push that replaces a remote branch even when the new commits don't contain the old ones (git push --force).
      Commits that were only on the remote branch are no longer on it afterwards.
    definitionAr: >-
      push بيستبدل branch على الـ remote حتى لو الـ commits الجديدة مش شايلة القديمة جواها (git push --force). والـ
      commits اللي كانت على الـ branch دي في الـ remote بس، بتختفي منها بعده.
  - id: git-index
    term: Index (Git staging area)
    definitionEn: >-
      The snapshot Git will use for your next commit. git add copies changes into it, git commit records it, and
      git reset can make it match an older commit again.
    definitionAr: >-
      الـ snapshot اللي Git هيستخدمها في الـ commit الجاية. الـ git add بينسخ التغييرات فيها، والـ git commit بيسجّلها،
      والـ git reset ممكن يرجّعها زي commit أقدم.
  - id: git-reflog
    term: Reflog
    definitionEn: >-
      A local log of where HEAD and each branch pointed over time. It lets you find and restore commits that no branch
      points to any more, such as after a reset, until old entries expire.
    definitionAr: >-
      سجل محلي بيقول الـ HEAD وكل branch كانوا بيشاوروا على إيه على مدار الوقت. بيخلّيك تلاقي وترجّع commits مفيش branch
      بيشاور عليها خلاص، زي بعد reset، لحد ما الـ entries القديمة تنتهي صلاحيتها.
  - id: loopback-interface
    term: Loopback interface (localhost)
    definitionEn: >-
      The network interface a system uses to talk to itself, at 127.0.0.1 and ::1, reached by the name localhost.
      Every container has its own, so localhost inside a container means that container.
    definitionAr: >-
      الـ network interface اللي السيستم بيكلّم بيها نفسه، على 127.0.0.1 و ::1، وبتوصلها بالاسم localhost. وكل container
      ليه واحدة خاصة بيه، فالـ localhost جوه الـ container معناها الـ container نفسه.
  - id: published-port
    term: Published port (Docker)
    definitionEn: >-
      A mapping from a port on the Docker host to a port inside a container, set with -p host:container. It lets
      traffic from outside the container network in; containers on the same network don't need it.
    definitionAr: >-
      ربط بين port على الـ Docker host و port جوه الـ container، بيتعمل بـ -p host:container. بيدخّل الـ traffic اللي جاي
      من بره الـ network بتاعة الـ containers، والـ containers اللي على نفس الـ network مش محتاجاه.
  - id: docker-build-cache
    term: Build cache (Docker)
    definitionEn: >-
      The stored results of earlier Dockerfile steps. On each build, Docker reuses a step's result while the
      instruction and the files it copies are unchanged; after the first step that changed, every later step runs again.
    definitionAr: >-
      النتايج المتخزّنة من خطوات الـ Dockerfile اللي اتنفّذت قبل كده. في كل build، Docker بيعيد استخدام نتيجة الخطوة طول
      ما الـ instruction والملفات اللي بتنسخها ماتغيّروش، وبعد أول خطوة اتغيّرت، كل الخطوات اللي بعدها بتتنفّذ تاني.
  - id: multi-stage-build
    term: Multi-stage build
    definitionEn: >-
      A Dockerfile with several FROM instructions, each starting a new stage. Later stages copy only the files they
      need from earlier ones, so compilers and build-only dependencies stay out of the final image.
    definitionAr: >-
      Dockerfile فيه أكتر من FROM، وكل واحد بيبدأ stage جديدة. الـ stages اللي بعد كده بتنسخ من اللي قبلها الملفات
      اللي محتاجاها بس، فالـ compilers والـ dependencies اللي للـ build بس مابتدخلش الـ image النهائية.
  - id: image-tag
    term: Image tag
    definitionEn: >-
      A name after the colon in an image reference, such as 1.4.0 in shop-api:1.4.0. It's a pointer that whoever can
      push to the repository may move to another image. When no tag is given, Docker uses latest.
    definitionAr: >-
      الاسم اللي بعد الـ colon في اسم الـ image، زي 1.4.0 في shop-api:1.4.0. هو pointer أي حد عنده صلاحية push على الـ
      repository يقدر يحرّكه لـ image تانية. ولو مافيش tag، Docker بيستخدم latest.
  - id: image-digest
    term: Image digest
    definitionEn: >-
      The content hash that identifies one exact image, written as sha256: followed by 64 hex characters. Any change to
      the image gives a different digest, so a reference by digest always means the same bytes.
    definitionAr: >-
      الـ hash بتاع المحتوى اللي بيحدّد image واحدة بالظبط، ومكتوب sha256: وبعدها 64 حرف hex. أي تغيير في الـ image
      بيدّي digest مختلف، فلما تشاور على image بالـ digest بتاعها بتبقى دايمًا نفس الـ bytes.
  - id: desired-state
    term: Desired state (Kubernetes)
    definitionEn: >-
      What you want an object to look like, written in its spec, such as three replicas of an image. Kubernetes
      reports what is really running in the object's status, and its controllers keep working to make the two match.
    definitionAr: >-
      الشكل اللي انت عايز الـ object يبقى عليه، ومكتوب في الـ spec بتاعه، زي 3 replicas من image معيّنة. و Kubernetes
      بيكتب اللي شغال فعلًا في الـ status، والـ controllers بتفضل شغالة عشان الاتنين يبقوا زي بعض.
  - id: control-loop
    term: Control loop (Kubernetes controller)
    definitionEn: >-
      A loop that never ends: it watches the current state of a system, compares it with the desired state and acts to
      close the gap, like a thermostat. Every Kubernetes controller, such as the ReplicaSet controller, is one.
    definitionAr: >-
      loop مابتخلصش: بتراقب الحالة الحالية للسيستم، وتقارنها بالـ desired state، وتتصرّف عشان تقفل الفرق، زي الـ
      thermostat بالظبط. وكل controller في Kubernetes، زي الـ ReplicaSet controller، هو loop من النوع ده.
  - id: replicaset
    term: ReplicaSet
    definitionEn: >-
      A Kubernetes object that keeps a set number of Pods running. Its controller counts the Pods that match its label
      selector and creates or deletes Pods from its template to reach that number. Deployments create and manage them.
    definitionAr: >-
      object في Kubernetes بيحافظ على عدد ثابت من الـ Pods شغالين. الـ controller بتاعه بيعدّ الـ Pods اللي ماتشة مع
      الـ label selector بتاعه، ويعمل أو يمسح Pods من الـ template عشان يوصل للعدد ده. والـ Deployments هي اللي بتعمله وتديره.
  - id: build-artifact
    term: Build artifact
    definitionEn: >-
      The deployable output of a build, such as a container image, a package or a compiled bundle. In a build-once
      pipeline it's created one time, identified by a version or digest, and promoted unchanged through every
      environment.
    definitionAr: >-
      الناتج اللي بيطلع من الـ build وبيتعمله deploy، زي container image أو package أو bundle متعمله compile. وفي
      pipeline بتعمل build مرة واحدة، بيتعمل مرة واحدة بس، وليه version أو digest يعرّفه، وبيعدّي على كل الـ
      environments من غير ما يتغيّر.
  - id: feature-flag
    term: Feature flag (feature toggle)
    definitionEn: >-
      A switch in the code that picks between code paths at runtime, based on configuration or on who is asking. It lets
      a team deploy code without releasing it, release it to some users first, or turn it off without a new deploy.
    definitionAr: >-
      مفتاح جوه الكود بيختار بين طريقين وهو شغال، على حسب الـ configuration أو مين اللي بيطلب. بيخلّي الفريق يعمل deploy
      للكود من غير ما يعمله release، أو يطلّعه لمستخدمين معيّنين الأول، أو يقفله من غير deploy جديد.
  - id: dark-launch
    term: Dark launch
    definitionEn: >-
      Calling a new or changed back-end behavior from real user traffic while hiding its results, so the team can measure
      its load and performance before users can see or use the feature.
    definitionAr: >-
      إنك تشغّل سلوك جديد أو متعدّل في الـ back-end مع الـ traffic الحقيقي بتاع المستخدمين وتخبّي نتيجته، عشان الفريق يقيس
      الـ load والـ performance بتوعه قبل ما المستخدمين يشوفوا الـ feature أو يستخدموها.
  - id: canary-release
    term: Canary release
    definitionEn: >-
      Turning a new feature or version on for a small cohort of users first, and widening it only while its metrics stay
      healthy. Each user should stay in the same cohort, so their experience doesn't flip between requests.
    definitionAr: >-
      إنك تشغّل feature أو نسخة جديدة لمجموعة صغيرة من المستخدمين الأول، وتوسّعها بس طول ما الـ metrics بتاعتها كويسة. وكل
      مستخدم المفروض يفضل في نفس المجموعة، عشان التجربة بتاعته ماتتقلبش من request للتاني.
  - id: semantic-versioning
    term: Semantic Versioning (SemVer)
    definitionEn: >-
      A convention for version numbers in the form MAJOR.MINOR.PATCH: the major number changes for incompatible
      changes to the public API, the minor for backward compatible features, the patch for backward compatible fixes.
      The author picks each number, so it is a promise, not a check.
    definitionAr: >-
      اتفاق على شكل أرقام الـ versions بالشكل MAJOR.MINOR.PATCH: رقم الـ major بيتغيّر مع أي تغيير مش compatible في الـ
      public API، والـ minor مع features جديدة compatible، والـ patch مع fixes compatible. والـ author
      هو اللي بيختار كل رقم، فهو وعد مش فحص.
  - id: lockfile
    term: Lockfile
    definitionEn: >-
      A generated file, such as package-lock.json or pubspec.lock, that records the exact version, source and hash of
      every dependency installed, including transitive ones, so later installs reproduce the same tree.
    definitionAr: >-
      ملف بيتعمل أوتوماتيك، زي package-lock.json أو pubspec.lock، بيسجّل الـ version بالظبط والمصدر والـ hash لكل
      dependency اتسطّبت، حتى اللي جاية بشكل غير مباشر، عشان أي install بعد كده يطلّع نفس الشجرة.
  - id: latency-percentile
    term: Percentile (latency)
    definitionEn: >-
      The value that a given share of requests are at or under. A p95 of 300 ms means 95% of requests took 300 ms or
      less; p50, the median, describes the typical request, and p99 the slow ones.
    definitionAr: >-
      القيمة اللي نسبة معيّنة من الـ requests بتساويها أو أقل منها. يعني p95 قيمته 300 ms معناها إن 95% من الـ requests
      خدت 300 ms أو أقل، والـ p50، أو الـ median، بيوصف الـ request العادي، والـ p99 بيوصف البطيئة.
  - id: tail-latency
    term: Tail latency
    definitionEn: >-
      The latency of the slowest requests, usually read as p99 or p99.9. It's invisible in an average, and it matters
      more than its share suggests when one page waits on several backends.
    definitionAr: >-
      الـ latency بتاعة أبطأ requests، وغالبًا بتتقري كـ p99 أو p99.9. مابتبانش في المتوسط، وأهميتها أكبر من نسبتها لما
      صفحة واحدة تستنى كذا backend.
  - id: metrics-histogram
    term: Histogram (metrics)
    definitionEn: >-
      A metric that counts observations, such as request durations, in buckets of value ranges. Bucket counts from many
      servers can be added up, so percentiles can be computed for the whole service at query time.
    definitionAr: >-
      metric بيعدّ الـ observations، زي مدة الـ requests، في buckets لكل range من القيم. والـ counts بتاعة الـ buckets من
      servers كتير ممكن تتجمع على بعض، فتقدر تحسب الـ percentiles للـ service كلها وقت الـ query.
  - id: liveness-probe
    term: Liveness probe
    definitionEn: >-
      A periodic check the kubelet runs against a container to decide whether to restart it. After failureThreshold
      failures in a row (3 by default), the container is killed and restarted, so it should only fail when a restart
      would actually help, such as a deadlock.
    definitionAr: >-
      check بيعمله الـ kubelet على الـ container كل شوية عشان يقرر يعمله restart ولا لأ. وبعد ما يفشل failureThreshold مرة
      ورا بعض (3 في الـ default)، الـ container بيتقتل ويقوم من جديد، فالمفروض مايفشلش غير لما الـ restart يفيد فعلًا، زي
      حالة deadlock.
  - id: readiness-probe
    term: Readiness probe
    definitionEn: >-
      A periodic check that decides whether a container should receive traffic. When it fails, the Pod's Ready condition
      turns false and Services stop routing requests to it, but the container keeps running and isn't restarted.
    definitionAr: >-
      check بيتعمل كل شوية عشان يقرر الـ container ياخد traffic ولا لأ. ولما يفشل، الـ Ready condition بتاعة الـ Pod
      بتبقى false والـ Services بتبطّل تبعتله requests، بس الـ container بيفضل شغال ومش بيتعمله restart.
  - id: pod-qos-class
    term: QoS class (Kubernetes Pod)
    definitionEn: >-
      A label Kubernetes derives from a Pod's requests and limits: Guaranteed when every container's CPU and memory
      requests equal its limits, BestEffort when none are set, Burstable otherwise. It helps predict which Pods go
      first when a node runs short of memory.
    definitionAr: >-
      تصنيف Kubernetes بيطلّعه من الـ requests والـ limits بتاعة الـ Pod: Guaranteed لما الـ requests بتاعة الـ CPU والـ
      memory تساوي الـ limits في كل container، و BestEffort لما مفيش ولا واحدة متحددة، و Burstable في أي حالة تانية.
      وبيساعدك تتوقع أنهي Pods هتمشي الأول لما الـ node يقصر في الـ memory.
  - id: cpu-throttling
    term: CPU throttling
    definitionEn: >-
      What the Linux kernel does when a cgroup uses up its CPU quota for the current period: it stops running that
      cgroup's processes until the next period starts. A Kubernetes CPU limit becomes such a quota, so a busy container
      slows down instead of being killed.
    definitionAr: >-
      اللي الـ Linux kernel بيعمله لما cgroup تخلّص الـ CPU quota بتاعتها في الفترة الحالية: بيوقّف تشغيل الـ processes
      بتاعتها لحد ما الفترة اللي بعدها تبدأ. والـ CPU limit في Kubernetes بيتحوّل لـ quota من النوع ده، فالـ container
      المشغول بيبطّأ بدل ما يتقتل.
  - id: service-level-indicator
    term: Service level indicator (SLI)
    definitionEn: >-
      A carefully defined measure of the service users get, usually written as good events divided by valid events,
      such as successful requests over all requests, or requests faster than 300 ms over all requests.
    definitionAr: >-
      مقياس متعرّف بدقة للخدمة اللي المستخدمين بياخدوها، وغالبًا بيتكتب كـ events كويسة على كل الـ events الصالحة، زي
      الـ requests الناجحة على كل الـ requests، أو الـ requests اللي أسرع من 300 ms على كل الـ requests.
  - id: service-level-objective
    term: Service level objective (SLO)
    definitionEn: >-
      A target for an SLI over a time window, such as 99.9% of requests succeeding over four weeks, deliberately set
      below 100%. An SLA is a contract with consequences for missing its SLOs; an SLO on its own has none.
    definitionAr: >-
      هدف لـ SLI على مدى فترة زمنية، زي إن 99.9% من الـ requests تنجح على مدار 4 أسابيع، وبيتحط تحت الـ 100% عن قصد.
      والـ SLA عقد ليه عواقب لو الـ SLOs اللي فيه ماتحققتش، أما الـ SLO لوحده فملوش عواقب.
  - id: error-budget
    term: Error budget
    definitionEn: >-
      The amount of failure an SLO allows in its window: 100% minus the SLO, times the valid events. While budget
      remains, a team can spend it on releases and experiments; when it runs out, its error budget policy applies.
    definitionAr: >-
      كمية الفشل اللي الـ SLO بيسمح بيها في الفترة بتاعته: 100% ناقص الـ SLO، مضروبة في الـ events الصالحة. وطول ما فيه
      budget، الفريق يقدر يصرفه على releases وتجارب، ولما يخلص بتتطبّق الـ error budget policy بتاعته.
