terms:
  - id: impeller
    term: Impeller
    definitionEn: >-
      Flutter's rendering engine. It turns the scene the framework paints into pixels on the GPU and compiles its
      shaders when the engine is built, not while the app runs.
    definitionAr: >-
      الـ rendering engine بتاع Flutter. بيحوّل الـ scene اللي الـ framework رسمها لـ pixels على الـ GPU، وبيعمل
      compile للـ shaders بتاعته وقت بناء الـ engine نفسه، مش وانت شغال في التطبيق.
  - id: platform-view
    term: Platform view
    definitionEn: >-
      A real native view (an Android View or an iOS UIView) embedded inside a Flutter UI through widgets such as
      AndroidView and UiKitView. It costs extra synchronization work compared to a normal widget.
    definitionAr: >-
      view native حقيقية (Android View أو UIView على iOS) بتتحط جوه واجهة Flutter عن طريق widgets زي AndroidView
      وUiKitView. ليها تمن زيادة في الـ synchronization مقارنةً بأي widget عادي.
  - id: platform-channel
    term: Platform channel
    definitionEn: >-
      The messaging mechanism between your Dart code and the platform-specific code of the host app, for example a
      MethodChannel that calls Kotlin or Swift code and waits for its result.
    definitionAr: >-
      طريقة تبادل الرسايل بين كود Dart بتاعك والكود الخاص بالـ platform في التطبيق، زي MethodChannel بينادي كود
      Kotlin أو Swift ويستنى النتيجة.
  - id: element-tree
    term: Element tree
    definitionEn: >-
      Flutter's tree of Element objects, one for each widget at a place in the UI. Elements survive rebuilds, keep the
      State of stateful widgets and link each widget to its render object.
    definitionAr: >-
      الـ tree بتاعة الـ Element objects في Flutter، element لكل widget في مكانه في الواجهة. الـ elements بتعيش بعد
      الـ rebuild، وبتحتفظ بالـ State بتاع الـ stateful widgets، وبتربط كل widget بالـ render object بتاعه.
  - id: render-object
    term: Render object
    definitionEn: >-
      An object in Flutter's render tree that does the real layout, painting and hit testing. Only render object
      widgets such as Padding create one; the framework updates it in place across rebuilds.
    definitionAr: >-
      object في الـ render tree بتاعة Flutter بيعمل الشغل الحقيقي: الـ layout والرسم والـ hit testing. مفيش غير الـ
      render object widgets زي Padding اللي بتعمله، والـ framework بيحدّثه في مكانه مع كل rebuild.
  - id: box-constraints
    term: Box constraints
    definitionEn: >-
      The four numbers a Flutter parent passes to its child during layout: a minimum and maximum width and a minimum
      and maximum height. The child must pick a size inside them.
    definitionAr: >-
      الأربع أرقام اللي الـ parent في Flutter بيدّيها للـ child وقت الـ layout: أقل وأقصى width، وأقل وأقصى height.
      والـ child لازم يختار حجمه جوه الحدود دي.
  - id: tight-constraints
    term: Tight constraints
    definitionEn: >-
      Box constraints whose minimum equals their maximum on an axis, so the child has exactly one allowed size there,
      whatever width or height it asks for.
    definitionAr: >-
      constraints الـ minimum فيها بيساوي الـ maximum على محور معين، فالـ child ليه حجم واحد بس مسموح بيه على المحور
      ده، مهما طلب width أو height.
  - id: unbounded-constraints
    term: Unbounded constraints
    definitionEn: >-
      Box constraints whose maximum on an axis is infinite, as inside a ListView's scroll direction or a Row's main
      axis. A box that tries to be as big as possible can't work there and, in debug mode, throws an exception.
    definitionAr: >-
      constraints الـ maximum فيها على محور معين infinity، زي اتجاه الـ scroll جوه ListView أو المحور الأساسي في
      Row. أي box بيحاول ياخد أكبر مساحة ممكنة مش هيشتغل هناك، وفي الـ debug mode بيرمي exception.
  - id: hot-reload
    term: Hot reload
    definitionEn: >-
      A Flutter debug-mode feature that injects changed Dart code into the running app and rebuilds the widget tree
      while keeping the app's state. It doesn't run main() or initState() again.
    definitionAr: >-
      ميزة في الـ debug mode بتاع Flutter بتحقن كود Dart اللي اتغير جوه التطبيق وهو شغال، وتعمل rebuild للـ widget tree
      من غير ما تمسح الـ state. مش بتشغّل main() ولا initState() تاني.
  - id: hot-restart
    term: Hot restart
    definitionEn: >-
      Loads the changed code and restarts the Flutter app from main(), discarding all app state, without rebuilding
      the native app. Native code changes still need a full restart.
    definitionAr: >-
      بتحمّل الكود اللي اتغير وتشغّل تطبيق Flutter من أول main()، وبتمسح كل الـ state، من غير ما تبني الـ native app
      من الأول. أي تغيير في الـ native code لسه محتاج full restart.
  - id: sound-null-safety
    term: Sound null safety
    definitionEn: >-
      Dart's guarantee that an expression whose static type is non-nullable can never evaluate to null at runtime.
      Types are non-nullable unless you add ?, and Dart 3 always enforces it.
    definitionAr: >-
      ضمان في Dart إن أي expression نوعها non-nullable عمرها ما هتطلع null وقت التشغيل. الأنواع non-nullable إلا لو
      ضفت ?، وDart 3 بيفرض ده دايمًا.
  - id: null-assertion-operator
    term: Null assertion operator
    definitionEn: >-
      Dart's postfix ! (the "bang" operator), as in email!.length. It casts a nullable expression to its non-nullable
      type and is checked at runtime: it throws if the value is null.
    definitionAr: >-
      الـ ! اللي بيتكتب بعد الـ expression في Dart (الـ bang operator)، زي email!.length. بيحوّل expression نوعها
      nullable للنوع الـ non-nullable، وبيتشيك وقت التشغيل: لو القيمة null بيرمي exception.
  - id: type-promotion
    term: Type promotion
    definitionEn: >-
      Dart's flow analysis narrowing a variable's type after a check, for example treating a String? as a String
      after an if (x != null). It applies to local variables, parameters and private final fields.
    definitionAr: >-
      إن الـ flow analysis في Dart تضيّق نوع الـ variable بعد check، زي إنها تعامل String? كـ String بعد
      if (x != null). بتشتغل مع الـ local variables والـ parameters والـ private final fields.
  - id: isolate
    term: Isolate
    definitionEn: >-
      The place where Dart code runs: like a thread or a process, but with its own memory and a single thread
      running an event loop. Isolates share no state and communicate only by passing messages.
    definitionAr: >-
      المكان اللي كود Dart بيشتغل فيه: شبه الـ thread أو الـ process، بس ليه memory خاصة بيه وthread واحد بيشغّل
      event loop. الـ isolates مش بتشارك أي state، وبتكلّم بعض عن طريق الرسايل وبس.
  - id: jank
    term: Jank
    definitionEn: >-
      Visible stutter in an app's UI when frames aren't produced in time, for example when a frame takes longer than
      about 16 ms on a 60 Hz screen and the next one is late.
    definitionAr: >-
      تقطيع باين في واجهة التطبيق لما الـ frames ماتطلعش في وقتها، زي لما frame ياخد أكتر من حوالي 16 ms على شاشة
      60 Hz فاللي بعده يتأخر.
  - id: repaint-boundary
    term: Repaint boundary
    definitionEn: >-
      A point in Flutter's render tree where the subtree gets its own layer, so a repaint on one side doesn't force
      the other side to repaint. The RepaintBoundary widget creates one, and scrolling lists add one per item by
      default.
    definitionAr: >-
      نقطة في الـ render tree بتاعة Flutter الـ subtree اللي تحتها بياخد layer لوحده، فالـ repaint في ناحية مش بيجبر
      الناحية التانية تترسم من جديد. الـ RepaintBoundary widget بيعمل واحدة، والليستات اللي بتعمل scroll بتحط واحدة لكل
      عنصر.
  - id: widget-key
    term: Key (Flutter)
    definitionEn: >-
      An optional identifier on a Flutter widget. When a parent rebuilds, an existing element is reused for a new
      widget only if both have the same type and the same key, so the key decides which State the widget gets.
    definitionAr: >-
      identifier اختياري على الـ widget في Flutter. لما الـ parent يعمل rebuild، الـ element الموجود بياخد الـ widget
      الجديد بس لو الاتنين ليهم نفس النوع ونفس الـ key، فالـ key هو اللي بيحدد الـ widget هياخد أنهي State.
  - id: global-key
    term: GlobalKey
    definitionEn: >-
      A Flutter key that must be unique across the whole app. It lets a subtree move to a new parent without losing its
      state and gives access to its BuildContext and State. Reparenting with it is relatively expensive.
    definitionAr: >-
      key في Flutter لازم يبقى unique على مستوى التطبيق كله. بيخلّي الـ subtree يتنقل لـ parent تاني من غير ما يخسر الـ
      state بتاعه، وبيدّيك وصول للـ BuildContext والـ State بتوعه. والنقل بيه تمنه عالي نسبيًا.
  - id: build-context
    term: BuildContext
    definitionEn: >-
      A handle to one widget's location in the Flutter tree; it is actually that widget's Element. Lookups such as
      Navigator.of(context) search upward from that place, and the context is only valid while it's mounted.
    definitionAr: >-
      handle لمكان widget واحد في الـ tree بتاعة Flutter، وهو في الحقيقة الـ Element بتاع الـ widget ده. والـ lookups زي
      Navigator.of(context) بتدوّر لفوق من المكان ده، والـ context صالح بس طول ما هو mounted.
  - id: async-gap
    term: Async gap
    definitionEn: >-
      The pause at an await in an async function. Before the function resumes, other code runs: frames are drawn,
      taps are handled and screens can close, so anything checked before the await may no longer be true.
    definitionAr: >-
      الوقفة اللي عند الـ await في async function. وقبل ما الـ function تكمّل، كود تاني بيشتغل: frames بتترسم، وضغطات
      بتتعالج، وشاشات ممكن تتقفل، فأي حاجة اتأكدت منها قبل الـ await ممكن ماتبقاش صح بعدها.
  - id: state-lifecycle
    term: State lifecycle
    definitionEn: >-
      The fixed order in which Flutter calls a State object's methods: initState once, build any number of times,
      didUpdateWidget whenever the parent passes a new widget of the same type and key, and dispose once at the end.
    definitionAr: >-
      الترتيب الثابت اللي Flutter بينادي بيه الـ methods بتاعة الـ State object: الـ initState مرة واحدة، والـ build أي
      عدد من المرات، والـ didUpdateWidget كل ما الـ parent يبعت widget جديد من نفس النوع وبنفس الـ key، والـ dispose مرة
      واحدة في الآخر.
  - id: dart-future
    term: Future (Dart)
    definitionEn: >-
      Dart's object for the result of an asynchronous computation. Calling an async function starts the work and
      immediately returns a Future, which completes later with a value or an error.
    definitionAr: >-
      الـ object اللي Dart بيمثّل بيه نتيجة عملية asynchronous. لما تنادي async function الشغل بيبدأ على طول وبترجعلك
      Future في ساعتها، والـ Future ده بيخلص بعدين بقيمة أو بـ error.
  - id: inherited-widget
    term: InheritedWidget
    definitionEn: >-
      A Flutter widget that makes data available to every widget below it. A descendant that reads it through
      dependOnInheritedWidgetOfExactType, usually inside an of method, becomes a dependent and is rebuilt when it
      changes.
    definitionAr: >-
      widget في Flutter بيخلّي داتا متاحة لكل الـ widgets اللي تحته. وأي widget تحته يقراه عن طريق
      dependOnInheritedWidgetOfExactType، وعادةً ده بيحصل جوه method اسمها of، بيبقى dependent عليه وبيتعمل له
      rebuild لما يتغير.
  - id: raster-thread
    term: Raster thread
    definitionEn: >-
      The Flutter engine thread that takes the layer tree built by the UI thread and turns it into work for the GPU.
      Skia and Impeller run on it, and although it rasterizes for the GPU, the thread itself runs on the CPU.
    definitionAr: >-
      الـ thread في الـ engine بتاع Flutter اللي بياخد الـ layer tree اللي الـ UI thread بناها ويحوّلها لشغل للـ GPU.
      الـ Skia والـ Impeller بيشتغلوا عليه، ومع إنه بيجهّز الرسم للـ GPU، الـ thread نفسه شغال على الـ CPU.
  - id: save-layer
    term: saveLayer
    definitionEn: >-
      A canvas operation that draws a group of commands into an offscreen buffer, so an effect such as opacity applies
      to the group as a whole. Flutter's docs call it one of the most expensive operations in the framework.
    definitionAr: >-
      عملية على الـ canvas بترسم مجموعة أوامر في buffer برّه الشاشة، عشان effect زي الـ opacity يتطبق على المجموعة كلها
      مرة واحدة. والـ docs بتاعة Flutter بتعتبرها من أغلى العمليات في الـ framework.
  - id: aot-compilation
    term: AOT compilation
    definitionEn: >-
      Ahead-of-time compilation: turning code into machine code before the app runs, as Flutter does for Dart in
      release builds, instead of compiling it while the app runs (JIT), as debug builds do.
    definitionAr: >-
      الـ Ahead-of-time compilation: إنك تحوّل الكود لـ machine code قبل ما التطبيق يشتغل، زي ما Flutter بيعمل مع Dart في
      الـ release builds، بدل ما يتعمله compile وهو شغال (JIT) زي الـ debug builds.
  - id: ephemeral-state
    term: Ephemeral state
    definitionEn: >-
      State you can neatly contain in a single widget, also called UI state or local state, such as the selected tab or
      whether a password is visible. Flutter's docs say a StatefulWidget with setState is all it needs.
    definitionAr: >-
      state تقدر تحطه بالكامل جوه widget واحد، وبيتسمى كمان UI state أو local state، زي الـ tab المختار أو إن الباسورد
      ظاهر ولا لأ. والـ docs بتاعة Flutter بتقول إن كل اللي محتاجه StatefulWidget وsetState.
  - id: app-state
    term: App state
    definitionEn: >-
      State that many parts of an app share and that you often keep between sessions, such as login info, user
      preferences or a shopping cart. Also called shared state.
    definitionAr: >-
      state أجزاء كتير في التطبيق بتشاركه، وغالبًا بتحتفظ بيه بين الـ sessions، زي بيانات الـ login أو تفضيلات المستخدم
      أو الـ shopping cart. وبيتسمى كمان shared state.
  - id: app-lifecycle
    term: App lifecycle
    definitionEn: >-
      The states a mobile app moves through as the user opens it, switches away and comes back. Flutter reports them
      as AppLifecycleState values: resumed, inactive, hidden, paused and detached.
    definitionAr: >-
      الحالات اللي تطبيق الموبايل بيعدّي بيها لما المستخدم يفتحه ويسيبه ويرجعله. والـ Flutter بيبلّغ عنها كقيم
      AppLifecycleState: الـ resumed والـ inactive والـ hidden والـ paused والـ detached.
  - id: process-death
    term: Process death
    definitionEn: >-
      When the operating system kills a backgrounded app's process to free memory. The app gets no callback, and
      everything held only in memory is lost unless it was saved or handed to state restoration.
    definitionAr: >-
      لما نظام التشغيل يقتل الـ process بتاع تطبيق في الخلفية عشان يفضّي memory. التطبيق مش بياخد أي callback، وكل
      حاجة كانت في الـ memory بس بتضيع، إلا لو كانت اتحفظت أو اتسلّمت للـ state restoration.
  - id: state-restoration
    term: State restoration
    definitionEn: >-
      A mechanism that hands small pieces of UI state to the operating system, so that after process death the app can
      come back on the same screen with the same input. In Flutter it's driven by RestorationManager and RestorationMixin.
    definitionAr: >-
      آلية بتسلّم حتت صغيرة من الـ UI state لنظام التشغيل، عشان بعد الـ process death التطبيق يرجع على نفس الشاشة وبنفس
      الكلام اللي اتكتب. وفي Flutter بيشغّلها RestorationManager وRestorationMixin.
  - id: layout-mirroring
    term: Layout mirroring
    definitionEn: >-
      Flipping a user interface horizontally for right-to-left languages such as Arabic: start and end swap sides and
      arrows for back and forward point the other way, while numbers, logos and photos keep their orientation.
    definitionAr: >-
      إنك تقلب الواجهة أفقيًا للغات اللي بتتكتب من اليمين للشمال زي العربي: الـ start والـ end بيبدّلوا أماكنهم، وأسهم
      الرجوع والتقدّم بتشاور للناحية التانية، لكن الأرقام والـ logos والصور بتفضل زي ما هي.
  - id: code-obfuscation
    term: Code obfuscation
    definitionEn: >-
      Transforming a compiled app so its code is harder for people to read, for example by replacing class and function
      names with meaningless ones. It slows down reverse engineering but doesn't encrypt strings or resources.
    definitionAr: >-
      إنك تغيّر التطبيق بعد الـ compile عشان الكود بتاعه يبقى أصعب في القراية، زي إنك تبدّل أسامي الـ classes والـ
      functions بأسامي ملهاش معنى. بيبطّأ الـ reverse engineering، بس مش بيعمل encryption للـ strings ولا للـ resources.
  - id: bearer-credential
    term: Bearer credential
    definitionEn: >-
      A credential that grants access to whoever presents it, such as an API key or an access token. The server can't
      tell who is holding it, so a copied bearer credential works just as well as the original.
    definitionAr: >-
      credential بيدّي صلاحية لأي حد يقدّمه، زي الـ API key أو الـ access token. السيرفر مايقدرش يعرف مين اللي ماسكه،
      فأي نسخة منه بتشتغل بالظبط زي الأصلي.
  - id: sealed-class
    term: Sealed class
    definitionEn: >-
      A Dart 3 class marked sealed: it's implicitly abstract and can only be extended or implemented inside its own
      library, so the compiler knows every direct subtype and can check that a switch handles all of them.
    definitionAr: >-
      class في Dart 3 عليها sealed: بتبقى abstract من غير ما تقول، ومحدش يقدر يعمل لها extend أو implement غير جوه
      الـ library بتاعتها، فالـ compiler بيعرف كل الـ subtypes المباشرة ويقدر يتأكد إن الـ switch غطّاهم كلهم.
  - id: exhaustiveness-checking
    term: Exhaustiveness checking
    definitionEn: >-
      A Dart compile-time check that reports an error when a value could enter a switch without matching any case,
      for example when a switch over a sealed class leaves out one of its subtypes.
    definitionAr: >-
      check وقت الـ compile في Dart بيطلّع error لو فيه قيمة ممكن تدخل switch من غير ما تطابق أي case، زي switch على
      sealed class ناسي واحد من الـ subtypes بتوعها.
