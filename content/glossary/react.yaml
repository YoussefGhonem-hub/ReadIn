terms:
  - id: render-phase
    term: Render phase
    definitionEn: >-
      The step where React calls your components to compute what the UI should look like and works out what changed
      since the previous render. It does not touch the DOM.
    definitionAr: >-
      المرحلة اللي React بينادي فيها الـ components بتاعتك عشان يحسب شكل الـ UI المفروض يبقى إيه، ويعرف إيه اللي
      اتغير عن الـ render اللي قبله. مابتلمسش الـ DOM خالص.
  - id: commit-phase
    term: Commit phase
    definitionEn: >-
      The step after rendering where React applies only the differences it found to the DOM. Nodes that did not change
      are left exactly as they are.
    definitionAr: >-
      المرحلة اللي بعد الـ render، واللي React بيطبّق فيها على الـ DOM الفروق اللي لقاها وبس. أي node ماتغيرتش بتفضل
      زي ما هي بالظبط.
  - id: reconciliation
    term: Reconciliation
    definitionEn: >-
      How React compares the new render output with the previous one, position by position in the tree, to decide
      which nodes and state to keep, update or recreate.
    definitionAr: >-
      الطريقة اللي React بيقارن بيها ناتج الـ render الجديد بالقديم، مكان بمكان في الـ tree، عشان يقرر هيحتفظ بأنهي
      nodes وstate، وهيحدّث إيه، وهيعمل إيه من الأول.
  - id: memoization
    term: Memoization
    definitionEn: >-
      Keeping the result of a calculation and reusing it while its inputs stay the same. In React, memo, useMemo and
      useCallback do this for components, values and functions.
    definitionAr: >-
      إنك تحتفظ بنتيجة حساب وتعيد استخدامها طول ما المدخلات بتاعتها ماتغيرتش. في React، الـ memo والـ useMemo والـ
      useCallback بيعملوا كده للـ components والقيم والـ functions.
  - id: batching
    term: Batching
    definitionEn: >-
      React waiting until an event handler has finished, then applying all the state updates it queued in a single
      re-render instead of one render per update.
    definitionAr: >-
      إن React يستنى لحد ما الـ event handler يخلص، وبعدين يطبّق كل الـ state updates اللي اتحطت في الطابور في re-render
      واحد بدل render لكل update.
  - id: updater-function
    term: Updater function
    definitionEn: >-
      A function passed to a state setter, like setCount(c => c + 1). React queues it and, during the next render,
      calls it with the latest queued state to compute the next one.
    definitionAr: >-
      function بتديها للـ state setter، زي setCount(c => c + 1). React بيحطها في الطابور، وفي الـ render الجاي بيناديها
      بآخر قيمة في الطابور عشان يحسب القيمة اللي بعدها.
  - id: shallow-copy
    term: Shallow copy
    definitionEn: >-
      A copy of an object or array that duplicates only the top level. Nested objects are not copied, so the copy and
      the original still share them.
    definitionAr: >-
      نسخة من object أو array بتنسخ المستوى الأول بس. الـ objects اللي جواها مابتتنسخش، فالنسخة والأصل بيفضلوا شايلين
      نفس الـ objects دي.
  - id: react-key
    term: Key
    definitionEn: >-
      A special JSX attribute that tells React which data item an element stands for among its siblings, so the item's
      state and DOM follow it when the list changes. It must be unique among siblings and stable between renders.
    definitionAr: >-
      attribute خاص في JSX بيقول لـ React الـ element ده يخص أنهي عنصر في الداتا وسط اللي جنبه، عشان الـ state والـ DOM
      بتوعه يمشوا وراه لما الـ list تتغير. لازم يكون unique بين اللي جنبه وثابت من render للي بعده.
  - id: pure-function
    term: Pure function
    definitionEn: >-
      A function that returns the same result for the same inputs and changes nothing that existed before it was
      called. React expects components, initializers and updaters to behave this way.
    definitionAr: >-
      function بترجّع نفس النتيجة لنفس المدخلات، ومابتغيرش أي حاجة كانت موجودة قبل ما تتنادى. React مستني الـ components
      والـ initializers والـ updaters يشتغلوا بالشكل ده.
  - id: side-effect
    term: Side effect
    definitionEn: >-
      Anything code does that can be observed besides returning its result, such as a network request, a DOM write,
      writing to storage or changing a variable outside the function.
    definitionAr: >-
      أي حاجة الكود بيعملها وحد يقدر يلاحظها غير إنه يرجّع النتيجة، زي request على الشبكة، أو كتابة في الـ DOM أو في
      الـ storage، أو تغيير متغير بره الـ function.
  - id: ui-tree
    term: UI tree
    definitionEn: >-
      The tree of components and elements React builds from your JSX. React keeps each component's state at its
      position in this tree, not inside the component function.
    definitionAr: >-
      الشجرة اللي React بيبنيها من الـ JSX بتاعك، وفيها كل component وelement وتحت مين. React بيحفظ الـ state بتاع
      كل component في مكانه في الشجرة دي، مش جوه الـ function نفسها.
  - id: custom-hook
    term: Custom Hook
    definitionEn: >-
      Your own function whose name starts with use and that calls other Hooks, so components can reuse stateful
      logic. Each component that calls it gets its own independent state.
    definitionAr: >-
      function بتكتبها بنفسك، اسمها بيبدأ بـ use وبتنادي Hooks تانية، عشان الـ components تعيد استخدام logic فيه
      state. وكل component بيناديها بياخد state مستقل لوحده.
  - id: lifting-state-up
    term: Lifting state up
    definitionEn: >-
      Moving state out of the components that need it into their closest common parent, then passing it down as
      props, so there is one copy that every child reads.
    definitionAr: >-
      إنك تنقل الـ state من الـ components اللي محتاجاه لأقرب parent مشترك بينهم، وبعدين تبعته لتحت كـ props، عشان
      يبقى فيه نسخة واحدة بس كل الـ children بيقروا منها.
  - id: react-effect
    term: Effect
    definitionEn: >-
      Code passed to useEffect that React runs after committing a render, to keep a system outside React in sync with
      it. It can return a cleanup function that stops or undoes what it started.
    definitionAr: >-
      كود بتديه لـ useEffect وReact بيشغّله بعد ما يعمل commit للـ render، عشان يخلّي system بره React ماشي مع اللي على
      الشاشة. وممكن يرجّع cleanup function بتوقف أو تلغي اللي هو بدأه.
  - id: reactive-value
    term: Reactive value
    definitionEn: >-
      A value declared inside a component, such as a prop, state or a variable computed from them during render. It
      can change between renders, so an Effect that reads it must list it as a dependency.
    definitionAr: >-
      قيمة متعرّفة جوه الـ component، زي prop أو state أو متغير محسوب منهم أثناء الـ render. ممكن تتغير من render للتاني،
      فأي Effect بيقراها لازم يحطها في الـ dependencies بتاعته.
  - id: derived-state
    term: Derived state
    definitionEn: >-
      A value that can be calculated from props or existing state, like a total or a filtered list. React recommends
      calculating it during render instead of storing a copy in its own state.
    definitionAr: >-
      قيمة ممكن تتحسب من الـ props أو من state موجود، زي total أو list متفلترة. React بينصح تحسبها أثناء الـ render بدل
      ما تخزّن نسخة منها في state لوحدها.
  - id: react-ref
    term: Ref
    definitionEn: >-
      A mutable object from useRef whose current property you can change without re-rendering. React returns the same
      object on every render and never tracks changes to it.
    definitionAr: >-
      object بتاخده من useRef وتقدر تغيّر الـ current property بتاعته من غير re-render. React بيرجّعلك نفس الـ object
      في كل render، ومابيتابعش أي تغيير فيه.
  - id: escape-hatch
    term: Escape hatch
    definitionEn: >-
      React's name for features like refs and Effects that let you step outside its data flow to work with things it
      doesn't manage, such as the DOM, timers or third-party libraries.
    definitionAr: >-
      الاسم اللي React بيطلقه على حاجات زي الـ refs والـ Effects، اللي بتخليك تطلع بره الـ data flow بتاعه عشان تتعامل
      مع حاجات هو مابيديرهاش، زي الـ DOM أو الـ timers أو مكتبات من بره.
  - id: stale-closure
    term: Stale closure
    definitionEn: >-
      A function that keeps reading the props and state of the render that created it after newer renders exist,
      because it closed over that render's variables. Common in intervals, timeouts and listeners set up by an Effect.
    definitionAr: >-
      function لسه بتقرا الـ props والـ state بتوع الـ render اللي اتعملت فيه، مع إن فيه renders أحدث، لأنها مسكت
      متغيرات الـ render ده. بتظهر كتير في الـ intervals والـ timeouts والـ listeners اللي بيعملها Effect.
  - id: effect-event
    term: Effect Event
    definitionEn: >-
      A function created with useEffectEvent and called from inside an Effect. It always reads the latest committed
      props and state and is not a dependency, so changes to the values it reads don't re-run the Effect.
    definitionAr: >-
      function بتعملها بـ useEffectEvent وبتناديها من جوه Effect. دايمًا بتقرا آخر props وstate اتعملهم commit، ومش
      بتتحط في الـ dependencies، فتغيير القيم اللي بتقراها مابيعيدش تشغيل الـ Effect.
  - id: referential-equality
    term: Referential equality
    definitionEn: >-
      Two values being the very same object or function in memory, which is what Object.is checks for objects. Two
      objects with identical contents are still different references.
    definitionAr: >-
      إن قيمتين يبقوا نفس الـ object أو الـ function بالظبط في الميموري، وده اللي Object.is بيتأكد منه في الـ objects.
      يعني اتنين objects بنفس المحتوى بالظبط لسه references مختلفة.
  - id: react-compiler
    term: React Compiler
    definitionEn: >-
      A build-time tool, usually run as a Babel plugin, that analyzes components and Hooks and adds memoization to
      them automatically, as long as they follow the Rules of React.
    definitionAr: >-
      أداة بتشتغل وقت الـ build، غالبًا كـ Babel plugin، بتحلل الـ components والـ Hooks وتضيف لهم memoization
      لوحدها، طالما ماشيين على الـ Rules of React.
  - id: controlled-input
    term: Controlled input
    definitionEn: >-
      A form field whose current value comes from React state through the value (or checked) prop, with an onChange
      handler that updates that state. React makes the field match the state on every render.
    definitionAr: >-
      field في form القيمة الحالية بتاعته جاية من state في React عن طريق الـ value (أو الـ checked)، ومعاه onChange
      handler بيحدّث الـ state ده. وReact بيخلّي الـ field يطابق الـ state في كل render.
  - id: uncontrolled-input
    term: Uncontrolled input
    definitionEn: >-
      A form field whose current value is kept by the browser's DOM. React only sets its starting value, through
      defaultValue or defaultChecked, and you read the value when you need it, for example on submit.
    definitionAr: >-
      field في form القيمة الحالية بتاعته محفوظة في الـ DOM بتاع المتصفح. React بيحط القيمة اللي بيبدأ بيها بس، عن
      طريق defaultValue أو defaultChecked، وانت بتقرا القيمة وقت ما تحتاجها، زي وقت الـ submit.
  - id: race-condition
    term: Race condition
    definitionEn: >-
      A bug where the result depends on which of several overlapping operations finishes first, such as two network
      requests whose responses arrive in a different order than they were sent.
    definitionAr: >-
      bug النتيجة فيه بتعتمد على أنهي عملية من كذا عملية شغالين في نفس الوقت هتخلص الأول، زي اتنين requests على
      الشبكة الردود بتاعتهم بتوصل بترتيب غير اللي اتبعتوا بيه.
  - id: effect-cleanup
    term: Effect cleanup
    definitionEn: >-
      The function an Effect's setup returns. React calls it before running the Effect again with new dependencies
      and when the component is removed, so it can stop or undo what that setup started.
    definitionAr: >-
      الـ function اللي الـ setup بتاع الـ Effect بيرجّعها. React بيناديها قبل ما يشغّل الـ Effect تاني بـ dependencies
      جديدة، ولما الـ component يتشال، عشان توقف أو تلغي اللي الـ setup ده بدأه.
  - id: error-boundary
    term: Error Boundary
    definitionEn: >-
      A class component with static getDerivedStateFromError that shows fallback UI when a component below it throws
      while React renders it. It doesn't catch errors from event handlers or ordinary async code.
    definitionAr: >-
      class component فيه static getDerivedStateFromError، بيعرض UI بديلة لما component تحته يرمي error وReact بيعمله
      render. مابيمسكش الـ errors اللي جاية من الـ event handlers أو الكود الـ async العادي.
  - id: react-transition
    term: Transition
    definitionEn: >-
      A state update that React treats as non-urgent, started with startTransition. In React 19 the function can be
      async and React tracks its pending state. With useTransition, an error it throws reaches the nearest Error
      Boundary.
    definitionAr: >-
      state update بيعتبره React مش مستعجل، وبتبدأه بـ startTransition. في React 19 الـ function دي ممكن تبقى async،
      وReact بيتابع إنها لسه شغالة. ومع useTransition، لو رمت error بيوصل لأقرب Error Boundary.
  - id: single-source-of-truth
    term: Single source of truth
    definitionEn: >-
      The rule that each piece of state has exactly one owner, a specific component or store, and everything else
      reads it from there instead of keeping its own copy. It doesn't mean all state lives in one place.
    definitionAr: >-
      القاعدة اللي بتقول إن كل state ليه owner واحد بس، component معيّن أو store، وأي حد تاني بيقراه من عنده بدل ما
      يحتفظ بنسخة لوحده. ومش معناها إن كل الـ state يعيش في مكان واحد.
  - id: strict-mode
    term: Strict Mode
    definitionEn: >-
      A development-only check you turn on with the StrictMode component. It renders components an extra time and runs
      an extra setup and cleanup for Effects and ref callbacks, to expose impure rendering and missing cleanup.
    definitionAr: >-
      فحص بيشتغل في الـ development بس، بتشغّله بالـ component اللي اسمه StrictMode. بيعمل render للـ components مرة
      زيادة، وبيشغّل setup وcleanup زيادة للـ Effects والـ ref callbacks، عشان يكشف الـ render اللي مش pure والـ cleanup
      الناقص.
  - id: react-context
    term: Context
    definitionEn: >-
      A way for a component to make one value available to every component below it without passing props. Readers
      get it with useContext and re-render whenever the nearest provider passes a different value.
    definitionAr: >-
      طريقة بيستخدمها component عشان يخلّي قيمة واحدة متاحة لكل الـ components اللي تحته من غير ما يعدّيها props.
      اللي بيقروها بياخدوها بـ useContext، وبيعملوا re-render كل ما أقرب provider يبعت قيمة مختلفة.
  - id: store-selector
    term: Selector
    definitionEn: >-
      A function that picks the part of a store's state a component needs. The store compares its result after each
      update and re-renders the component only when that part changed.
    definitionAr: >-
      function بتختار الجزء اللي الـ component محتاجه من الـ state بتاع الـ store. الـ store بيقارن نتيجتها بعد كل
      update، ومابيعملش re-render للـ component غير لما الجزء ده يتغير.
  - id: react-action
    term: Action
    definitionEn: >-
      React's name for a function that runs in a Transition, such as one passed to a form's action prop or to
      startTransition. React tracks whether it is pending and sends an error it throws to the nearest Error Boundary.
    definitionAr: >-
      الاسم اللي React بيطلقه على function بتشتغل جوه Transition، زي اللي بتديها للـ action بتاع فورم أو لـ
      startTransition. React بيتابع هل لسه شغالة، ولو رمت error بيبعته لأقرب Error Boundary.
  - id: debounce
    term: Debounce
    definitionEn: >-
      Waiting until a burst of events has paused for a fixed time, then acting once, for example running a search
      only after the user has stopped typing for 300 ms. Every new event restarts the wait.
    definitionAr: >-
      إنك تستنى لحد ما سلسلة events تهدى لمدة ثابتة، وبعدين تعمل الحاجة مرة واحدة، زي إنك تعمل search بس بعد ما
      اليوزر يبطّل كتابة لمدة 300 ms. وكل event جديد بيبدأ الانتظار من الأول.
  - id: server-components
    term: Server Components
    definitionEn: >-
      React components that render ahead of time, at build time or per request, in a server environment separate
      from the browser and the SSR server. Only their output reaches the client; their code is never shipped to it.
    definitionAr: >-
      components في React بتعمل render بدري، وقت الـ build أو مع كل request، في بيئة على الـ server منفصلة عن
      المتصفح وعن الـ SSR server. اللي بيوصل للـ client هو الناتج بتاعها بس، والكود بتاعها عمره ما بيتبعتله.
  - id: server-side-rendering
    term: Server-side rendering (SSR)
    definitionEn: >-
      Rendering React components to HTML on the server, so the browser can show the page before the JavaScript has
      loaded. React then hydrates that HTML in the browser to make it interactive.
    definitionAr: >-
      إنك تعمل render للـ components بتاعة React لـ HTML على الـ server، عشان المتصفح يعرض الصفحة قبل ما الـ
      JavaScript يحمّل. وبعدها React بيعمل hydration للـ HTML ده في المتصفح عشان يبقى تفاعلي.
  - id: hydration
    term: Hydration
    definitionEn: >-
      React attaching to HTML that was rendered on the server: it renders the same components in the browser, adopts
      the existing DOM nodes and attaches event handlers. The browser's first render must match the server's HTML.
    definitionAr: >-
      إن React يركب على HTML اتعمله render على الـ server: بيعمل render لنفس الـ components في المتصفح، وياخد الـ
      DOM nodes الموجودة بدل ما يعمل جديدة، ويربط الـ event handlers. وأول render في المتصفح لازم يطابق الـ HTML اللي
      جه من الـ server.
  - id: server-function
    term: Server Function
    definitionEn: >-
      An async function marked with 'use server' that client code can call. React sends its serialized arguments to
      the server in a network request, runs it there and returns the serialized result. It used to be called a Server
      Action.
    definitionAr: >-
      async function متعلّم عليها بـ 'use server' والكود اللي على الـ client يقدر يناديها. React بيبعت الـ arguments
      بتاعتها بعد ما يعملها serialize للـ server في network request، ويشغّلها هناك، ويرجّع النتيجة serialized. وكان
      اسمها زمان Server Action.
  - id: suspense-boundary
    term: Suspense boundary
    definitionEn: >-
      A Suspense component and the tree inside it. When a component below it suspends during render, for example by
      reading a pending Promise with use, React shows the boundary's fallback until that content is ready.
    definitionAr: >-
      component من نوع Suspense ومعاه الشجرة اللي جواه. لما component تحته يعمل suspend وهو بيتعمله render، زي إنه
      يقرا Promise لسه pending بـ use، React بيعرض الـ fallback بتاع الـ boundary لحد ما المحتوى ده يجهز.
