terms:
  - id: selectivity
    term: Selectivity
    definitionEn: >-
      The share of a table's rows that a filter matches. A filter matching 0.1% of rows is highly selective; one
      matching 90% is not, and an ordinary index rarely helps it.
    definitionAr: >-
      نسبة الـ rows اللي الشرط بيطابقها من الجدول. شرط بيطابق 0.1% من الـ rows يبقى selective جدًا، وشرط بيطابق
      90% مش selective، والـ index العادي نادرًا ما بيفيده.
  - id: key-lookup
    term: Key lookup
    definitionEn: >-
      In SQL Server, the extra step that fetches the rest of a row from the clustered index after a nonclustered
      index found it, because the nonclustered index doesn't hold every column the query needs. PostgreSQL does the
      same with a heap fetch.
    definitionAr: >-
      في SQL Server، الخطوة الزيادة اللي بتجيب باقي الـ row من الـ clustered index بعد ما الـ nonclustered index
      لقاه، لأن الـ nonclustered index مش شايل كل الأعمدة اللي الـ query محتاجاها. والـ PostgreSQL بيعمل نفس
      الحكاية بـ heap fetch.
  - id: composite-index
    term: Composite index
    definitionEn: >-
      An index on two or more columns, sorted by the first column, then by the second within each value of the
      first, and so on. Also called a multicolumn or concatenated index.
    definitionAr: >-
      index على عمودين أو أكتر، مترتب بالعمود الأول، وبعدين بالتاني جوه كل قيمة من الأول، وهكذا. واسمه كمان
      multicolumn أو concatenated index.
  - id: index-seek
    term: Index seek
    definitionEn: >-
      Navigating a B-tree index from its root straight to the first matching entry and reading only the matching
      range, instead of reading every entry the way an index scan does.
    definitionAr: >-
      إن الـ engine ينزل في الـ B-tree من الـ root لحد أول entry مطابق على طول، ويقرا الجزء المطابق بس، بدل ما
      يقرا كل الـ entries زي ما الـ index scan بيعمل.
  - id: skip-scan
    term: Skip scan
    definitionEn: >-
      A PostgreSQL 18 B-tree optimization that uses a composite index without a condition on its leading column by
      running one search per distinct leading value. It pays off only when the leading column has few distinct values.
    definitionAr: >-
      optimization في B-tree بتاع PostgreSQL 18 بيستخدم الـ composite index من غير شرط على أول عمود فيه، عن طريق
      search لكل قيمة مختلفة في العمود ده. وبيفرق بس لما أول عمود يكون فيه قيم مختلفة قليلة.
  - id: round-trip
    term: Round trip
    definitionEn: >-
      One request from the application to the database and its response: sending a statement, waiting while it runs,
      and reading the result back. Its network and driver cost is paid per statement, however fast the statement is.
    definitionAr: >-
      رحلة واحدة من التطبيق للداتابيز ورجوعها: إنك تبعت statement، وتستنى لحد ما تتنفذ، وتقرا النتيجة. وتمنها في
      الشبكة والـ driver بيتدفع مع كل statement، مهما كانت سريعة.
  - id: query-store
    term: Query Store
    definitionEn: >-
      A SQL Server and Azure SQL feature that records each query's text, plans and runtime statistics (executions,
      duration, reads, rows) per time interval, inside the database. It's on by default for new databases starting
      with SQL Server 2022.
    definitionAr: >-
      feature في SQL Server و Azure SQL بتسجّل لكل query الـ text والـ plans والـ runtime statistics بتاعتها (عدد
      مرات التنفيذ والمدة والـ reads والـ rows) على فترات زمنية، جوه الداتابيز نفسها. وبتبقى شغالة default في
      الداتابيز الجديدة من أول SQL Server 2022.
  - id: execution-plan
    term: Execution plan
    definitionEn: >-
      The tree of operators (scans, seeks, joins, sorts) the database chooses to run a query. An estimated plan shows
      only the optimizer's predictions; an actual plan adds what happened at run time, such as actual rows and time.
    definitionAr: >-
      شجرة الـ operators (scans و seeks و joins و sorts) اللي الداتابيز بتختارها عشان تشغّل الـ query. الـ estimated
      plan بيوريك توقعات الـ optimizer بس، والـ actual plan بيزوّد اللي حصل فعلًا وقت التشغيل، زي عدد الـ rows والوقت.
  - id: cardinality-estimate
    term: Cardinality estimate
    definitionEn: >-
      The optimizer's prediction of how many rows each step of a plan will produce, computed from statistics. Plan
      costs are built on these estimates, so a wrong estimate makes every cost above it wrong too.
    definitionAr: >-
      توقع الـ optimizer لعدد الـ rows اللي كل خطوة في الـ plan هتطلّعها، ومحسوب من الـ statistics. وتكاليف الـ plan
      مبنية على التوقعات دي، فلو التوقع غلط، كل cost فوقه بيبقى غلط برضه.
  - id: sargable
    term: Sargable
    definitionEn: >-
      Short for "search argument-able": a WHERE condition the database can answer by seeking in an index, because it
      compares the indexed column as stored, such as CreatedAt >= @from, rather than a function or calculation on it.
    definitionAr: >-
      اختصار لـ "search argument-able": شرط في الـ WHERE الداتابيز تقدر تجاوبه بـ seek في index، لأنه بيقارن
      العمود اللي عليه الـ index زي ما هو متخزّن، زي CreatedAt >= @from، مش function أو حسبة عليه.
  - id: implicit-conversion
    term: Implicit conversion
    definitionEn: >-
      A data type conversion the database adds on its own when a comparison mixes types. When the converted side is
      the indexed column, as with a varchar column compared to an nvarchar parameter in SQL Server, the index can't
      be used for a seek.
    definitionAr: >-
      تحويل type بتضيفه الداتابيز من نفسها لما مقارنة تخلط بين types مختلفة. ولو الناحية اللي اتحولت هي العمود
      اللي عليه الـ index، زي عمود varchar بيتقارن بـ parameter نوعه nvarchar في SQL Server، الـ index مايتستخدمش
      في seek.
  - id: covering-index
    term: Covering index
    definitionEn: >-
      An index that holds every column a query needs, as key or included columns, so the database answers the query
      from the index alone, without fetching rows from the table. PostgreSQL runs such a query as an index-only scan.
    definitionAr: >-
      index شايل كل الأعمدة اللي الـ query محتاجاها، كـ key أو included columns، فالداتابيز تجاوب الـ query من الـ
      index لوحده من غير ما تجيب rows من الجدول. والـ PostgreSQL بيشغّل الـ query دي كـ index-only scan.
  - id: memory-grant
    term: Memory grant
    definitionEn: >-
      The memory SQL Server reserves for a query's sorts and hash operations before it starts running, sized from
      the estimated row count and row width. Too large wastes memory other queries could use; too small spills to
      disk.
    definitionAr: >-
      الـ memory اللي SQL Server بيحجزها للـ sorts وعمليات الـ hash بتاعة الـ query قبل ما تبدأ، وحجمها محسوب من
      عدد الـ rows وعرضها المتوقعين. لو كبيرة زيادة بتضيّع memory كانت queries تانية محتاجاها، ولو صغيرة بتعمل
      spill على الـ disk.
  - id: clustered-index
    term: Clustered index
    definitionEn: >-
      In SQL Server, the index whose leaf level is the table itself: every row, stored in the order of the index key.
      A table has at most one, and its key is also copied into every nonclustered index as the row locator.
    definitionAr: >-
      في SQL Server، الـ index اللي الـ leaf level بتاعه هو الجدول نفسه: كل الـ rows متخزّنة بترتيب الـ key بتاعه.
      الجدول ليه واحد بس على الأكتر، والـ key بتاعه بيتنسخ كمان في كل nonclustered index كـ row locator.
  - id: page-split
    term: Page split
    definitionEn: >-
      What happens when a row must go into a full index page: the engine allocates a new page and moves about half
      the rows to it. Inserts at random key positions cause many splits, leaving pages partly empty and out of order.
    definitionAr: >-
      اللي بيحصل لما row لازم يدخل page مليانة في الـ index: الـ engine بيحجز page جديدة وينقل لها حوالي نص الـ
      rows. والـ inserts في أماكن عشوائية من الـ key بتعمل splits كتير، وتسيب pages نصها فاضي ومش مترتبة.
  - id: statistics-histogram
    term: Histogram (statistics)
    definitionEn: >-
      The summary of a column's value distribution that the optimizer reads to estimate row counts: in SQL Server, up
      to 200 steps, each with an upper bound and row counts; in PostgreSQL, bucket bounds plus a list of the most
      common values. It's built from a sample or a full scan and goes stale as data changes.
    definitionAr: >-
      ملخص توزيع القيم في عمود، والـ optimizer بيقراه عشان يتوقع عدد الـ rows: في SQL Server لحد 200 step، كل واحدة
      ليها حد أعلى وعدد rows، وفي PostgreSQL حدود buckets ومعاها لستة بأكتر القيم تكرارًا. بيتبني من sample أو full
      scan، وبيبقى قديم كل ما الداتا تتغيّر.
  - id: parameter-sniffing
    term: Parameter sniffing
    definitionEn: >-
      SQL Server's practice of compiling a parameterized query or stored procedure using the parameter values of the
      call that triggers the compilation, then reusing that plan for later calls with any values. Microsoft also calls
      it parameter sensitivity.
    definitionAr: >-
      إن SQL Server بيعمل compile للـ parameterized query أو الـ stored procedure بقيم الـ parameters بتاعة الـ call
      اللي عمل الـ compile، وبعدين بيعيد استخدام الـ plan دي مع الـ calls اللي بعدها بأي قيم. و Microsoft بتسميها كمان
      parameter sensitivity.
  - id: acid
    term: ACID
    definitionEn: >-
      The four properties a database transaction must have: atomicity (all of its changes or none), consistency (the
      rules declared in the database hold when it ends), isolation (concurrent transactions are kept apart, to the
      chosen level) and durability (committed changes survive a crash).
    definitionAr: >-
      الأربع خصائص اللي لازم تبقى في أي transaction في الداتابيز: الـ atomicity (كل تغييراتها أو ولا واحد)، والـ
      consistency (القواعد المتعرّفة في الداتابيز تفضل صح لما تخلص)، والـ isolation (الـ transactions اللي شغالة مع
      بعض بتتفصل بالمستوى اللي اتختار)، والـ durability (اللي اتعمله commit بيعيش بعد أي crash).
  - id: autocommit-mode
    term: Autocommit mode
    definitionEn: >-
      The default way SQL Server, PostgreSQL and most drivers run statements when no transaction was started: each
      statement is its own transaction and is committed as soon as it completes successfully.
    definitionAr: >-
      الطريقة الـ default اللي SQL Server و PostgreSQL ومعظم الـ drivers بيشغّلوا بيها الـ statements لما مفيش
      transaction مفتوحة: كل statement هي transaction لوحدها، وبتتعمل commit أول ما تخلص بنجاح.
  - id: isolation-level
    term: Isolation level
    definitionEn: >-
      A setting that decides how much a transaction can see of other transactions running at the same time, from READ
      UNCOMMITTED to SERIALIZABLE. Each level below SERIALIZABLE allows some anomalies, such as nonrepeatable reads or
      phantoms, in exchange for less blocking or fewer failed transactions.
    definitionAr: >-
      إعداد بيحدد الـ transaction تقدر تشوف قد إيه من الـ transactions التانية اللي شغالة في نفس الوقت، من READ
      UNCOMMITTED لحد SERIALIZABLE. وكل مستوى تحت SERIALIZABLE بيسمح ببعض الـ anomalies، زي الـ nonrepeatable reads أو
      الـ phantoms، في مقابل blocking أقل أو transactions بتفشل أقل.
  - id: referential-integrity
    term: Referential integrity
    definitionEn: >-
      The guarantee that every reference between tables points at a row that exists: a foreign key value always
      matches a key in the referenced table, so no order can belong to a customer who isn't there.
    definitionAr: >-
      الضمان إن كل إشارة بين الجداول بتشاور على row موجود فعلًا: قيمة الـ foreign key دايمًا بتطابق key في الجدول
      اللي بتشاور عليه، فمفيش order يبقى تبع عميل مش موجود.
  - id: database-normalization
    term: Normalization
    definitionEn: >-
      Organizing a relational schema so that each fact is stored once, in the table whose key it depends on. The
      normal forms (first, second, third and beyond) are the rules for doing it; their purpose is to prevent update,
      insertion and deletion anomalies.
    definitionAr: >-
      إنك تنظّم الـ schema بحيث كل معلومة تتخزن مرة واحدة، في الجدول اللي الـ key بتاعه هو اللي بتعتمد عليه.
      والـ normal forms (الأول والتاني والتالت وما بعدهم) هي القواعد اللي بتعمل بيها كده، وهدفها تمنع الـ update
      والـ insertion والـ deletion anomalies.
  - id: update-anomaly
    term: Update anomaly
    definitionEn: >-
      An inconsistency that appears when the same fact is stored in several rows and an update changes only some of
      them, so the database holds two different answers to one question.
    definitionAr: >-
      تناقض بيظهر لما نفس المعلومة تبقى متخزنة في كذا row، والـ update يغيّر بعضهم بس، فالداتابيز تبقى شايلة
      إجابتين مختلفتين لنفس السؤال.
  - id: materialized-view
    term: Materialized view
    definitionEn: >-
      A stored copy of query results, such as a join or an aggregate, kept for fast reads. It's derived from source
      tables and can be rebuilt from them; depending on how it's refreshed, it's either updated with every change
      (like a SQL Server indexed view) or allowed to be stale for a while.
    definitionAr: >-
      نسخة متخزنة من نتيجة query، زي join أو aggregate، موجودة عشان القراية تبقى سريعة. بتتطلّع من جداول المصدر
      وممكن تتبني منها تاني، وحسب طريقة تحديثها، يا إما بتتحدّث مع كل تغيير (زي الـ indexed view في SQL Server)، يا
      إما مسموح لها تبقى قديمة شوية.
  - id: schema-on-read
    term: Schema on read
    definitionEn: >-
      A storage approach where the database accepts data of any shape and each reader interprets its structure when
      it reads it, as document and key-value stores do by default. Its opposite, schema on write, checks the shape
      when data is stored, as relational tables do.
    definitionAr: >-
      طريقة تخزين الداتابيز فيها بتقبل داتا بأي شكل، وكل كود بيقرا بيفسّر شكلها وقت القراية، زي ما الـ document
      والـ key-value stores بيعملوا بشكل default. وعكسها الـ schema on write، اللي بيتأكد من الشكل وقت التخزين، زي
      الجداول في الـ relational databases.
  - id: implicit-schema
    term: Implicit schema
    definitionEn: >-
      The structure that code assumes when it reads data the database doesn't validate, such as field names and
      types. It's real but undeclared, scattered across every piece of code that touches the data.
    definitionAr: >-
      الشكل اللي الكود بيفترضه وهو بيقرا داتا الداتابيز مابتتأكدش منها، زي أسامي الـ fields وأنواعها. موجود فعلًا
      بس مش متعرّف في أي مكان، ومتفرّق في كل حتة كود بتلمس الداتا.
  - id: polyglot-persistence
    term: Polyglot persistence
    definitionEn: >-
      Using different data storage technologies for different parts of a system, chosen by how each part reads and
      writes its data, such as a relational database for orders and a document or search store for a catalog.
    definitionAr: >-
      إنك تستخدم تكنولوجيات تخزين مختلفة لأجزاء مختلفة من السيستم، وتختار كل واحدة حسب الجزء ده بيقرا ويكتب الداتا
      إزاي، زي relational database للـ orders، و document أو search store للـ catalog.
  - id: phantom-read
    term: Phantom read
    definitionEn: >-
      Running the same query twice in one transaction and getting a different set of rows, because another
      transaction inserted or deleted matching rows and committed in between.
    definitionAr: >-
      إنك تشغّل نفس الـ query مرتين في نفس الـ transaction وتطلعلك مجموعة rows مختلفة، لأن transaction تانية عملت
      insert أو delete لـ rows مطابقة وعملت commit في النص.
  - id: write-skew
    term: Write skew
    definitionEn: >-
      An anomaly where two concurrent transactions read the same data, each updates a different row based on what
      it read, and both commit, together breaking a rule that each one checked. Snapshot isolation allows it;
      serializable isolation doesn't.
    definitionAr: >-
      anomaly فيها اتنين transactions شغالين مع بعض بيقروا نفس الداتا، وكل واحدة بتعدّل row مختلف بناءً على اللي
      قرته، والاتنين بيعملوا commit، فبيكسروا مع بعض قاعدة كل واحدة فيهم اتأكدت منها. والـ snapshot isolation بيسمح
      بيها، والـ serializable لأ.
  - id: lost-update
    term: Lost update
    definitionEn: >-
      An anomaly where two transactions read the same row, each computes a new value from what it read, and the
      later write overwrites the earlier one, so one change disappears without any error.
    definitionAr: >-
      anomaly فيها اتنين transactions بيقروا نفس الـ row، وكل واحدة بتحسب قيمة جديدة من اللي قرته، والكتابة
      اللي بعدها بتكتب فوق اللي قبلها، فتغيير منهم بيختفي من غير أي error.
  - id: dirty-read
    term: Dirty read
    definitionEn: >-
      Reading a change another transaction made but hasn't committed. If that transaction rolls back, the value you
      read never existed in the database.
    definitionAr: >-
      إنك تقرا تغيير عملته transaction تانية ولسه ماعملتلوش commit. ولو الـ transaction دي عملت rollback، القيمة
      اللي قريتها عمرها ما كانت موجودة في الداتابيز.
  - id: read-committed-snapshot
    term: Read committed snapshot isolation (RCSI)
    definitionEn: >-
      A SQL Server database option (READ_COMMITTED_SNAPSHOT ON) that makes the READ COMMITTED level use row versions
      instead of shared locks: each statement reads the data as last committed when it started, so readers don't
      wait for writers.
    definitionAr: >-
      option في الداتابيز في SQL Server (READ_COMMITTED_SNAPSHOT ON) بيخلّي الـ READ COMMITTED يستخدم row versions
      بدل الـ shared locks: كل statement بتقرا الداتا زي ما كانت متعملها commit لحد ما بدأت، فاللي بيقرا مابيستناش
      اللي بيكتب.
  - id: rollback
    term: Rollback
    definitionEn: >-
      Undoing every change a transaction has made so far, so the data returns to the state it had before the
      transaction began. Relational databases support it; Redis transactions and scripts don't.
    definitionAr: >-
      إنك تلغي كل التغييرات اللي الـ transaction عملتها لحد دلوقتي، فالداتا ترجع زي ما كانت قبل ما الـ transaction
      تبدأ. والـ relational databases بتدعمه، أما الـ transactions والـ scripts في Redis فلأ.
  - id: deadlock-victim
    term: Deadlock victim
    definitionEn: >-
      The transaction a database rolls back to break a deadlock, so the others in the cycle can continue. SQL Server
      reports it to the application as error 1205; PostgreSQL as "deadlock detected" (SQLSTATE 40P01).
    definitionAr: >-
      الـ transaction اللي الداتابيز بتعمل لها rollback عشان تكسر الـ deadlock، فالباقيين في الدايرة يقدروا يكمّلوا.
      الـ SQL Server بيبلّغ التطبيق بيها كـ error رقم 1205، والـ PostgreSQL كـ "deadlock detected" (SQLSTATE 40P01).
  - id: mvcc
    term: MVCC (multiversion concurrency control)
    definitionEn: >-
      A concurrency model in which an update writes a new version of a row instead of overwriting it, so each
      statement or transaction can read a consistent snapshot while others write. Old versions stay until no one can
      still see them.
    definitionAr: >-
      طريقة للـ concurrency فيها الـ update بيكتب نسخة جديدة من الـ row بدل ما يكتب فوقها، فكل statement أو transaction
      تقدر تقرا snapshot متسقة والباقيين بيكتبوا. والنسخ القديمة بتفضل موجودة لحد ما محدش يبقى محتاج يشوفها.
  - id: dead-tuple
    term: Dead tuple
    definitionEn: >-
      In PostgreSQL, an old row version left behind by an UPDATE or DELETE. It still takes space in the table and its
      indexes until VACUUM removes it, which it can do only when no transaction can still see it.
    definitionAr: >-
      في PostgreSQL، نسخة قديمة من row فضلت بعد UPDATE أو DELETE. بتفضل واخدة مكان في الجدول والـ indexes بتاعته
      لحد ما الـ VACUUM يشيلها، وده مايحصلش غير لما مفيش أي transaction تقدر تشوفها.
  - id: xmin-horizon
    term: Xmin horizon
    definitionEn: >-
      The oldest transaction ID that some open snapshot or transaction might still need to see. VACUUM can't remove
      row versions that died after it, in any table of the database. pg_stat_activity shows each session's share as
      backend_xmin and backend_xid.
    definitionAr: >-
      أقدم transaction ID ممكن snapshot أو transaction مفتوحة لسه محتاجة تشوفه. والـ VACUUM مايقدرش يشيل نسخ الـ rows
      اللي ماتت بعده، في أي جدول في الداتابيز. والـ pg_stat_activity بيوري نصيب كل session منه في backend_xmin و
      backend_xid.
