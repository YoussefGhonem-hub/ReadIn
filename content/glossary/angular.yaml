terms:
  - id: standalone-component
    term: Standalone component
    definitionEn: >-
      An Angular component that lists the components, directives and pipes its template uses in its own imports array,
      instead of being declared in an NgModule. It's the default since Angular 19.
    definitionAr: >-
      component في Angular بتكتب الـ components والـ directives والـ pipes اللي الـ template بتاعها بيستخدمها في الـ
      imports بتاعتها هي، من غير ما تتعمل declare في NgModule. ودي الحالة الافتراضية من أول Angular 19.
  - id: lazy-loading
    term: Lazy loading
    definitionEn: >-
      Splitting part of an app into a separate JavaScript chunk that the browser downloads only when it's first needed,
      such as when the user opens a route.
    definitionAr: >-
      إنك تفصل جزء من التطبيق في chunk JavaScript لوحده، والـ browser مايحمّلوش غير أول ما يحتاجه، زي لما اليوزر يفتح
      route معيّن.
  - id: angular-signal
    term: Signal
    definitionEn: >-
      A wrapper around a value that notifies Angular when the value changes. You read it by calling it, like count(),
      and Angular records which templates and computed values read it so it knows what to update.
    definitionAr: >-
      wrapper حوالين قيمة بيبلّغ Angular لما القيمة تتغير. بتقراه بإنك تناديه زي count()، وAngular بيسجّل مين من الـ
      templates والـ computed values قراه، عشان يعرف يحدّث إيه.
  - id: pure-pipe
    term: Pure pipe
    definitionEn: >-
      An Angular pipe whose transform runs again only when its input changes, either a different primitive value or a
      new object reference. Pipes are pure by default, so Angular reuses the last result otherwise.
    definitionAr: >-
      pipe في Angular الـ transform بتاعها مابيشتغلش تاني غير لما الـ input بتاعها يتغير، يعني قيمة primitive مختلفة أو
      reference جديد لـ object. الـ pipes بتبقى pure بشكل افتراضي، فـ Angular بيعيد استخدام آخر نتيجة في غير كده.
  - id: lifecycle-hook
    term: Lifecycle hook
    definitionEn: >-
      A method Angular calls at a fixed moment in a component's life, such as ngOnInit after the first inputs are set or
      ngOnDestroy before the component is removed.
    definitionAr: >-
      method بيناديها Angular في لحظة محددة من عمر الـ component، زي ngOnInit بعد ما أول inputs تتحط، أو ngOnDestroy قبل
      ما الـ component تتشال.
  - id: injection-context
    term: Injection context
    definitionEn: >-
      The places where Angular's inject() works: while the DI system constructs a class (its constructor and field
      initializers), inside provider factory functions, and inside runInInjectionContext.
    definitionAr: >-
      الأماكن اللي inject() بتاعة Angular بتشتغل فيها: وقت ما الـ DI system بيعمل الـ class (الـ constructor والـ field
      initializers بتوعها)، وجوه الـ factory functions بتاعة الـ providers، وجوه runInInjectionContext.
  - id: change-detection
    term: Change detection
    definitionEn: >-
      Angular's process for keeping the DOM in sync with your state. In each pass it walks the component tree,
      re-evaluates the templates that need checking, and updates the DOM where a value differs from the last render.
    definitionAr: >-
      الطريقة اللي Angular بيخلّي بيها الـ DOM ماشي مع الـ state بتاعتك. في كل لفّة بيمشي على شجرة الـ components، ويعيد
      تقييم الـ templates اللي محتاجة check، ويحدّث الـ DOM في الأماكن اللي القيمة فيها اختلفت عن آخر render.
  - id: zoneless
    term: Zoneless change detection
    definitionEn: >-
      Running Angular without zone.js. Angular schedules change detection only when it's notified, for example by a
      signal read in a template, a template event listener or markForCheck(). It's the default since Angular 21.
    definitionAr: >-
      إنك تشغّل Angular من غير zone.js. ساعتها Angular مابيعملش change detection غير لما حاجة تنبّهه، زي signal بيتقري في
      template، أو event listener في الـ template، أو markForCheck(). وده الافتراضي من أول Angular 21.
  - id: hierarchical-injectors
    term: Hierarchical injectors
    definitionEn: >-
      Angular's tree of dependency injection containers: environment injectors for the app and its routes, and element
      injectors for components and directives that declare providers. Each injector keeps its own instances, and a
      lookup walks up the tree until it finds a provider.
    definitionAr: >-
      شجرة الـ dependency injection containers في Angular: environment injectors للتطبيق والـ routes بتاعته، وelement
      injectors للـ components والـ directives اللي بتعرّف providers. كل injector بيحتفظ بالـ instances بتاعته، والبحث
      بيطلع لفوق في الشجرة لحد ما يلاقي provider.
  - id: model-input
    term: Model input
    definitionEn: >-
      An Angular input declared with model(). It's a writable signal that also creates an output named after it with
      Change appended, so a parent can bind it with two-way syntax like [(value)] and receive every value the child
      writes.
    definitionAr: >-
      input في Angular بيتعرّف بـ model(). هو writable signal، وبيعمل كمان output بنفس اسمه وفي آخره Change، فالـ parent
      يقدر يربطه بالـ two-way syntax زي [(value)] ويستلم كل قيمة الـ child بيكتبها.
  - id: angular-effect
    term: Effect (Angular)
    definitionEn: >-
      A function registered with effect() that Angular runs again whenever a signal it read changes. Effects are
      scheduled, not run on the spot: a component's effects run during change detection. They're meant for side effects
      outside signals, such as storage, logging or a chart library.
    definitionAr: >-
      function بتسجّلها بـ effect()، وAngular بيشغّلها تاني كل ما signal قرتها تتغير. الـ effects بتتجدول ومش بتشتغل في
      ساعتها: الـ effects بتاعة الـ component بتشتغل وقت الـ change detection. ومعمولة للـ side effects اللي برّه الـ
      signals، زي الـ storage أو الـ logging أو chart library.
  - id: linked-signal
    term: Linked signal
    definitionEn: >-
      A writable Angular signal created with linkedSignal() whose value is computed from other signals, like computed(),
      but can also be set directly. When a signal its computation reads changes, it recomputes and replaces the value
      that was set.
    definitionAr: >-
      writable signal في Angular بتتعمل بـ linkedSignal()، قيمتها بتتحسب من signals تانية زي computed()، بس كمان تقدر
      تعمل لها set بنفسك. ولما signal الـ computation بتقراها تتغير، بتتحسب من جديد وتحل محل القيمة اللي اتعملها set.
  - id: rxjs-observable
    term: Observable
    definitionEn: >-
      An RxJS object that delivers a sequence of values over time to each subscriber, in order, and can complete or
      fail. Operators such as debounceTime and switchMap control which values arrive and when.
    definitionAr: >-
      object من RxJS بيوصّل سلسلة قيم على مدار الوقت لكل subscriber، بالترتيب، وممكن يخلص أو يفشل. والـ operators زي
      debounceTime وswitchMap بتتحكم في أنهي قيم توصل وإمتى.
  - id: onpush
    term: OnPush
    definitionEn: >-
      Angular's change detection strategy, the default since Angular 22, that checks a component only when it was
      marked dirty: by a new input value, an event in it or a descendant, a signal its template reads, or
      markForCheck(). An unmarked OnPush component is skipped along with its subtree.
    definitionAr: >-
      الـ change detection strategy في Angular، والافتراضية من أول Angular 22، اللي مابتعملش check للـ component غير لو
      اتعلّمت dirty: بقيمة input جديدة، أو event فيها أو في component تحتها، أو signal الـ template بتاعها بيقراها، أو
      markForCheck(). والـ component اللي OnPush ومش متعلّمة بتتساب هي والـ subtree بتاعها.
  - id: render-hook
    term: Render hook
    definitionEn: >-
      A callback registered with afterNextRender(), afterEveryRender() or afterRenderEffect() that Angular runs after
      it has updated the DOM, in the browser only. It's the place to read or write the DOM directly.
    definitionAr: >-
      callback بتسجّله بـ afterNextRender() أو afterEveryRender() أو afterRenderEffect()، وAngular بيشغّله بعد ما يحدّث
      الـ DOM، في الـ browser بس. وده المكان اللي تقرا فيه من الـ DOM أو تكتب فيه بإيدك.
