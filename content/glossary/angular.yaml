terms:
  - id: standalone-component
    term: Standalone component
    definitionEn: >-
      An Angular component that lists the components, directives and pipes its template uses in its own imports array,
      instead of being declared in an NgModule. It's the default since Angular 19.
    definitionAr: >-
      component في Angular بتكتب الـ components والـ directives والـ pipes اللي الـ template بتاعها بيستخدمها في الـ
      imports بتاعتها هي، من غير ما تتعمل declare في NgModule. ودي الحالة الافتراضية من أول Angular 19.
  - id: lazy-loading
    term: Lazy loading
    definitionEn: >-
      Splitting part of an app into a separate JavaScript chunk that the browser downloads only when it's first needed,
      such as when the user opens a route.
    definitionAr: >-
      إنك تفصل جزء من التطبيق في chunk JavaScript لوحده، والـ browser مايحمّلوش غير أول ما يحتاجه، زي لما اليوزر يفتح
      route معيّن.
  - id: angular-signal
    term: Signal
    definitionEn: >-
      A wrapper around a value that notifies Angular when the value changes. You read it by calling it, like count(),
      and Angular records which templates and computed values read it so it knows what to update.
    definitionAr: >-
      wrapper حوالين قيمة بيبلّغ Angular لما القيمة تتغير. بتقراه بإنك تناديه زي count()، وAngular بيسجّل مين من الـ
      templates والـ computed values قراه، عشان يعرف يحدّث إيه.
  - id: pure-pipe
    term: Pure pipe
    definitionEn: >-
      An Angular pipe whose transform runs again only when its input changes, either a different primitive value or a
      new object reference. Pipes are pure by default, so Angular reuses the last result otherwise.
    definitionAr: >-
      pipe في Angular الـ transform بتاعها مابيشتغلش تاني غير لما الـ input بتاعها يتغير، يعني قيمة primitive مختلفة أو
      reference جديد لـ object. الـ pipes بتبقى pure بشكل افتراضي، فـ Angular بيعيد استخدام آخر نتيجة في غير كده.
  - id: lifecycle-hook
    term: Lifecycle hook
    definitionEn: >-
      A method Angular calls at a fixed moment in a component's life, such as ngOnInit after the first inputs are set or
      ngOnDestroy before the component is removed.
    definitionAr: >-
      method بيناديها Angular في لحظة محددة من عمر الـ component، زي ngOnInit بعد ما أول inputs تتحط، أو ngOnDestroy قبل
      ما الـ component تتشال.
  - id: injection-context
    term: Injection context
    definitionEn: >-
      The places where Angular's inject() works: while the DI system constructs a class (its constructor and field
      initializers), inside provider factory functions, and inside runInInjectionContext.
    definitionAr: >-
      الأماكن اللي inject() بتاعة Angular بتشتغل فيها: وقت ما الـ DI system بيعمل الـ class (الـ constructor والـ field
      initializers بتوعها)، وجوه الـ factory functions بتاعة الـ providers، وجوه runInInjectionContext.
  - id: change-detection
    term: Change detection
    definitionEn: >-
      Angular's process for keeping the DOM in sync with your state. In each pass it walks the component tree,
      re-evaluates the templates that need checking, and updates the DOM where a value differs from the last render.
    definitionAr: >-
      الطريقة اللي Angular بيخلّي بيها الـ DOM ماشي مع الـ state بتاعتك. في كل لفّة بيمشي على شجرة الـ components، ويعيد
      تقييم الـ templates اللي محتاجة check، ويحدّث الـ DOM في الأماكن اللي القيمة فيها اختلفت عن آخر render.
  - id: zoneless
    term: Zoneless change detection
    definitionEn: >-
      Running Angular without zone.js. Angular schedules change detection only when it's notified, for example by a
      signal read in a template, a template event listener or markForCheck(). It's the default since Angular 21.
    definitionAr: >-
      إنك تشغّل Angular من غير zone.js. ساعتها Angular مابيعملش change detection غير لما حاجة تنبّهه، زي signal بيتقري في
      template، أو event listener في الـ template، أو markForCheck(). وده الافتراضي من أول Angular 21.
  - id: hierarchical-injectors
    term: Hierarchical injectors
    definitionEn: >-
      Angular's tree of dependency injection containers: environment injectors for the app and its routes, and element
      injectors for components and directives that declare providers. Each injector keeps its own instances, and a
      lookup walks up the tree until it finds a provider.
    definitionAr: >-
      شجرة الـ dependency injection containers في Angular: environment injectors للتطبيق والـ routes بتاعته، وelement
      injectors للـ components والـ directives اللي بتعرّف providers. كل injector بيحتفظ بالـ instances بتاعته، والبحث
      بيطلع لفوق في الشجرة لحد ما يلاقي provider.
  - id: model-input
    term: Model input
    definitionEn: >-
      An Angular input declared with model(). It's a writable signal that also creates an output named after it with
      Change appended, so a parent can bind it with two-way syntax like [(value)] and receive every value the child
      writes.
    definitionAr: >-
      input في Angular بيتعرّف بـ model(). هو writable signal، وبيعمل كمان output بنفس اسمه وفي آخره Change، فالـ parent
      يقدر يربطه بالـ two-way syntax زي [(value)] ويستلم كل قيمة الـ child بيكتبها.
  - id: angular-effect
    term: Effect (Angular)
    definitionEn: >-
      A function registered with effect() that Angular runs again whenever a signal it read changes. Effects are
      scheduled, not run on the spot: a component's effects run during change detection. They're meant for side effects
      outside signals, such as storage, logging or a chart library.
    definitionAr: >-
      function بتسجّلها بـ effect()، وAngular بيشغّلها تاني كل ما signal قرتها تتغير. الـ effects بتتجدول ومش بتشتغل في
      ساعتها: الـ effects بتاعة الـ component بتشتغل وقت الـ change detection. ومعمولة للـ side effects اللي برّه الـ
      signals، زي الـ storage أو الـ logging أو chart library.
  - id: linked-signal
    term: Linked signal
    definitionEn: >-
      A writable Angular signal created with linkedSignal() whose value is computed from other signals, like computed(),
      but can also be set directly. When a signal its computation reads changes, it recomputes and replaces the value
      that was set.
    definitionAr: >-
      writable signal في Angular بتتعمل بـ linkedSignal()، قيمتها بتتحسب من signals تانية زي computed()، بس كمان تقدر
      تعمل لها set بنفسك. ولما signal الـ computation بتقراها تتغير، بتتحسب من جديد وتحل محل القيمة اللي اتعملها set.
  - id: rxjs-observable
    term: Observable
    definitionEn: >-
      An RxJS object that delivers a sequence of values over time to each subscriber, in order, and can complete or
      fail. Operators such as debounceTime and switchMap control which values arrive and when.
    definitionAr: >-
      object من RxJS بيوصّل سلسلة قيم على مدار الوقت لكل subscriber، بالترتيب، وممكن يخلص أو يفشل. والـ operators زي
      debounceTime وswitchMap بتتحكم في أنهي قيم توصل وإمتى.
  - id: onpush
    term: OnPush
    definitionEn: >-
      Angular's change detection strategy, the default since Angular 22, that checks a component only when it was
      marked dirty: by a new input value, an event in it or a descendant, a signal its template reads, or
      markForCheck(). An unmarked OnPush component is skipped along with its subtree.
    definitionAr: >-
      الـ change detection strategy في Angular، والافتراضية من أول Angular 22، اللي مابتعملش check للـ component غير لو
      اتعلّمت dirty: بقيمة input جديدة، أو event فيها أو في component تحتها، أو signal الـ template بتاعها بيقراها، أو
      markForCheck(). والـ component اللي OnPush ومش متعلّمة بتتساب هي والـ subtree بتاعها.
  - id: render-hook
    term: Render hook
    definitionEn: >-
      A callback registered with afterNextRender(), afterEveryRender() or afterRenderEffect() that Angular runs after
      it has updated the DOM, in the browser only. It's the place to read or write the DOM directly.
    definitionAr: >-
      callback بتسجّله بـ afterNextRender() أو afterEveryRender() أو afterRenderEffect()، وAngular بيشغّله بعد ما يحدّث
      الـ DOM، في الـ browser بس. وده المكان اللي تقرا فيه من الـ DOM أو تكتب فيه بإيدك.
  - id: content-projection
    term: Content projection
    definitionEn: >-
      Passing the elements written between a component's tags into that component's template, where <ng-content>
      placeholders mark where they appear. The projected elements still belong to the component that wrote them.
    definitionAr: >-
      إنك تبعت العناصر اللي مكتوبة بين الـ tags بتاعة component جوه الـ template بتاعها، والـ <ng-content> بيحدد هتظهر
      فين. والعناصر دي بتفضل ملك الـ component اللي كتبتها.
  - id: template-fragment
    term: Template fragment
    definitionEn: >-
      A piece of template declared with <ng-template> that Angular doesn't render where it's written. Code renders it on
      demand, with NgTemplateOutlet or ViewContainerRef, and its bindings are evaluated against the component that
      declared it.
    definitionAr: >-
      حتة template بتتعرّف بـ <ng-template>، وAngular مابيعرضهاش في المكان اللي اتكتبت فيه. الكود هو اللي بيعرضها وقت
      ما يحتاجها، بـ NgTemplateOutlet أو ViewContainerRef، والـ bindings اللي فيها بتتحسب على الـ component اللي عرّفتها.
  - id: barrel-file
    term: Barrel file
    definitionEn: >-
      A file, usually index.ts, that re-exports what other files export so they can all be imported from one path.
      Bundlers may treat it as a single module, which can pull every export into the same chunk.
    definitionAr: >-
      file، غالبًا index.ts، بيعمل re-export للي files تانية بتعمله export، عشان تعمل import لكله من path واحد. والـ
      bundlers ممكن تتعامل معاه كـ module واحد، وده ممكن يسحب كل الـ exports بتاعته في نفس الـ chunk.
  - id: cold-observable
    term: Cold Observable
    definitionEn: >-
      An Observable that starts its work, such as sending an HTTP request, separately for each subscriber at the moment
      it subscribes, instead of sharing one execution. Angular's HttpClient returns cold Observables.
    definitionAr: >-
      Observable بيبدأ شغله، زي إنه يبعت HTTP request، لكل subscriber لوحده في اللحظة اللي بيعمل فيها subscribe، بدل ما
      يشاركهم في تنفيذ واحد. والـ HttpClient بتاع Angular بيرجّع cold Observables.
  - id: memory-leak
    term: Memory leak
    definitionEn: >-
      Memory that a program no longer needs but can't release, because something long-lived still references it. In
      a browser app, a destroyed component stays in memory if a running subscription or listener still points to it.
    definitionAr: >-
      memory البرنامج مابقاش محتاجها بس مش قادر يفضّيها، لأن حاجة عايشة مدة طويلة لسه شايلة reference ليها. وفي تطبيق
      browser، الـ component اللي اتشالت بتفضل في الـ memory لو subscription أو listener شغال لسه بيشاور عليها.
  - id: view-encapsulation
    term: View encapsulation
    definitionEn: >-
      The setting that decides how Angular scopes a component's styles. The default, Emulated, adds a generated
      attribute to the component's template elements and to its selectors, so its rules can't match elements outside
      the template. It doesn't stop outside styles from matching elements inside.
    definitionAr: >-
      الإعداد اللي بيحدد Angular هيعمل scoping للـ styles بتاعة الـ component إزاي. الافتراضي Emulated، وبيضيف attribute
      متولّد على الـ elements اللي في الـ template وعلى الـ selectors بتاعتها، فالـ rules بتاعتها ماتمسكش elements برّه
      الـ template. بس مابيمنعش الـ styles اللي برّه إنها تمسك الـ elements اللي جوه.
  - id: css-custom-property
    term: CSS custom property
    definitionEn: >-
      A CSS property you name yourself with two leading dashes, such as --badge-bg, and read with var(). Its value
      inherits down the DOM tree like color does, which makes it a common way for a parent to configure a child's
      styles.
    definitionAr: >-
      property في CSS بتسمّيها بنفسك وقبلها شرطتين، زي --badge-bg، وبتقراها بـ var(). قيمتها بتتورث وهي نازلة في شجرة
      الـ DOM زي color بالظبط، وعشان كده بتبقى طريقة شائعة إن الـ parent يظبط الـ styles بتاعة الـ child.
  - id: reactive-forms
    term: Reactive Forms
    definitionEn: >-
      Angular's forms API in which you build the form model in the component class from FormControl, FormGroup and
      FormArray objects, then bind it to inputs. It has been strictly typed by default since Angular 14.
    definitionAr: >-
      الـ forms API في Angular اللي بتبني فيه الـ form model جوه الـ component class من objects زي FormControl وFormGroup
      وFormArray، وبعدين تربطه بالـ inputs. وبقى strictly typed بشكل افتراضي من أول Angular 14.
  - id: partial-type
    term: Partial<T>
    definitionEn: >-
      A built-in TypeScript utility type that makes every property of T optional, so each one may be undefined. Code
      that reads a property has to handle the case where it's missing.
    definitionAr: >-
      utility type جاهز في TypeScript بيخلّي كل property في T اختيارية، يعني أي واحدة فيهم ممكن تبقى undefined. والكود
      اللي بيقرا property لازم يتعامل مع احتمال إنها مش موجودة.
  - id: route-reuse-strategy
    term: Route reuse strategy
    definitionEn: >-
      The object Angular's router asks, on every navigation, whether it can keep the component of an active route. The
      default reuses it when the matched route config is the same, so a change of parameters alone doesn't create a
      new component.
    definitionAr: >-
      الـ object اللي الـ router في Angular بيسأله في كل navigation إذا كان ينفع يحتفظ بالـ component بتاعة route شغال.
      الافتراضي بيعيد استخدامها لما الـ route config اللي اتطابق يبقى هو هو، فتغيير الـ parameters لوحده مابيعملش
      component جديدة.
  - id: flattening-operator
    term: Flattening operator
    definitionEn: >-
      An RxJS operator such as switchMap, concatMap, mergeMap or exhaustMap that maps each source value to an inner
      Observable, such as an HTTP request, and subscribes to it. Each one handles a value that arrives while an earlier
      inner Observable is still running in its own way: cancel, queue, run in parallel or ignore.
    definitionAr: >-
      operator في RxJS زي switchMap أو concatMap أو mergeMap أو exhaustMap، بيحوّل كل قيمة جاية من الـ source لـ inner
      Observable، زي HTTP request، ويعمل عليه subscribe. وكل واحد فيهم بيتعامل بطريقته مع القيمة اللي توصل والـ inner
      Observable اللي قبلها لسه شغال: يلغيه، أو يستناه، أو يشغّلهم مع بعض، أو يتجاهل الجديدة.
  - id: angular-resource
    term: Resource (Angular)
    definitionEn: >-
      An Angular object, created with resource(), rxResource() or httpResource(), that loads async data from params
      computed from signals and exposes its value, status, error and loading state as signals. When the params change,
      it aborts the pending load and starts a new one.
    definitionAr: >-
      object في Angular بيتعمل بـ resource() أو rxResource() أو httpResource()، بيحمّل داتا async من params بتتحسب من
      signals، ويعرض القيمة والـ status والـ error وحالة التحميل كـ signals. ولما الـ params تتغير، بيلغي التحميل اللي
      لسه شغال ويبدأ واحد جديد.
  - id: angular-hydration
    term: Hydration (Angular)
    definitionEn: >-
      Angular's process for restoring a server-rendered page in the browser. It runs the app's components again but,
      instead of creating new DOM nodes, matches and reuses the ones in the server's HTML and attaches event listeners
      to them. The DOM must have the same structure on both sides.
    definitionAr: >-
      الطريقة اللي Angular بيرجّع بيها صفحة اتعملها render على الـ server جوه المتصفح. بيشغّل الـ components بتاعة
      التطبيق تاني، بس بدل ما يعمل DOM nodes جديدة، بيطابق اللي موجودة في الـ HTML اللي جه من الـ server ويعيد
      استخدامها ويربط عليها الـ event listeners. والـ DOM لازم يبقى بنفس الشكل في الناحيتين.
  - id: event-replay
    term: Event replay
    definitionEn: >-
      An Angular hydration feature that records native browser events, such as clicks, that happen on server-rendered
      HTML before hydration finishes, then replays them to the matching listeners once hydration completes. It's
      enabled along with incremental hydration.
    definitionAr: >-
      ميزة في الـ hydration بتاع Angular بتسجّل الـ native events بتاعة المتصفح، زي الـ clicks، اللي بتحصل على الـ HTML
      اللي جه من الـ server قبل ما الـ hydration يخلص، وبعدين تعيد تشغيلها على الـ listeners المناسبة أول ما يخلص.
      وبتبقى شغالة مع الـ incremental hydration.
  - id: prerendering
    term: Prerendering (SSG)
    definitionEn: >-
      Rendering routes to static HTML files at build time instead of on each request, also called static site
      generation. The build runs the app's components on the server platform, so the same browser-only code rules
      apply as with server-side rendering.
    definitionAr: >-
      إنك تعمل render للـ routes لـ HTML files ثابتة وقت الـ build بدل ما يحصل مع كل request، وبيتسمّى كمان static site
      generation. الـ build بيشغّل الـ components بتاعة التطبيق على الـ server platform، فنفس قواعد الكود اللي للمتصفح بس
      بتنطبق زي الـ server-side rendering بالظبط.
  - id: transfer-state
    term: TransferState
    definitionEn: >-
      Angular's key-value store that the server serializes into the rendered page and the browser reads back while
      the app starts. The HttpClient transfer cache and resources with an id use it to hand data the server already
      fetched to the browser.
    definitionAr: >-
      مخزن key-value في Angular، الـ server بيعمله serialize جوه الصفحة اللي اتعملها render، والمتصفح بيقراه تاني وهو
      بيشغّل التطبيق. والـ HttpClient transfer cache والـ resources اللي ليها id بيستخدموه عشان يسلّموا للمتصفح الداتا
      اللي الـ server جابها خلاص.
  - id: incremental-hydration
    term: Incremental hydration
    definitionEn: >-
      Angular's hydration mode in which @defer blocks with hydrate triggers are rendered on the server but stay
      dehydrated in the browser, as static HTML whose code hasn't loaded, until a trigger such as viewport or
      interaction fires. Then Angular loads that block's code and hydrates it. It's on by default since Angular 22.
    definitionAr: >-
      mode في الـ hydration بتاع Angular، الـ @defer blocks اللي فيها hydrate triggers بيتعملها render على الـ server،
      بس بتفضل dehydrated في المتصفح، يعني HTML ثابت الكود بتاعه لسه ماتحمّلش، لحد ما trigger زي viewport أو interaction
      يشتغل. ساعتها Angular بيحمّل الكود بتاع الـ block ده ويعمله hydrate. وشغال افتراضيًا من أول Angular 22.
