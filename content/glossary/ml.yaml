terms:
  - id: heuristic
    term: Heuristic
    definitionEn: >-
      A simple, quickly implemented rule that solves a problem well enough, such as "rank contacts by most recent
      use". In machine learning projects it is often the first solution and the benchmark a model must beat.
    definitionAr: >-
      قاعدة بسيطة تتكتب بسرعة وبتحل المشكلة بشكل كفاية، زي "رتّب الـ contacts حسب آخر استخدام". في مشاريع الـ Machine
      Learning غالبًا بتبقى أول حل، والمقياس اللي أي موديل لازم يغلبه.
  - id: baseline
    term: Baseline
    definitionEn: >-
      A simple reference solution, such as a heuristic or a basic model, measured on the same data as a new model. A
      more complex model is only worth it if it beats the baseline by enough to pay for its cost.
    definitionAr: >-
      حل مرجعي بسيط، زي heuristic أو موديل بسيط، بتقيسه على نفس الداتا اللي بتقيس عليها الموديل الجديد. الموديل الأعقد
      مايستاهلش غير لو غلب الـ baseline بفرق يغطّي تكلفته.
  - id: overfitting
    term: Overfitting
    definitionEn: >-
      When a model fits its training data so closely, noise included, that it predicts new data poorly. The usual sign
      is a high training score with a much lower score on held-out data.
    definitionAr: >-
      لما الموديل يحفظ الـ training data بالظبط، بالـ noise اللي فيها، لدرجة إنه يتوقع وحش على داتا جديدة. العلامة المعتادة
      إن الـ score على الـ training عالي وعلى الداتا اللي اتسابت للتقييم أقل بكتير.
  - id: generalization
    term: Generalization
    definitionEn: >-
      A model's ability to make good predictions on new data it never saw during training, which is what a model is
      actually for. Held-out data is how you measure it.
    definitionAr: >-
      قدرة الموديل إنه يتوقع صح على داتا جديدة ماشافهاش وقت الـ training، ودي الحاجة اللي الموديل معمول عشانها أصلًا.
      وبتقيسها بداتا سايبها برّه الـ training.
  - id: cross-validation
    term: Cross-Validation
    definitionEn: >-
      An evaluation method that splits the data into k parts (folds), trains on k-1 of them and scores on the one left
      out, rotating k times. The average score estimates performance on unseen data.
    definitionAr: >-
      طريقة تقييم بتقسم الداتا لـ k أجزاء (folds)، وتدرّب على k-1 منهم وتقيس على الجزء اللي اتساب، وتلف كده k مرات.
      ومتوسط الـ scores بيقدّر أداء الموديل على داتا ماشافهاش.
  - id: feature-engineering
    term: Feature Engineering
    definitionEn: >-
      Turning raw inputs into the columns a model learns from: scaling them, encoding categories, or adding computed
      features such as powers, ratios and spline pieces. The same model can do far better or worse depending on it.
    definitionAr: >-
      إنك تحوّل الداتا الخام للـ columns اللي الموديل بيتعلّم منها: تعملها scaling، أو encoding للـ categories، أو تضيف
      features محسوبة زي الأُسس والنِسب وقطع الـ spline. نفس الموديل ممكن يبقى أحسن أو أوحش بكتير على حسبها.
  - id: r-squared
    term: R² (coefficient of determination)
    definitionEn: >-
      A regression score: 1.0 is a perfect fit, 0.0 is what always predicting the average would get, and a negative
      value means the model does worse than that average.
    definitionAr: >-
      score للـ regression: الـ 1.0 معناه fit كامل، والـ 0.0 هو اللي هتجيبه لو فضلت تتوقع المتوسط على طول، والقيمة
      السالبة معناها إن الموديل أوحش من المتوسط ده.
  - id: gradient-descent
    term: Gradient Descent
    definitionEn: >-
      The training loop behind most models: compute the loss, compute its gradient with respect to the weights, and
      move the weights a small step in the direction that lowers the loss. Repeat until the loss stops improving.
    definitionAr: >-
      الـ loop اللي ورا تدريب أغلب الموديلات: تحسب الـ loss، وتحسب الـ gradient بتاعه بالنسبة للـ weights، وتحرّك الـ
      weights خطوة صغيرة في الاتجاه اللي بيقلّل الـ loss. وتكرر لحد ما الـ loss يبطّل يتحسّن.
  - id: learning-rate
    term: Learning Rate
    definitionEn: >-
      The number gradient descent multiplies the gradient by to size each weight update. Too small and training
      crawls; too large and the loss bounces around the minimum or diverges.
    definitionAr: >-
      الرقم اللي الـ gradient descent بيضرب فيه الـ gradient عشان يحدد حجم كل تحديث للـ weights. لو صغير قوي التدريب
      بيزحف، ولو كبير قوي الـ loss بيتنطط حوالين أقل نقطة أو بيفرقع.
  - id: feature-scaling
    term: Feature Scaling
    definitionEn: >-
      Transforming numeric features to comparable ranges, for example standardization (mean 0, standard deviation 1)
      or min-max scaling to 0–1. It matters for models that compare features through distances, penalties or
      gradient steps.
    definitionAr: >-
      إنك تحوّل الـ features الرقمية لمدى متقارب، زي الـ standardization (متوسط 0 وانحراف معياري 1) أو الـ min-max
      scaling من 0 لـ 1. بيفرق مع الموديلات اللي بتقارن الـ features بالمسافات أو الـ penalties أو خطوات الـ gradient.
  - id: one-hot-encoding
    term: One-Hot Encoding
    definitionEn: >-
      Turning a categorical feature into one column per category, set to 1 for the row's category and 0 for the rest.
      The model then learns a separate weight for each category, with no order implied between them.
    definitionAr: >-
      إنك تحوّل الـ categorical feature لعمود لكل category، قيمته 1 للـ category بتاعة الصف و0 لباقي الأعمدة. كده
      الموديل بيتعلّم weight منفصل لكل category، من غير ما يفترض أي ترتيب بينهم.
  - id: underfitting
    term: Underfitting
    definitionEn: >-
      When a model is too simple, or its features too poor, to capture the pattern in the data. Training and
      validation scores are both low and close together, and more training rows don't raise them.
    definitionAr: >-
      لما الموديل يبقى أبسط من اللازم، أو الـ features بتاعته ضعيفة، فمايقدرش يمسك الـ pattern اللي في الداتا. الـ
      score على الـ training والـ validation الاتنين واطيين وقريبين من بعض، وصفوف training زيادة مابترفعهمش.
  - id: bias-variance
    term: Bias and Variance
    definitionEn: >-
      The two parts of a model's error that you can reduce. Bias is the error it keeps whichever training set it
      gets, because it can't express the pattern; variance is how much its predictions change from one training set
      to another. More data shrinks variance, not bias.
    definitionAr: >-
      الجزأين اللي تقدر تقلّلهم من الـ error بتاع الموديل. الـ bias هو الغلط اللي بيفضل موجود أيًا كانت الـ training set،
      لأن الموديل مش قادر يعبّر عن الـ pattern؛ والـ variance هو قد إيه التوقعات بتتغيّر من training set للتانية. الداتا
      الزيادة بتقلّل الـ variance، مش الـ bias.
  - id: learning-curve
    term: Learning Curve
    definitionEn: >-
      A plot of a model's training and validation scores against the number of training examples. Its shape shows
      whether the model suffers from bias or variance, and whether more data would help.
    definitionAr: >-
      رسمة للـ score بتاع الموديل على الـ training والـ validation قصاد عدد أمثلة الـ training. شكلها بيوضّح الموديل
      عنده مشكلة bias ولا variance، وهل داتا أكتر هتفيد ولا لأ.
  - id: imputation
    term: Imputation
    definitionEn: >-
      Filling in missing values with estimates inferred from the known data, such as a column's mean or median, or a
      prediction from the other columns. The filled values are guesses, not measurements.
    definitionAr: >-
      إنك تملا القيم الناقصة بتقديرات من الداتا المعروفة، زي متوسط العمود أو الـ median بتاعه، أو توقع من باقي الأعمدة.
      القيم اللي بتتملي دي تخمين، مش قياس حقيقي.
  - id: data-leakage
    term: Data Leakage
    definitionEn: >-
      When information from the evaluation data, or from the future, reaches the model during training, for example by
      fitting a scaler or imputer on all rows before splitting. Scores look better than the model will do in
      production.
    definitionAr: >-
      لما معلومة من داتا التقييم، أو من المستقبل، توصل للموديل وقت الـ training، زي إنك تعمل fit لـ scaler أو imputer على
      كل الصفوف قبل الـ split. الـ scores بتطلع أحسن من اللي الموديل هيعمله فعلًا في الـ production.
  - id: curse-of-dimensionality
    term: Curse of Dimensionality
    definitionEn: >-
      The set of problems that appear as the number of features grows: the space grows so fast that a fixed number of
      rows covers it thinly, distances become less meaningful, and methods such as nearest neighbors lose accuracy and
      speed.
    definitionAr: >-
      مجموعة المشاكل اللي بتظهر لما عدد الـ features يزيد: المساحة بتكبر بسرعة لدرجة إن نفس عدد الصفوف بيغطّيها بشكل
      خفيف، والمسافات بتفقد معناها، وطرق زي الـ nearest neighbors بتخسر في الدقة والسرعة.
  - id: feature-selection
    term: Feature Selection
    definitionEn: >-
      Choosing a subset of the available features to train on, for example by a statistical test, a model's weights or
      importances, or by adding and removing features under cross-validation. It removes columns that add noise
      rather than signal.
    definitionAr: >-
      إنك تختار جزء من الـ features المتاحة تدرّب عليه، مثلًا بـ test إحصائي، أو بالـ weights أو الـ importances بتاعة
      موديل، أو بإنك تضيف وتشيل features تحت الـ cross-validation. بتشيل الأعمدة اللي بتزوّد noise مش معلومة.
  - id: class-imbalance
    term: Class Imbalance
    definitionEn: >-
      When one label is much rarer than the other, such as fraud among purchases. Accuracy becomes misleading, because
      always predicting the common label already scores high.
    definitionAr: >-
      لما label واحد يبقى نادر جدًا مقارنة بالتاني، زي الـ fraud وسط عمليات الشراء. الـ accuracy ساعتها بتضلّل، لأن إنك
      تتوقع الـ label الشائع على طول بيجيب score عالي لوحده.
  - id: decision-threshold
    term: Decision Threshold
    definitionEn: >-
      The probability cutoff that turns a classifier's score into a yes or no. Many libraries default to 0.5, but the
      right value depends on the class balance and on what each kind of mistake costs.
    definitionAr: >-
      الحد اللي بيحوّل الاحتمال اللي طالع من الـ classifier لـ أيوه أو لأ. مكتبات كتير الـ default بتاعها 0.5، بس القيمة
      الصح بتعتمد على توزيع الـ classes وعلى تكلفة كل نوع غلط.
  - id: gradient-boosting
    term: Gradient Boosting
    definitionEn: >-
      An ensemble method that builds decision trees one after another, each new tree correcting the errors left by the
      trees before it. XGBoost and scikit-learn's HistGradientBoosting models are common implementations.
    definitionAr: >-
      طريقة ensemble بتبني decision trees ورا بعض، وكل tree جديدة بتصلّح الغلط اللي سابته الـ trees اللي قبلها. ومن أشهر
      تطبيقاتها XGBoost وموديلات HistGradientBoosting في scikit-learn.
  - id: inductive-bias
    term: Inductive Bias
    definitionEn: >-
      The assumptions a learning method makes about which patterns are likely, which decide what it learns easily from
      limited data. Trees favor axis-aligned, step-like rules; neural networks favor smooth functions.
    definitionAr: >-
      الافتراضات اللي طريقة التعلّم بتعملها عن أنهي patterns متوقعة أكتر، وهي اللي بتحدد إيه اللي تتعلّمه بسهولة من داتا
      محدودة. الـ trees بتميل لـ rules على شكل سلالم على كل عمود لوحده، والـ neural networks بتميل للـ functions الناعمة.
  - id: k-means
    term: K-Means
    definitionEn: >-
      A clustering algorithm that places k centers and assigns each point to the nearest one, moving the centers to
      minimize the sum of squared distances. You choose k, and it works best on round groups of similar spread.
    definitionAr: >-
      algorithm للـ clustering بيحط k مراكز ويضم كل نقطة لأقرب مركز ليها، وبيحرّك المراكز عشان يقلّل مجموع مربعات
      المسافات. إنت اللي بتحدد k، وبيشتغل أحسن مع مجموعات مدوّرة وانتشارها متقارب.
  - id: silhouette-coefficient
    term: Silhouette Coefficient
    definitionEn: >-
      A score from -1 to 1 for a clustering, computed from how close each point is to its own cluster compared with the
      next nearest one. It needs no labels, but it favors compact, convex clusters.
    definitionAr: >-
      score من -1 لـ 1 بيقيّم الـ clustering، بيتحسب من قد إيه كل نقطة قريبة من الـ cluster بتاعها مقارنةً بأقرب cluster
      تاني. مش محتاج labels، بس بيفضّل الـ clusters المتماسكة والـ convex.
  - id: confounder
    term: Confounder
    definitionEn: >-
      A variable that affects both a feature and the outcome, such as ability affecting both education and wages. Left
      out, it makes the feature look more influential than it is.
    definitionAr: >-
      متغيّر بيأثر على الـ feature وعلى النتيجة في نفس الوقت، زي القدرات اللي بتأثر على التعليم وعلى المرتب. لو سبته برّه،
      الـ feature بتبان مؤثرة أكتر من حقيقتها.
  - id: ab-test
    term: A/B Test
    definitionEn: >-
      An experiment that assigns users at random to two or more variants, such as with and without a feature, and
      compares the outcome. Random assignment balances every other factor, measured or not, so the difference
      estimates the variant's real effect.
    definitionAr: >-
      تجربة بتوزّع المستخدمين عشوائيًا على نسختين أو أكتر، زي بالـ feature ومن غيرها، وبتقارن النتيجة. التوزيع العشوائي
      بيوازن كل العوامل التانية، سواء اتقاست أو لأ، فالفرق بيقدّر التأثير الحقيقي للنسخة.
  - id: principal-component-analysis
    term: Principal Component Analysis (PCA)
    definitionEn: >-
      A technique that rotates the data onto new axes, the principal components, ordered by how much variance each
      captures, so you can keep only the first few. It ignores the target, and each component mixes all original
      features.
    definitionAr: >-
      طريقة بتلف الداتا على محاور جديدة اسمها principal components، مترتبة حسب قد إيه كل واحد فيها شايل variance، عشان
      تحتفظ بأول كام واحد بس. مابتبصش على الـ target، وكل component خليط من كل الـ features الأصلية.
