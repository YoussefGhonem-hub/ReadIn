terms:
  - id: type-coercion
    term: Type coercion
    definitionEn: >-
      JavaScript converting a value from one type to another on its own, for example a string to a number, because an
      operator such as == or + received operands of different types.
    definitionAr: >-
      إن JavaScript تحوّل قيمة من نوع لنوع تاني من نفسها، زي string لـ number، لأن operator زي == أو + جاله قيم من
      أنواع مختلفة.
  - id: nan
    term: NaN
    definitionEn: >-
      "Not a Number", a special value of the Number type that results from invalid math or failed conversions, such as
      Number("abc"). It is the only value that is not equal to itself with == or ===.
    definitionAr: >-
      اختصار "Not a Number"، قيمة خاصة من نوع Number بتطلع من عملية حسابية مش صالحة أو تحويل فشل، زي Number("abc").
      وهي القيمة الوحيدة اللي مش بتساوي نفسها بـ == ولا بـ ===.
  - id: js-strict-mode
    term: Strict mode (JavaScript)
    definitionEn: >-
      A stricter variant of JavaScript that turns some silent mistakes into errors. Classes and ES modules always run
      in it; elsewhere you opt in with "use strict". In strict code, a plain function call gets this as undefined.
    definitionAr: >-
      نسخة أصرم من JavaScript بتحوّل شوية أخطاء كانت بتعدّي في صمت لـ errors. الـ classes والـ ES modules دايمًا شغالة
      بيها، وفي أي مكان تاني بتفعّلها بـ "use strict". وفي الكود الـ strict، الـ function اللي بتتنادى لوحدها بتاخد
      this بقيمة undefined.
  - id: arrow-function
    term: Arrow function
    definitionEn: >-
      A compact function written with =>, such as (x) => x * 2. It has no this of its own: it uses the this of the
      code around it, and call, apply and bind can't change that.
    definitionAr: >-
      function مختصرة بتتكتب بـ =>، زي (x) => x * 2. مالهاش this خاص بيها: بتستخدم this بتاع الكود اللي حواليها، والـ
      call والـ apply والـ bind مايقدروش يغيّروه.
  - id: bound-function
    term: Bound function
    definitionEn: >-
      The new function returned by fn.bind(obj). Whenever it is called, it calls fn with this set to obj, and a later
      call() or bind() can't change that.
    definitionAr: >-
      الـ function الجديدة اللي بترجع من fn.bind(obj). كل ما تتنادى بتنادي fn وهي مثبّتة this على obj، وأي call() أو
      bind() بعد كده مايقدرش يغيّر ده.
  - id: js-closure
    term: Closure (JavaScript)
    definitionEn: >-
      A function together with references to the variables of the scopes it was created in. It reads those variables
      when it runs, so it sees their current values, not copies taken when it was created.
    definitionAr: >-
      function ومعاها references للمتغيرات بتاعة الـ scopes اللي اتعملت جواها. بتقرا المتغيرات دي وقت ما تشتغل، فبتشوف
      قيمتها الحالية، مش نسخة اتاخدت لحظة ما اتعملت.
  - id: lexical-environment
    term: Lexical environment
    definitionEn: >-
      The record JavaScript creates each time a scope runs (a function call, a block, a loop iteration) to hold that
      scope's variables, linked to the environment of the scope around it.
    definitionAr: >-
      الـ record اللي JavaScript بتعمله كل ما scope يشتغل (نداء function أو block أو لفة loop) عشان يشيل متغيرات الـ
      scope ده، ومربوط بالـ environment بتاع الـ scope اللي حواليه.
  - id: ieee-754-double
    term: IEEE 754 double
    definitionEn: >-
      The 64-bit binary floating-point format behind every JavaScript Number: 1 sign bit, 11 exponent bits and 52
      fraction bits, giving about 15 to 17 significant decimal digits. Java and C# use it for double.
    definitionAr: >-
      الـ format الـ binary بتاع الـ floating-point اللي حجمه 64 bit، واللي ورا كل Number في JavaScript: bit للإشارة و11
      bit للـ exponent و52 bit للكسر، وده بيدّيك حوالي 15 لـ 17 رقم عشري مهم. ونفسه اللي Java وC# بيستخدموه للـ double.
  - id: minor-unit
    term: Minor unit
    definitionEn: >-
      The smallest unit of a currency, such as the piastre for the Egyptian pound or the cent for the US dollar. ISO
      4217 lists how many minor-unit digits each currency has.
    definitionAr: >-
      أصغر وحدة في العملة، زي القرش للجنيه المصري أو الـ cent للدولار. والـ ISO 4217 بيحدد كل عملة ليها كام رقم بعد
      العلامة العشرية.
  - id: pass-by-sharing
    term: Pass by sharing
    definitionEn: >-
      How JavaScript passes objects to functions: the parameter receives a copy of the reference, so both sides share
      one object. Mutating it is visible to the caller; assigning a new object to the parameter is not.
    definitionAr: >-
      الطريقة اللي JavaScript بتبعت بيها الـ objects للـ functions: الـ parameter بياخد نسخة من الـ reference، فالطرفين
      بيشاركوا object واحد. أي تعديل فيه بيبان عند اللي نادى، لكن لو حطيت object جديد في الـ parameter مش هيبان.
  - id: deep-copy
    term: Deep copy
    definitionEn: >-
      A copy of an object that also copies every nested object, so the copy and the original share nothing and can
      change independently. structuredClone makes one for plain data.
    definitionAr: >-
      نسخة من object بتنسخ كمان كل الـ objects اللي جواه، فالنسخة والأصل مابيشاركوش أي حاجة وكل واحد يتغير لوحده.
      والـ structuredClone بتعمل نسخة زي دي للداتا العادية.
  - id: event-loop
    term: Event loop
    definitionEn: >-
      The loop that drives a JavaScript environment: it picks one task, runs it to completion, then runs every queued
      microtask, and in a browser may update the rendering before it picks the next task.
    definitionAr: >-
      الـ loop اللي بيشغّل بيئة JavaScript: بياخد task واحدة ويشغّلها لحد ما تخلص، وبعدين يشغّل كل الـ microtasks اللي
      مستنية، وفي المتصفح ممكن يحدّث الرسم على الشاشة قبل ما ياخد الـ task اللي بعدها.
  - id: microtask
    term: Microtask
    definitionEn: >-
      A short job queued by a promise reaction, the code after an await, or queueMicrotask(). Microtasks run as soon as
      the call stack is empty, all of them, before the event loop picks the next task.
    definitionAr: >-
      شغلانة صغيرة بتتحط في الطابور بسبب promise اتحلّ، أو الكود اللي بعد await، أو queueMicrotask(). الـ microtasks
      بتشتغل أول ما الـ call stack يفضى، كلها، قبل ما الـ event loop ياخد الـ task اللي بعدها.
  - id: main-thread
    term: Main thread
    definitionEn: >-
      The single thread where a page's JavaScript, event handlers, style calculation, layout and painting all take
      turns. While one piece of JavaScript runs on it, nothing else on that list can.
    definitionAr: >-
      الـ thread الوحيد اللي الـ JavaScript بتاعة الصفحة والـ event handlers وحساب الـ styles والـ layout والرسم كلهم
      بياخدوا دورهم عليه. وطول ما فيه كود JavaScript شغال عليه، مفيش أي حاجة من دول تقدر تشتغل.
  - id: web-worker
    term: Web Worker
    definitionEn: >-
      A script the browser runs on a background thread, created with new Worker(url). It can't touch the DOM and talks
      to the page only through postMessage, so heavy work there doesn't block the main thread.
    definitionAr: >-
      script المتصفح بيشغّله على thread في الخلفية، وبتعمله بـ new Worker(url). مايقدرش يلمس الـ DOM وبيكلّم الصفحة بس عن
      طريق postMessage، فالشغل التقيل اللي جواه مابيوقفش الـ main thread.
  - id: prototype-chain
    term: Prototype chain
    definitionEn: >-
      The linked series of objects JavaScript searches when you read a property: the object itself, then its
      prototype, then that prototype's prototype, until the property is found or the chain ends at null.
    definitionAr: >-
      سلسلة الـ objects المربوطة ببعض اللي JavaScript بتدوّر فيها لما تقرا property: الـ object نفسه الأول، وبعدين الـ
      prototype بتاعه، وبعدين الـ prototype بتاع الـ prototype، لحد ما تلاقيها أو السلسلة تخلص عند null.
  - id: mark-and-sweep
    term: Mark-and-sweep
    definitionEn: >-
      The garbage collection approach modern JavaScript engines use: starting from roots such as the global object and
      the running code's variables, mark every object that can be reached, then free everything that wasn't marked.
    definitionAr: >-
      طريقة الـ garbage collection اللي الـ JavaScript engines الحديثة بتستخدمها: تبدأ من الـ roots زي الـ global object
      ومتغيرات الكود الشغال، وتعلّم على كل object ممكن يتوصله، وبعدين تفضّي كل حاجة ماتعلّمش عليها.
  - id: detached-dom-node
    term: Detached DOM node
    definitionEn: >-
      An element that has been removed from the page's DOM tree but is still referenced from JavaScript, so it can't be
      garbage collected. Chrome DevTools lists these as Detached in a heap snapshot.
    definitionAr: >-
      element اتشال من الـ DOM tree بتاع الصفحة بس لسه فيه JavaScript شايلة reference ليه، فمينفعش يتعمله garbage
      collection. والـ Chrome DevTools بيعرضهم باسم Detached في الـ heap snapshot.
  - id: live-binding
    term: Live binding
    definitionEn: >-
      What an ES module import gives you: a read-only view of the exporting module's variable, not a copy. When the
      exporter assigns a new value, every importer sees it; importers themselves can't reassign it.
    definitionAr: >-
      اللي الـ import في الـ ES modules بيدّيهولك: view للقراية بس على المتغير بتاع الـ module اللي عامل export، مش نسخة
      منه. لما الـ module ده يحط قيمة جديدة، كل اللي عامل import بيشوفها؛ لكن اللي عامل import نفسه مايقدرش يغيّرها.
  - id: css-box-model
    term: CSS box model
    definitionEn: >-
      The four nested areas every element's box is made of: content, padding, border and margin. The box-sizing
      property decides whether width and height measure the content box (the default) or the border box.
    definitionAr: >-
      الأربع طبقات اللي جوه بعض واللي أي box لأي element متكوّن منها: الـ content والـ padding والـ border والـ margin.
      والـ box-sizing هي اللي بتحدد الـ width والـ height بيقيسوا الـ content box (الافتراضي) ولا الـ border box.
  - id: margin-collapsing
    term: Margin collapsing
    definitionEn: >-
      In normal block layout, adjacent vertical margins (between siblings, or between a parent and its first or last
      child) combine into one margin the size of the largest. It doesn't happen in flex or grid containers.
    definitionAr: >-
      في الـ block layout العادي، الـ margins الرأسية اللي لازقة في بعض (بين elements جنب بعض، أو بين parent وأول أو آخر
      child) بتتدمج في margin واحد قد الأكبر فيهم. وده مابيحصلش جوه flex أو grid container.
  - id: css-specificity
    term: Specificity (CSS)
    definitionEn: >-
      The weight of a selector, written ID-CLASS-TYPE: the number of IDs, then of classes, attributes and
      pseudo-classes, then of types and pseudo-elements. Two selectors are compared column by column from the left.
    definitionAr: >-
      وزن الـ selector، وبيتكتب ID-CLASS-TYPE: عدد الـ IDs، وبعدين عدد الـ classes والـ attributes والـ pseudo-classes،
      وبعدين عدد الـ types والـ pseudo-elements. وأي اتنين selectors بيتقارنوا عمود بعمود من الشمال.
  - id: cascade-layer
    term: Cascade layer
    definitionEn: >-
      A named group of CSS rules declared with @layer. For normal declarations, a later layer beats an earlier one
      before specificity is compared, and styles outside any layer beat all layered styles. !important reverses both.
    definitionAr: >-
      مجموعة CSS rules ليها اسم وبتتعرّف بـ @layer. في الـ declarations العادية، الـ layer اللي بعد بيكسب اللي قبله قبل
      ما الـ specificity تتقارن أصلًا، والـ styles اللي برّه أي layer بتكسب كل الـ layers. والـ !important بتعكس الاتنين.
  - id: accessibility-tree
    term: Accessibility tree
    definitionEn: >-
      A tree the browser builds alongside the DOM, giving each meaningful element a role, an accessible name and its
      states. Screen readers and other assistive technologies read the page through it; ARIA attributes edit it.
    definitionAr: >-
      شجرة المتصفح بيبنيها جنب الـ DOM، وبيدّي فيها كل element ليه معنى role و accessible name والـ states بتاعته.
      الـ screen readers وباقي الـ assistive technologies بيقروا الصفحة من خلالها، والـ ARIA attributes بتعدّل فيها.
  - id: accessible-name
    term: Accessible name
    definitionEn: >-
      The name assistive technology announces for an element, such as "Place order" for a button. The browser computes
      it from the element's content, its label, or aria-label and aria-labelledby.
    definitionAr: >-
      الاسم اللي الـ assistive technology بتنطقه للعنصر، زي "Place order" لزرار. والمتصفح بيحسبه من المحتوى اللي جوه
      العنصر، أو الـ label بتاعه، أو من aria-label و aria-labelledby.
  - id: focus-indicator
    term: Focus indicator
    definitionEn: >-
      The visible mark, usually an outline or "focus ring", that shows which element currently has keyboard focus.
      WCAG 2.4.7 Focus Visible requires one for keyboard users.
    definitionAr: >-
      العلامة اللي بتبان، غالبًا outline أو "focus ring"، وبتوضح أنهي element عليه الـ keyboard focus دلوقتي. والـ WCAG
      في 2.4.7 Focus Visible بتشترط وجودها لمستخدمي الكيبورد.
  - id: forced-colors-mode
    term: Forced colors mode
    definitionEn: >-
      A user setting, such as a Windows contrast theme, in which the browser replaces the page's colors with a small
      palette the user chose. Author colors are overridden and box-shadow is removed; CSS can detect it with
      @media (forced-colors: active).
    definitionAr: >-
      إعداد عند المستخدم، زي الـ contrast themes في Windows، المتصفح فيه بيبدّل ألوان الصفحة بمجموعة ألوان صغيرة المستخدم
      اختارها. ألوان الموقع بتتلغي والـ box-shadow بيتشال، والـ CSS تقدر تعرفه بـ @media (forced-colors: active).
  - id: stacking-context
    term: Stacking context
    definitionEn: >-
      A group of elements the browser layers together and then paints as one unit inside its parent context. z-index
      values only compete inside the same stacking context. The root element, positioned elements with a z-index,
      sticky and fixed elements, opacity below 1 and transforms all create one.
    definitionAr: >-
      مجموعة elements المتصفح بيرتّبهم فوق بعض مع بعض، وبعدين يرسمهم كوحدة واحدة جوه الـ context الأب. وقيم الـ z-index
      بتتنافس بس جوه نفس الـ stacking context. والـ root element، والـ elements الـ positioned اللي عليها z-index، والـ
      sticky والـ fixed، والـ opacity الأقل من 1، والـ transforms، كلهم بيعملوا واحد.
  - id: top-layer
    term: Top layer
    definitionEn: >-
      A browser-managed layer that sits above every other layer of the page. Fullscreen elements, dialogs opened with
      showModal() and popovers shown with showPopover() are rendered there, so no z-index can cover them.
    definitionAr: >-
      طبقة المتصفح بيديرها بنفسه وبتبقى فوق كل طبقات الصفحة. العناصر اللي في الـ fullscreen، والـ dialogs اللي اتفتحت بـ
      showModal()، والـ popovers اللي اتعرضت بـ showPopover() بيترسموا فيها، فمفيش z-index يقدر يغطيهم.
  - id: rendering-pipeline
    term: Rendering pipeline (pixel pipeline)
    definitionEn: >-
      The work a browser does to turn a change into pixels: JavaScript, Style, Layout, Paint and Composite. A change
      runs only the stages it needs, so a new width costs far more than a new opacity.
    definitionAr: >-
      الشغل اللي المتصفح بيعمله عشان يحوّل أي تغيير لـ pixels: JavaScript و Style و Layout و Paint و Composite. والتغيير
      بيشغّل المراحل اللي محتاجها بس، فتغيير الـ width بيكلّف أكتر بكتير من تغيير الـ opacity.
  - id: layout-reflow
    term: Layout (reflow)
    definitionEn: >-
      The rendering stage that computes the size and position of every box on the page. Running it again after a
      change is called a reflow, and one element's new geometry can move many others.
    definitionAr: >-
      مرحلة الرسم اللي بتحسب مقاس ومكان كل box في الصفحة. ولما تتعاد بعد أي تغيير اسمها reflow، والأبعاد الجديدة لعنصر
      واحد ممكن تحرّك عناصر كتير غيره.
  - id: compositor-layer
    term: Compositor layer
    definitionEn: >-
      A part of the page the browser paints separately and then combines with the other layers. Changing transform or
      opacity on an element with its own layer needs no new layout or paint. will-change: transform promotes one.
    definitionAr: >-
      جزء من الصفحة المتصفح بيرسمه لوحده، وبعدين يجمّعه مع باقي الـ layers. وتغيير الـ transform أو الـ opacity لعنصر
      ليه layer لوحده مش محتاج layout ولا paint جديد. والـ will-change: transform بتعمله layer لوحده.
  - id: core-web-vitals
    term: Core Web Vitals
    definitionEn: >-
      Three metrics Google uses for page experience: LCP for loading, INP for responsiveness and CLS for visual
      stability. A page passes when all three are good at the 75th percentile of real visits.
    definitionAr: >-
      تلات مقاييس جوجل بتستخدمها لتجربة الصفحة: الـ LCP للتحميل، والـ INP لسرعة الاستجابة، والـ CLS لثبات الشكل. والصفحة
      بتنجح لما التلاتة يبقوا good عند الـ 75th percentile من الزيارات الحقيقية.
  - id: chrome-ux-report
    term: Chrome UX Report (CrUX)
    definitionEn: >-
      Google's public dataset of how real, opted-in Chrome users experience popular, public pages and origins. It feeds
      the field data in PageSpeed Insights and Search Console.
    definitionAr: >-
      الـ dataset العامة بتاعة جوجل اللي فيها تجربة مستخدمين Chrome حقيقيين، موافقين على مشاركة البيانات، مع الصفحات والـ
      origins العامة اللي عليها زيارات كفاية. ومنها بتيجي الـ field data في PageSpeed Insights و Search Console.
  - id: largest-contentful-paint
    term: Largest Contentful Paint (LCP)
    definitionEn: >-
      The Core Web Vital for loading: the time from the start of navigation until the largest image or text block in
      the viewport is rendered. Good is 2.5 seconds or less at the 75th percentile.
    definitionAr: >-
      مقياس الـ Core Web Vitals الخاص بالتحميل: الوقت من أول الـ navigation لحد ما أكبر صورة أو كتلة نص في الشاشة
      تترسم. والـ good هو 2.5 ثانية أو أقل عند الـ 75th percentile.
  - id: preload-scanner
    term: Preload scanner
    definitionEn: >-
      A secondary parser in the browser that reads the raw HTML as it arrives and starts fetching the resources it
      finds, such as images, scripts and stylesheets, even while the main parser is blocked.
    definitionAr: >-
      parser تاني جوه المتصفح بيقرا الـ HTML الخام أول ما يوصل، ويبدأ يطلب الـ resources اللي بيلاقيها زي الصور والـ
      scripts والـ stylesheets، حتى لو الـ parser الأساسي واقف.
  - id: forced-synchronous-layout
    term: Forced synchronous layout (forced reflow)
    definitionEn: >-
      Layout the browser has to run immediately, inside your JavaScript, because the code read a geometry value such as
      offsetHeight after changing styles. Normally layout would wait and run once, later in the frame.
    definitionAr: >-
      layout المتصفح بيضطر يعمله في ساعتها، جوه الـ JavaScript بتاعتك، لأن الكود قرا قيمة أبعاد زي offsetHeight بعد ما
      غيّر styles. والطبيعي إن الـ layout يستنى ويشتغل مرة واحدة بعدين في الـ frame.
  - id: layout-thrashing
    term: Layout thrashing
    definitionEn: >-
      Forcing many synchronous layouts in quick succession, typically in a loop that alternates style writes and
      geometry reads, so the browser recomputes layout on every iteration.
    definitionAr: >-
      إنك تجبر المتصفح على layouts متزامنة كتير ورا بعض، غالبًا في loop بيبدّل بين كتابة styles وقراية أبعاد، فالمتصفح
      يعيد حساب الـ layout في كل لفة.
  - id: interaction-to-next-paint
    term: Interaction to Next Paint (INP)
    definitionEn: >-
      The Core Web Vital for responsiveness: for clicks, taps and key presses, the time from the input until the next
      frame is painted. A page reports its longest interaction, ignoring outliers; good is 200 ms or less.
    definitionAr: >-
      مقياس الـ Core Web Vitals الخاص بسرعة الاستجابة: في الـ clicks والـ taps والضغط على الكيبورد، الوقت من الـ input
      لحد ما الـ frame اللي بعده يترسم. والصفحة بتسجّل أطول تفاعل فيها من غير الحالات الشاذة، والـ good هو 200 ms أو أقل.
  - id: long-task
    term: Long task
    definitionEn: >-
      A task that keeps the main thread busy for more than 50 ms. While it runs, the browser can't handle input or
      paint, so long tasks delay interactions and animations.
    definitionAr: >-
      task بتشغل الـ main thread أكتر من 50 ms. وطول ما هي شغالة، المتصفح مايقدرش يتعامل مع الـ input ولا يرسم، فالـ
      long tasks بتأخّر التفاعلات والـ animations.
