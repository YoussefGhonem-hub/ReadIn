terms:
  - id: single-responsibility-principle
    term: Single Responsibility Principle
    definitionEn: The S in SOLID. Robert C. Martin states it as "each software module should have one and only one reason to change", where a reason to change is a group of people, such as finance or operations, who request changes to that code.
    definitionAr: حرف الـ S في SOLID. Robert C. Martin بيعرّفه إن الـ module يبقى ليه سبب واحد بس يتغيّر عشانه، والسبب ده هو مجموعة ناس، زي الـ finance أو الـ operations، هم اللي بيطلبوا التغيير في الكود ده.
  - id: cohesion
    term: Cohesion
    definitionEn: How strongly the parts of a module belong together. High cohesion means the code inside a module changes for the same reasons and is usually changed together.
    definitionAr: قد إيه أجزاء الـ module مترابطة مع بعض. الـ cohesion العالية معناها إن الكود اللي جوه الـ module بيتغيّر لنفس الأسباب، وغالبًا بيتغيّر مع بعض.
  - id: coupling
    term: Coupling
    definitionEn: How much one module depends on another, so that changing one forces you to change, retest or redeploy the other. Loose coupling keeps those knock-on changes small.
    definitionAr: قد إيه module معتمد على module تاني، بحيث إن تغيير واحد يجبرك تغيّر أو تعيد test أو deploy للتاني. والـ loose coupling بيخلّي التغييرات اللي بتجرّ بعضها دي قليلة.
  - id: dry-principle
    term: DRY (Don't Repeat Yourself)
    definitionEn: A principle from Andy Hunt and Dave Thomas's The Pragmatic Programmer. Every piece of knowledge must have a single, unambiguous, authoritative representation within a system. It targets duplicated knowledge, such as a business rule written in two places, not just copy-pasted lines.
    definitionAr: مبدأ من كتاب The Pragmatic Programmer بتاع Andy Hunt و Dave Thomas. كل معلومة في السيستم لازم يبقى ليها تمثيل واحد واضح هو المرجع. والمقصود الـ knowledge المتكررة، زي business rule مكتوبة في مكانين، مش بس سطور كود متنسخة.
  - id: coincidental-duplication
    term: Coincidental duplication
    definitionEn: Code that looks the same but represents different knowledge, such as two validations that happen to share rules today. Merging it couples things that will need to change separately.
    definitionAr: كود شكله واحد بس بيمثّل knowledge مختلفة، زي اتنين validations صادف إن قواعدهم واحدة النهارده. ودمجهم بيربط حاجتين هيحتاجوا يتغيّروا كل واحدة لوحدها.
  - id: yagni
    term: YAGNI (You Aren't Gonna Need It)
    definitionEn: An Extreme Programming practice. Don't build a capability, or an abstraction to support it, until a real requirement needs it, because the guess is often wrong and the extra code costs effort, delay and complexity in the meantime.
    definitionAr: ممارسة من الـ Extreme Programming. ماتبنيش capability، ولا abstraction عشانها، غير لما requirement حقيقي يحتاجها، لأن التوقع كتير بيطلع غلط، والكود الزيادة بيكلّف مجهود وتأخير وتعقيد لحد ما ييجي وقته.
  - id: presumptive-feature
    term: Presumptive feature
    definitionEn: Martin Fowler's term for code that supports a feature nobody can use yet, built now because the team expects to need it later.
    definitionAr: المصطلح اللي Martin Fowler بيستخدمه لكود بيخدم feature محدش يقدر يستخدمها لسه، اتبنى دلوقتي عشان الفريق متوقع إنه هيحتاجها بعدين.
  - id: open-closed-principle
    term: Open/Closed Principle
    definitionEn: The O in SOLID, first described by Bertrand Meyer in 1988. A module should be open for extension and closed for modification, which in practice means expected kinds of change can be added with new code while code that clients depend on stays stable. It doesn't forbid fixing or improving existing code.
    definitionAr: حرف الـ O في SOLID، وأول من وصفه Bertrand Meyer سنة 1988. الـ module يبقى مفتوح للتوسيع ومقفول للتعديل، ويعني عمليًا إن أنواع التغيير المتوقعة تتضاف بكود جديد، والكود اللي الـ clients معتمدين عليه يفضل ثابت. ومش بيمنع إنك تصلّح أو تحسّن الكود الموجود.
  - id: protected-variation
    term: Protected Variation
    definitionEn: A design principle that Craig Larman describes as essentially the same as the Open/Closed Principle. Identify points of predicted variation and create a stable interface around them, so changes there don't ripple into the code that uses them.
    definitionAr: مبدأ تصميم Craig Larman بيعتبره تقريبًا نفس الـ Open/Closed Principle. حدّد الأماكن اللي متوقع تتغيّر، واعمل حواليها interface ثابتة، عشان التغيير هناك مايتسرّبش للكود اللي بيستخدمها.
  - id: liskov-substitution-principle
    term: Liskov Substitution Principle
    definitionEn: The L in SOLID, based on Barbara Liskov's work on behavioral subtyping. Code written against a type must keep working when given any subtype or implementation of it, which depends on behavior (what inputs are accepted, what results and exceptions callers can expect), not just on signatures that compile.
    definitionAr: حرف الـ L في SOLID، ومبني على شغل Barbara Liskov عن الـ behavioral subtyping. الكود المكتوب على type لازم يفضل شغال لما تديله أي subtype أو implementation ليه، وده معتمد على السلوك (بيقبل inputs إيه، والـ callers يتوقعوا نتايج و exceptions إيه)، مش بس على signatures بتعمل compile.
  - id: precondition
    term: Precondition
    definitionEn: What must be true before a method is called for it to work, such as "the amount is positive and no larger than what was captured". A subtype may accept more than its base type, never less.
    definitionAr: الحاجة اللي لازم تبقى صح قبل ما تنادي method عشان تشتغل، زي "المبلغ موجب ومش أكبر من اللي اتخصم". والـ subtype ممكن يقبل أكتر من الـ base type، عمره ما يقبل أقل.
  - id: postcondition
    term: Postcondition
    definitionEn: What a method guarantees when it returns, such as "the refund was recorded". A subtype may promise more than its base type, never less.
    definitionAr: الحاجة اللي الـ method بتضمنها لما ترجع، زي "الـ refund اتسجّل". والـ subtype ممكن يوعد بأكتر من الـ base type، عمره ما يوعد بأقل.
  - id: header-interface
    term: Header interface
    definitionEn: Martin Fowler's term for an interface that copies the public methods of one class, such as an IEmailSender extracted from SmtpEmailSender. It adds a seam but keeps that class's shape and vocabulary.
    definitionAr: المصطلح اللي Martin Fowler بيستخدمه لـ interface بتنسخ الـ public methods بتاعة class واحدة، زي IEmailSender اتعملها extract من SmtpEmailSender. بتضيف نقطة تقدر تبدّل عندها، بس بتفضل بشكل الـ class دي وبنفس كلامها.
  - id: role-interface
    term: Role interface
    definitionEn: Martin Fowler's term for an interface defined by how one consumer uses a collaborator, containing only the methods that interaction needs. One class often implements several role interfaces.
    definitionAr: المصطلح اللي Martin Fowler بيستخدمه لـ interface بتتعرّف حسب consumer معيّن بيستخدم الـ collaborator بتاعه إزاي، وفيها بس الـ methods اللي التعامل ده محتاجها. والـ class الواحدة كتير بتعمل implement لأكتر من role interface.
  - id: anemic-domain-model
    term: Anemic Domain Model
    definitionEn: Martin Fowler's name for domain objects that hold data through getters and setters but almost no behavior, while service classes carry all the business rules. It has the cost of a domain model without its benefits.
    definitionAr: الاسم اللي Martin Fowler بيطلقه على domain objects شايلة داتا بـ getters و setters ومافيهاش behavior تقريبًا، والـ service classes هي اللي شايلة كل الـ business rules. بتدفع فيها تمن الـ domain model من غير ما تاخد فوايده.
  - id: invariant
    term: Invariant
    definitionEn: A rule about an object's state that must hold whenever any code can observe it, such as "an order's total equals the sum of its lines" or "a shipped order can't get new lines".
    definitionAr: قاعدة عن حالة الـ object لازم تبقى صح في أي وقت أي كود يقدر يشوفه فيه، زي "الـ total بتاع الـ order يساوي مجموع الـ lines" أو "الـ order اللي اتشحن مايتضافلوش lines جديدة".
  - id: bounded-context
    term: Bounded Context
    definitionEn: In Domain-Driven Design, an explicit boundary, typically a subsystem or the work of one team, inside which one model and its language apply consistently. The same word, such as Customer, can mean different things in different bounded contexts.
    definitionAr: في الـ Domain-Driven Design، حدود واضحة، غالبًا subsystem أو شغل فريق واحد، جواها model واحد واللغة بتاعته بيتطبقوا بشكل متسق. ونفس الكلمة، زي Customer، ممكن تبقى ليها معنى مختلف في كل bounded context.
  - id: ubiquitous-language
    term: Ubiquitous Language
    definitionEn: Eric Evans's term for the shared, precise language that developers and domain experts build around the model inside a bounded context, and use the same way in conversation, documents and code.
    definitionAr: المصطلح اللي Eric Evans بيستخدمه للغة المشتركة الدقيقة اللي المطورين وخبراء الـ domain بيبنوها حوالين الـ model جوه bounded context، وبيستخدموها بنفس الطريقة في الكلام والـ documents والكود.
  - id: core-domain
    term: Core domain
    definitionEn: The part of the domain that gives the business its edge, such as delivery scheduling for a delivery company. DDD puts the deepest modeling and the strongest developers there, and treats generic parts, like user accounts, as candidates for off-the-shelf solutions.
    definitionAr: الجزء من الـ domain اللي بيدّي الـ business ميزته، زي جدولة التوصيل لشركة توصيل. والـ DDD بيحط فيه أعمق modeling وأقوى مطورين، وبيعامل الأجزاء العامة، زي حسابات المستخدمين، كأجزاء ممكن تستخدم لها حلول جاهزة.
  - id: aggregate
    term: Aggregate
    definitionEn: In Domain-Driven Design, a cluster of entities and value objects that is loaded, changed and saved as one unit through its root, so the rules that must hold together are checked in a single transaction. Other aggregates are referenced by identity.
    definitionAr: في الـ Domain-Driven Design، مجموعة entities و value objects بتتحمّل وتتغيّر وتتحفظ كوحدة واحدة من خلال الـ root بتاعها، عشان القواعد اللي لازم تتحقق مع بعض تتشيّك في transaction واحدة. والـ aggregates التانية بيتشاور عليها بالـ identity بس.
  - id: optimistic-concurrency
    term: Optimistic concurrency
    definitionEn: Letting two users edit the same data without locking it, and checking a version number when saving. The save based on an older version is rejected, so one of two overlapping changes fails instead of silently overwriting the other.
    definitionAr: إنك تسيب اتنين يعدّلوا نفس الداتا من غير lock، وتشيّك على رقم version وقت الحفظ. والحفظ اللي مبني على version أقدم بيترفض، فواحد من التغييرين المتداخلين بيفشل بدل ما يكتب فوق التاني من غير ما حد ياخد باله.
  - id: modular-monolith
    term: Modular monolith
    definitionEn: An application built and deployed as a single unit whose code is split into modules with firm boundaries. Each module owns its data and exposes a small public contract, so the others can't reach into its internals.
    definitionAr: تطبيق بيتبني ويتعمله deploy كوحدة واحدة، بس الكود بتاعه متقسم modules ليها حدود ثابتة. كل module مالك الداتا بتاعته وبيطلّع contract صغير للي برّه، فالباقيين مايقدروش يدخلوا جواه.
  - id: microservice-premium
    term: Microservice Premium
    definitionEn: Martin Fowler's name for the extra cost and risk that microservices add on their own, such as automated deployment, monitoring, handling failure and eventual consistency. It only pays off for systems too complex to manage as a monolith.
    definitionAr: الاسم اللي Martin Fowler بيطلقه على التكلفة والمخاطرة الزيادة اللي الـ microservices بتجيبها لوحدها، زي الـ deployment الأوتوماتيك والـ monitoring والتعامل مع الفشل والـ eventual consistency. ومش بتستاهل غير في سيستم معقد لدرجة إنك ماتقدرش تديره كـ monolith.
  - id: partial-failure
    term: Partial failure
    definitionEn: In a distributed system, a failure that hits some components or messages while the rest keep working. A caller that gets no answer can't tell whether its request was lost, done, or still running.
    definitionAr: في الـ distributed system، فشل بيضرب جزء من الـ components أو الرسايل والباقي شغال عادي. والـ caller اللي مجالوش رد مايقدرش يعرف إذا كان الـ request بتاعه ضاع، ولا اتنفّذ، ولا لسه شغال.
  - id: fallacies-of-distributed-computing
    term: Fallacies of distributed computing
    definitionEn: Eight false assumptions, credited to L. Peter Deutsch and colleagues at Sun Microsystems, that developers make when they first build a distributed application, starting with "the network is reliable" and "latency is zero".
    definitionAr: تمن افتراضات غلط، منسوبة لـ L. Peter Deutsch وزمايله في Sun Microsystems، المطورين بيعملوها أول ما يبنوا distributed application، وأولهم إن "الـ network موثوقة" وإن "الـ latency بصفر".
  - id: cache-aside
    term: Cache-aside
    definitionEn: A caching pattern where the application checks the cache first, loads the data from the database on a miss and puts it in the cache, and on a write updates the database and then removes the cached entry.
    definitionAr: pattern للـ caching التطبيق فيه بيدوّر في الـ cache الأول، ولو مالقاش بيجيب الداتا من الداتابيز ويحطها في الـ cache، ولما يكتب بيحدّث الداتابيز وبعدين يشيل الـ entry من الـ cache.
  - id: time-to-live
    term: Time to live (TTL)
    definitionEn: How long a cache entry may live before the cache removes it. It puts an upper bound on how long a stale copy can be served, at the cost of more misses when it's short.
    definitionAr: المدة اللي الـ entry يقدر يعيشها في الـ cache قبل ما يتشال. بيحط حد أقصى للمدة اللي نسخة قديمة ممكن تتعرض فيها، والتمن إن الـ misses بتزيد لما تبقى قصيرة.
  - id: integration-database
    term: Integration database
    definitionEn: Martin Fowler's term for a database that several applications or services read and write directly, so its schema becomes a contract between all of them and changing it means coordinating every one.
    definitionAr: المصطلح اللي Martin Fowler بيستخدمه لداتابيز كذا application أو service بيقروا ويكتبوا فيها مباشرة، فالـ schema بتاعتها بتبقى contract بينهم كلهم، وتغييرها محتاج تنسيق مع كل واحد فيهم.
  - id: distributed-monolith
    term: Distributed monolith
    definitionEn: A system split into separately deployed services that are still so tightly coupled, often through shared tables or chatty synchronous calls, that they must change and be released together. It has the costs of a distributed system without independent deployment.
    definitionAr: سيستم متقسم services كل واحدة بتتعمل deploy لوحدها، بس لسه مربوطين ببعض جامد، غالبًا بـ tables مشتركة أو calls synchronous كتير، لدرجة إنهم لازم يتغيّروا وينزلوا مع بعض. بتدفع فيه تمن الـ distributed system من غير ما تاخد الـ deployment المستقل.
  - id: cap-theorem
    term: CAP theorem
    definitionEn: Eric Brewer's conjecture, proved by Seth Gilbert and Nancy Lynch in 2002, that a replicated read/write store can't be both linearizable and available for every request while the network may lose messages between its nodes.
    definitionAr: الفرضية اللي Eric Brewer قالها، و Seth Gilbert و Nancy Lynch أثبتوها سنة 2002، إن الـ store المتكرر على كذا node مايقدرش يبقى linearizable ومتاح لكل request في نفس الوقت، طالما الـ network ممكن تضيّع رسايل بين الـ nodes.
  - id: linearizability
    term: Linearizability
    definitionEn: A strong consistency guarantee where the system behaves as if there were a single copy of the data. Once a write has completed, every read that starts after it sees that value or a newer one. It's the C in CAP, not the C in ACID.
    definitionAr: ضمان consistency قوي السيستم فيه بيتصرف كأن فيه نسخة واحدة بس من الداتا. أول ما كتابة تخلص، أي قراية تبدأ بعدها بتشوف القيمة دي أو أحدث منها. وده الـ C في CAP، مش الـ C في ACID.
  - id: network-partition
    term: Network partition
    definitionEn: A fault where nodes keep running but the network between some of them drops or delays messages, so the system splits into groups that can't communicate. In practice a long enough delay is indistinguishable from a partition.
    definitionAr: عطل الـ nodes فيه بتفضل شغالة بس الـ network اللي بينها بتضيّع الرسايل أو بتأخّرها، فالسيستم بيتقسم لمجموعات مش قادرة تكلم بعض. وعمليًا، التأخير الطويل كفاية مش بيتفرق عن الـ partition.
  - id: inconsistency-window
    term: Inconsistency window
    definitionEn: Werner Vogels's name for the period between an update and the moment every reader is guaranteed to see it. In an eventually consistent system, a read during the window can return an older value.
    definitionAr: الاسم اللي Werner Vogels بيطلقه على الفترة ما بين التحديث واللحظة اللي أي حد بيقرا مضمون يشوفه فيها. وفي السيستم الـ eventually consistent، القراية جوه الفترة دي ممكن ترجّع قيمة أقدم.
  - id: read-your-writes
    term: Read-your-writes consistency
    definitionEn: A guarantee that after a client changes a piece of data, its own later reads return that change or a newer one, even if other clients may still see the older value for a while.
    definitionAr: ضمان إن الـ client بعد ما يغيّر داتا، القراية بتاعته هو بعد كده بترجّع التغيير ده أو حاجة أحدث، حتى لو clients تانيين لسه ممكن يشوفوا القيمة القديمة شوية.
  - id: retry-budget
    term: Retry budget
    definitionEn: A limit on how many retries a client or process may send to a dependency across all requests, such as retries staying under 10% of requests. When it's spent, calls fail at once instead of retrying, so retries can't multiply the load on a struggling service.
    definitionAr: حد لعدد الـ retries اللي client أو process مسموح يبعتها لـ dependency على كل الـ requests مع بعض، زي إن الـ retries ماتعدّيش 10% من الـ requests. ولما يخلص، الـ calls بتفشل على طول بدل ما تعيد، فالـ retries مايقدروش يضاعفوا الحمل على service تعبانة.
  - id: jitter
    term: Jitter
    definitionEn: A random amount added to a delay, such as the wait before a retry, so that many clients that failed at the same moment don't all try again at the same moment.
    definitionAr: قيمة عشوائية بتتضاف على وقت استنا، زي الوقت قبل الـ retry، عشان clients كتير فشلوا في نفس اللحظة مايرجعوش يحاولوا كلهم في نفس اللحظة.
  - id: idempotency
    term: Idempotency
    definitionEn: The property of an operation that can be repeated with the same input and leaves the same result as doing it once, such as setting an order's status to Paid, unlike adding points to a balance.
    definitionAr: صفة الـ operation اللي لو اتكررت بنفس الـ input بتسيب نفس النتيجة كأنها اتعملت مرة واحدة، زي إنك تخلّي حالة الـ order "مدفوع"، على عكس إنك تضيف نقط على رصيد.
  - id: at-least-once-delivery
    term: At-least-once delivery
    definitionEn: A messaging guarantee that a message won't be lost but may be delivered more than once, for example when a consumer crashes after processing a message and before acknowledging it.
    definitionAr: ضمان في الـ messaging إن الرسالة مش هتضيع بس ممكن توصل أكتر من مرة، زي لما الـ consumer يقع بعد ما يعالج الرسالة وقبل ما يعمل لها acknowledge.
  - id: dual-write
    term: Dual write
    definitionEn: One operation that writes to two systems, such as a database and a message broker, with no transaction spanning both. A failure between the two writes leaves them disagreeing, for example an order saved with no event published.
    definitionAr: عملية واحدة بتكتب في سيستمين، زي داتابيز و message broker، من غير transaction واحدة بتغطي الاتنين. ولو حصل فشل بين الكتابتين، الاتنين بيبقوا مش متفقين، زي order اتحفظ ومفيش event اتنشر عنه.
  - id: saga
    term: Saga
    definitionEn: A business process that spans several services, run as a sequence of local transactions that each commit on their own. If a step fails, compensating transactions undo the effects of the steps that already committed. Unlike a database transaction, it offers no isolation.
    definitionAr: business process بتعدّي على كذا service، وبتتنفّذ كسلسلة local transactions كل واحدة بتعمل commit لوحدها. ولو خطوة فشلت، الـ compensating transactions بتلغي أثر الخطوات اللي اتعملها commit خلاص. وعلى عكس الـ transaction بتاعة الداتابيز، مفيهاش isolation.
  - id: compensating-transaction
    term: Compensating transaction
    definitionEn: A new business action that semantically undoes a step that has already committed, such as refunding a payment or releasing a reservation. It doesn't restore the previous state, because other work may have happened since.
    definitionAr: action جديد في الـ business بيلغي من ناحية المعنى خطوة اتعملها commit خلاص، زي إنك ترجّع فلوس أو تفك حجز. ومش بيرجّع الحالة اللي كانت قبل كده، لأن ممكن يكون حصل شغل تاني من ساعتها.
