terms:
  - id: subagent
    term: Subagent
    definitionEn: >-
      A separate Claude instance that Claude Code starts for a subtask. It works in its own context window, with its
      own instructions and tools, and only a summary of its work comes back to the main conversation.
    definitionAr: >-
      نسخة Claude منفصلة بيشغّلها Claude Code عشان مهمة فرعية. بتشتغل في context window خاصة بيها، بتعليمات وأدوات
      خاصة بيها، واللي بيرجع للمحادثة الأساسية ملخص شغلها بس.
  - id: claude-md
    term: CLAUDE.md
    definitionEn: >-
      A Markdown file of instructions that Claude Code loads into the context at the start of every session, from your
      project, your home directory or your organization. Claude treats it as context to weigh, not as enforced
      configuration.
    definitionAr: >-
      ملف Markdown فيه تعليمات بيحمّلها Claude Code في الـ context في أول كل session، من المشروع أو من الـ home directory
      بتاعك أو من الشركة. وClaude بيتعامل معاه كـ context بيوزنه، مش كإعدادات إجبارية.
  - id: claude-code-hook
    term: Hook (Claude Code)
    definitionEn: >-
      A shell command, HTTP request, MCP tool call or model prompt that Claude Code runs at a fixed point in a session,
      such as before a tool call or when Claude tries to stop. A command hook runs every time its event fires, whatever
      the model decides.
    definitionAr: >-
      shell command أو HTTP request أو MCP tool call أو prompt لموديل، بيشغّله Claude Code في نقطة ثابتة في الـ session،
      زي قبل tool call أو لما Claude يحاول يقف. والـ command hook بيشتغل كل مرة الـ event بتاعه يحصل، أيًا كان قرار
      الموديل.
  - id: checkpoint
    term: Checkpoint (Claude Code)
    definitionEn: >-
      A snapshot of the files Claude edited, which Claude Code captures before each prompt you send so you can rewind
      the code, the conversation or both. It covers edits made with Claude's file tools in the session, not every
      change on disk.
    definitionAr: >-
      snapshot للملفات اللي Claude عدّلها، بياخدها Claude Code قبل كل prompt بتبعته عشان تقدر ترجّع الكود أو المحادثة أو
      الاتنين. وبتغطي التعديلات اللي اتعملت بأدوات الملفات بتاعة Claude في الـ session، مش كل تغيير على الـ disk.
  - id: permission-rule
    term: Permission Rule (Claude Code)
    definitionEn: >-
      An allow, ask or deny entry in Claude Code's settings that matches tool calls, such as Bash(git push *) or
      Read(./.env). Claude Code applies it before the call runs, and deny rules hold in every permission mode.
    definitionAr: >-
      قاعدة من نوع allow أو ask أو deny في إعدادات Claude Code، بتطابق الـ tool calls، زي Bash(git push *) أو
      Read(./.env). وClaude Code بيطبقها قبل ما الـ call يشتغل، والـ deny rules بتفضل شغالة في كل permission mode.
  - id: agent-skill
    term: Skill (Claude Code)
    definitionEn: >-
      A folder with a SKILL.md file of instructions, and optionally scripts and reference files, that Claude Code adds to
      Claude's toolkit. Claude sees its name and description up front and loads the full content only when you run it
      with /name or Claude judges it relevant.
    definitionAr: >-
      فولدر فيه ملف SKILL.md بتعليمات، ولو حبيت scripts وملفات مرجعية، Claude Code بيضيفه لأدوات Claude. Claude بيشوف اسمه
      ووصفه من الأول، ومش بيحمّل المحتوى كله غير لما تشغّله بـ /name أو Claude يحكم إنه ليه علاقة بالمهمة.
  - id: model-context-protocol
    term: MCP (Model Context Protocol)
    definitionEn: >-
      An open standard for connecting AI applications to external tools and data. An MCP server exposes tools, such as
      querying an issue tracker, that a client like Claude Code can call, with the connection and authentication handled
      by the server.
    definitionAr: >-
      standard مفتوح لتوصيل تطبيقات الـ AI بأدوات وداتا من برّه. الـ MCP server بيعرض tools، زي إنك تعمل query على issue
      tracker، وclient زي Claude Code يقدر يناديها، والـ server هو اللي شايل الاتصال والـ authentication.
  - id: claude-code-plugin
    term: Plugin (Claude Code)
    definitionEn: >-
      A directory of skills, subagents, hooks, MCP servers or other components that Claude Code installs and loads as one
      unit, usually from a marketplace. An enabled plugin is part of every session, and what it runs, it runs as you.
    definitionAr: >-
      فولدر فيه skills أو subagents أو hooks أو MCP servers أو حاجات تانية، Claude Code بيسطّبه ويحمّله كوحدة واحدة، غالبًا من
      marketplace. والـ plugin المفعّل بيبقى جزء من كل session، وأي حاجة بيشغّلها بيشغّلها بصلاحياتك إنت.
  - id: progressive-disclosure
    term: Progressive Disclosure (Agent Skills)
    definitionEn: >-
      Loading a skill in stages instead of all at once: its name and description up front, the SKILL.md body when the
      skill is used, and bundled files only when the task reads them. Scripts run without their code entering context.
    definitionAr: >-
      إن الـ skill تتحمّل على مراحل بدل مرة واحدة: الاسم والوصف من الأول، والـ SKILL.md لما الـ skill تتستخدم، والملفات اللي
      معاها بس لما المهمة تقراها. والـ scripts بتشتغل من غير ما الكود بتاعها يدخل الـ context.
  - id: forked-subagent
    term: Fork (Claude Code)
    definitionEn: >-
      A subagent that inherits the whole conversation so far, with the same system prompt, tools and model as the main
      session, instead of starting fresh. Its tool calls stay out of your conversation and only its result comes back.
    definitionAr: >-
      نوع من الـ subagent بيورث المحادثة كلها لحد اللحظة دي، بنفس الـ system prompt والأدوات والموديل بتوع الـ session الأساسية، بدل ما
      يبدأ من الصفر. والـ tool calls بتاعته بتفضل برّه محادثتك، واللي بيرجع النتيجة بس.
  - id: effort-level
    term: Effort Level (Claude)
    definitionEn: >-
      A setting from low to max that controls how much work Claude puts into each response: how much it thinks, how
      thoroughly it checks and how many tool calls it makes. Higher levels spend more tokens and time; in Claude Code
      you set it with /effort.
    definitionAr: >-
      إعداد من low لحد max بيتحكم Claude هيبذل قد إيه في كل رد: هيفكر قد إيه، وهيراجع بدقة قد إيه، وهيعمل tool calls قد
      إيه. المستويات الأعلى بتصرف tokens ووقت أكتر؛ وفي Claude Code بتظبطه بـ /effort.
  - id: plugin-marketplace
    term: Marketplace (Claude Code plugins)
    definitionEn: >-
      A catalog of plugins, defined in a repository's .claude-plugin/marketplace.json, that tells Claude Code where to
      fetch each plugin it lists. Its name tells you who publishes the catalog, not who wrote each plugin in it.
    definitionAr: >-
      كتالوج plugins متعرّف في ملف .claude-plugin/marketplace.json جوه repo، بيقول لـ Claude Code يجيب كل plugin فيه منين.
      واسمه بيقولك مين بينشر الكتالوج، مش مين كتب كل plugin جواه.
  - id: git-worktree
    term: Git worktree
    definitionEn: >-
      An extra working directory linked to the same git repository, with its own files, checked-out branch, HEAD and
      index, while history and remotes stay shared. It lets several branches be checked out, and edited, at once.
    definitionAr: >-
      working directory زيادة مربوط بنفس الـ git repository، ليه ملفاته والـ branch بتاعه والـ HEAD والـ index بتوعه، والـ
      history والـ remotes متشاركين. بيخلّيك تفتح كذا branch وتعدّل فيهم في نفس الوقت.
  - id: json-rpc
    term: JSON-RPC 2.0
    definitionEn: >-
      A small remote procedure call format in which each message is a JSON object that names a method and its params.
      A request carries an id that its response repeats; a notification has no id and gets no response. MCP is built on
      it.
    definitionAr: >-
      صيغة صغيرة لـ remote procedure calls، كل رسالة فيها JSON object بيسمّي method والـ params بتاعتها. الـ request فيه
      id والـ response بيرجّعه زي ما هو؛ والـ notification ملهاش id ومفيش response عليها. والـ MCP مبني عليها.
  - id: stop-reason
    term: Stop reason (Claude API)
    definitionEn: >-
      The stop_reason field in every successful Claude API response, saying why Claude stopped generating: end_turn,
      max_tokens, stop_sequence, tool_use, pause_turn, refusal or model_context_window_exceeded. Only end_turn means
      Claude finished its answer on its own.
    definitionAr: >-
      الـ field اللي اسمه stop_reason في كل response ناجح من Claude API، وبيقول Claude وقف ليه: end_turn أو max_tokens أو
      stop_sequence أو tool_use أو pause_turn أو refusal أو model_context_window_exceeded. والـ end_turn بس معناها إن Claude
      خلّص إجابته لوحده.
  - id: exponential-backoff
    term: Exponential backoff
    definitionEn: >-
      A retry strategy that waits longer after each failed attempt, typically doubling the delay, so clients that
      failed together don't all retry at the same moment. The official Claude SDKs use it for their automatic retries.
    definitionAr: >-
      طريقة retry بتستنى وقت أطول بعد كل محاولة فاشلة، غالبًا ضعف اللي قبله، عشان الـ clients اللي فشلوا مع بعض ميرجعوش
      كلهم في نفس اللحظة. والـ SDKs الرسمية بتاعة Claude بتستخدمها في الـ retries الأوتوماتيك بتاعتها.
  - id: rate-limit
    term: Rate limit (Claude API)
    definitionEn: >-
      A cap on how much an organization can use the Claude API over time, measured per model class in requests, input
      tokens and output tokens per minute. Going over it returns a 429 rate_limit_error, usually with a retry-after
      header that says how many seconds to wait.
    definitionAr: >-
      حد أقصى للاستخدام اللي الـ organization تقدر تعمله على Claude API في فترة زمنية، بيتقاس لكل نوع موديل بالـ requests
      والـ input tokens والـ output tokens في الدقيقة. ولو عديته بيرجع 429 rate_limit_error، وغالبًا معاه header اسمه
      retry-after بيقولك تستنى كام ثانية.
  - id: cache-breakpoint
    term: Cache breakpoint (Claude API)
    definitionEn: >-
      The content block marked with cache_control in a Claude API request. The prompt up to and including it, in the
      order tools, system, messages, is what gets written to the prompt cache, and only a later request with exactly
      the same prefix can read it.
    definitionAr: >-
      الـ content block اللي عليه cache_control في request لـ Claude API. الـ prompt لحد البلوك ده وهو معاه، بالترتيب
      tools ثم system ثم messages، هو اللي بيتكتب في الـ prompt cache، ومفيش request بعد كده يقدر يقراه غير لو أوله
      نفس الـ prefix بالظبط.
  - id: kv-cache
    term: KV cache
    definitionEn: >-
      The attention keys and values a transformer computes for each token it has already read, kept so the model
      doesn't recompute them for every new token. Prompt caching keeps these for a prompt's prefix between requests.
    definitionAr: >-
      الـ keys والـ values بتوع الـ attention اللي الـ transformer بيحسبها لكل token قراه، وبيحتفظ بيها عشان الموديل
      ميحسبهاش تاني مع كل token جديد. والـ prompt caching بيحتفظ بيها لأول الـ prompt من request للتاني.
  - id: mcp-resource
    term: Resource (MCP)
    definitionEn: >-
      Data an MCP server exposes under a URI, such as a file, a database schema or a record. Resources are
      application-controlled: the host application decides which ones to read and how to put them in front of the model.
    definitionAr: >-
      داتا الـ MCP server بيعرضها تحت URI، زي ملف أو schema بتاعة داتابيز أو record. والـ resources الـ application هو اللي
      بيتحكم فيها: التطبيق الـ host هو اللي بيقرر يقرا أنهي واحدة ويحطها قدام الموديل إزاي.
  - id: mcp-prompt
    term: Prompt (MCP)
    definitionEn: >-
      A named template with arguments that an MCP server exposes and a client renders into conversation messages.
      Prompts are user-controlled: a person chooses when to run one, for example as a slash command, while the server
      writes its content.
    definitionAr: >-
      template ليه اسم وarguments، الـ MCP server بيعرضه والـ client بيحوّله لرسايل في المحادثة. والـ prompts اليوزر هو اللي
      بيتحكم فيها: الشخص بيختار امتى يشغّل واحد، زي slash command مثلًا، والـ server هو اللي كاتب محتواه.
  - id: parallel-tool-use
    term: Parallel tool use (Claude API)
    definitionEn: >-
      Claude calling several tools in one response, as multiple tool_use blocks in a single assistant turn. Your code
      decides how to run them and returns every tool_result together in the next user message.
    definitionAr: >-
      إن Claude ينادي كذا tool في response واحد، على شكل كذا tool_use block في نفس الـ assistant turn. والكود بتاعك هو اللي
      بيقرر يشغّلهم إزاي، وبيرجّع كل الـ tool_result مع بعض في الـ user message اللي بعدها.
