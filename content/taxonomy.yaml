# Learning paths (F09): curated, ordered series. Each planned article names its path and order.
learningPaths:
  - slug: understanding-llms
    field: deep-learning-llms
    titleAr: فهم الـ LLMs
    titleEn: Understanding LLMs
    descriptionAr: هتفهم الـ LLM بيعمل إيه فعلًا، من الـ tokens والـ sampling لحدود الـ context والـ hallucinations، عشان تتوقع غلطاته بدل ما تتفاجئ بيها.
    descriptionEn: Understand what an LLM really does, from tokens and sampling to context limits and hallucinations, so you can predict its failures instead of being surprised by them.
  - slug: building-with-llms
    field: ai-fundamentals
    titleAr: بناء تطبيقات بالـ LLMs
    titleEn: Building with LLMs
    descriptionAr: "هتعرف تبني features بالـ LLMs تستحمل الـ production: prompts واضحة، structured output تقدر تثق فيه، retrieval كويس، تصميم Agent مناسب، وتقييم حقيقي."
    descriptionEn: "Build LLM features that hold up in production: clear prompts, trustworthy structured output, solid retrieval, the right agent design and real evals."
  - slug: ml-foundations
    field: machine-learning
    titleAr: أساسيات الـ Machine Learning
    titleEn: Machine Learning Foundations
    descriptionAr: هتفهم موديلات الـ Machine Learning بتتعلّم إزاي وبتفشل إزاي، من الـ Overfitting والـ Bias-Variance لتجهيز الـ features، عشان تختار وتجهّز الموديل وإنت واثق.
    descriptionEn: Understand how machine learning models learn and fail, from overfitting and bias-variance to preparing features, so you can choose and prepare models with confidence.
  - slug: evaluating-models
    field: machine-learning
    titleAr: تقييم الموديلات صح
    titleEn: Evaluating Models the Right Way
    descriptionAr: "هتقيس أداء الموديل بأمانة: تقسيم صح للبيانات، pipelines من غير Data Leakage، الـ metric والـ threshold المناسبين، ومقارنات مش مجرد صدفة."
    descriptionEn: "Measure models honestly: proper splits, leakage-free pipelines, the right metric and threshold, and comparisons that aren't just noise."
  - slug: claude-code-essentials
    field: claude-ai-tools
    titleAr: استخدم Claude Code صح
    titleEn: Claude Code Essentials
    descriptionAr: "هتستخدم Claude Code صح: تدّيله حاجة يتحقق بيها، تكتب CLAUDE.md مختصر، تدير الـ context، تختار بين الـ Skills والـ Hooks والـ Subagents والـ MCP، وتراجع اللي بيبنيه."
    descriptionEn: "Use Claude Code the way it is designed: give it checks, keep CLAUDE.md lean, manage context, pick between skills, hooks, subagents and MCP, and review what it builds."
  - slug: building-on-claude
    field: claude-ai-tools
    titleAr: البناء على Claude
    titleEn: Building on Claude
    descriptionAr: "هتبني تطبيقات معتمدة على Claude API والـ MCP: تتعامل مع الـ stop reasons والـ errors، تصمم tools كويسة، تستخدم الـ caching والـ batches والـ citations، وتختار طبقة الـ Agent المناسبة."
    descriptionEn: "Build reliable apps on the Claude API and MCP: handle stop reasons and errors, design good tools, use caching, batches and citations, and pick the right agent layer."
  - slug: csharp-under-the-hood
    field: dotnet
    titleAr: الـ C# من جوه
    titleEn: C# Under the Hood
    descriptionAr: هتفهم الـ C# والـ .NET runtime بيعملوا إيه فعلًا في الـ values والـ async code والـ memory والـ threads، وتبطّل تعتمد على الكلام المتوارث.
    descriptionEn: You understand what C# and the .NET runtime really do with your values, async code, memory and threads, and stop relying on the folklore around them.
  - slug: aspnet-core-basics
    field: dotnet
    titleAr: أساسيات ASP.NET Core
    titleEn: ASP.NET Core Fundamentals
    descriptionAr: هتفهم الـ ASP.NET Core app بيتعامل مع الـ request إزاي فعلًا، من الـ middleware pipeline والـ configuration لحد الـ HttpClient والـ caching والـ background work، وتتفادى الغلطات اللي بتظهر في الـ production بس.
    descriptionEn: You understand how an ASP.NET Core app really handles a request, from the middleware pipeline and configuration to HttpClient, caching and background work, and avoid the mistakes that only show up in production.
  - slug: dotnet-data-and-architecture
    field: dotnet
    titleAr: الـ EF Core والـ Architecture في .NET
    titleEn: EF Core & Architecture in .NET
    descriptionAr: هتفهم EF Core بيكلّم الـ database إزاي فعلًا، والـ Clean Architecture والـ CQRS ومكتبات الـ mapping عايزين منك إيه بالظبط، عشان تصمم الـ .NET backend بتاعك عن فهم مش تقليد.
    descriptionEn: You understand how EF Core really talks to the database and what Clean Architecture, CQRS and mapping libraries actually ask of you, so you can design .NET backends on purpose rather than by cargo cult.
  - slug: react-mental-models
    field: frontend
    titleAr: فكّر في React صح
    titleEn: React Mental Models
    descriptionAr: "هتفهم React بالطريقة اللي هي شغالة بيها فعلًا: الـ rendering والـ state والـ keys والـ purity والـ Effects والـ memoization، عشان الـ components تتصرف زي ما إنت متوقع."
    descriptionEn: Build the mental model React actually runs on (rendering, state snapshots, identity, purity, Effects and memoization) so your components behave the way you expect.
  - slug: react-in-production
    field: frontend
    titleAr: الـ React في المشاريع الحقيقية
    titleEn: React in Production
    descriptionAr: "هتستخدم React 19 صح في مشاريع حقيقية: الـ inputs والفورمز، جلب الداتا، مكان الـ state، الأخطاء، الـ transitions والـ Server Components من غير المطبات المشهورة."
    descriptionEn: "Use React 19 correctly in real apps: inputs and forms, data fetching, where state lives, error handling, transitions and Server Components without the common traps."
  - slug: modern-angular
    field: frontend
    titleAr: الـ Angular الحديث
    titleEn: Modern Angular
    descriptionAr: "هتفهم Angular 22 الحديث: الـ standalone components والـ signals والـ OnPush الافتراضي والـ zoneless change detection والـ DI، وليه بيتصرف بالشكل ده."
    descriptionEn: Understand modern Angular 22 (standalone components, signals, OnPush by default, zoneless change detection and hierarchical DI) and why it behaves the way it does.
  - slug: angular-in-production
    field: frontend
    titleAr: الـ Angular في المشاريع الحقيقية
    titleEn: Angular in Production
    descriptionAr: "هتطلّع تطبيقات Angular مفيهاش memory leaks ولا requests مكررة ولا بتقع على الـ server: الـ HTTP والـ RxJS والفورمز والـ routing والـ state والـ SSR والـ hydration صح."
    descriptionEn: "Ship Angular apps that don't leak, double-fetch or break on the server: HTTP, RxJS, forms, routing, shared state, SSR and hydration done right."
  - slug: javascript-under-the-hood
    field: frontend
    titleAr: الـ JavaScript من جوه
    titleEn: JavaScript Under the Hood
    descriptionAr: "هتشوف JavaScript شغالة إزاي من جوه: المساواة والـ this والـ closures والأرقام والـ event loop والـ prototypes والـ memory والـ modules، عشان تصرفاتها الغريبة متفاجئكش تاني."
    descriptionEn: See how JavaScript really works (equality, this, closures, numbers, the event loop, prototypes, memory and modules) so its 'weird' behavior stops surprising you.
  - slug: browser-and-css
    field: frontend
    titleAr: المتصفح والـ CSS
    titleEn: The Browser & CSS
    descriptionAr: هتفهم المتصفح بيطبّق الـ CSS ويحوّلها لـ pixels إزاي، وإيه اللي بيأثر فعلًا على الـ accessibility والـ Core Web Vitals عند المستخدمين الحقيقيين.
    descriptionEn: Understand how the browser resolves CSS and turns it into pixels, and what really drives accessibility and Core Web Vitals for real users.
  - slug: flutter-under-the-hood
    field: mobile
    titleAr: الـ Flutter من جوه
    titleEn: Flutter Under the Hood
    descriptionAr: "هتفهم إزاي Flutter بيحوّل الكود بتاعك لـ pixels فعلًا: الـ 3 trees والـ constraints والـ keys والـ BuildContext والـ State lifecycle والـ event loop في Dart والـ jank بييجي منين."
    descriptionEn: "How Flutter really turns your code into pixels: the three trees, constraints, keys, BuildContext, the State lifecycle, Dart's event loop and where jank comes from."
  - slug: mobile-app-engineering
    field: mobile
    titleAr: هندسة تطبيقات الموبايل
    titleEn: Mobile App Engineering
    descriptionAr: "القرارات الهندسية ورا أي تطبيق موبايل حقيقي: الـ state والـ lifecycle والـ RTL والـ secrets والـ push notifications والـ architecture والـ offline-first والتكامل مع الـ native والنشر."
    descriptionEn: "The engineering decisions behind real mobile apps: state, lifecycle, RTL, secrets, push, architecture, offline-first, native integration and publishing."
  - slug: sql-performance
    field: databases
    titleAr: أداء الـ SQL
    titleEn: SQL Performance
    descriptionAr: هتفهم الـ indexes والـ execution plans والـ query optimizer بيشتغلوا إزاي فعلًا، عشان تلاقي الـ queries البطيئة وتصلحها بدليل مش بتخمين.
    descriptionEn: You understand how indexes, execution plans and the query optimizer really work, so you can find and fix slow queries with evidence instead of guesses.
  - slug: data-consistency
    field: databases
    titleAr: الـ Transactions والـ Consistency
    titleEn: Transactions & Consistency
    descriptionAr: هتفهم الـ transactions والـ isolation levels والـ locks والـ constraints بيضمنوا إيه فعلًا، وأنهي مشاكل consistency سايبينها للكود بتاعك.
    descriptionEn: You understand what transactions, isolation levels, locks and constraints really guarantee, and which consistency bugs they leave for your code to handle.
  - slug: design-principles
    field: software-architecture
    titleAr: مبادئ التصميم من غير خرافات
    titleEn: Design Principles Without Myths
    descriptionAr: هتفهم الـ SOLID والـ DRY والـ YAGNI والـ DDD بيقولوا إيه فعلًا بعيد عن الشعارات، وتستخدمهم عشان الكود يبقى أسهل في التغيير مش أعقد.
    descriptionEn: You understand what SOLID, DRY, YAGNI and DDD actually say, as opposed to the slogans, and use them to make code easier to change instead of more complicated.
  - slug: distributed-systems-realistically
    field: software-architecture
    titleAr: الـ Distributed Systems بواقعية
    titleEn: Distributed Systems, Realistically
    descriptionAr: هتفهم إيه اللي بيتغير فعلًا لما السيستم يتقسم على network، من monolith-first والـ CAP لحد الـ retries والـ idempotency والـ outbox والـ sagas، وإمتى التعقيد ده يستاهل.
    descriptionEn: You understand what really changes when a system is split across a network, from monolith-first and CAP to retries, idempotency, outboxes and sagas, and when the extra complexity is worth it.
  - slug: devops-essentials
    field: devops-cloud
    titleAr: أساسيات الـ DevOps
    titleEn: DevOps Essentials
    descriptionAr: الـ mental models اللي ورا Git و Docker والـ CI/CD و Kubernetes والـ cloud reliability والـ observability، علشان أدواتك تبطّل تفاجئك.
    descriptionEn: The mental models behind Git, Docker, CI/CD, Kubernetes, cloud reliability and observability, so your tools stop surprising you.
  - slug: secure-by-default
    field: security
    titleAr: الأمان من الأساس
    titleEn: Secure by Default
    descriptionAr: "الأفكار الغلط عن الأمان اللي ورا اختراقات حقيقية: من الـ hashing والـ encryption والـ JWT لحد الـ XSS والـ CSRF والـ CORS والـ access control والـ secrets والـ SSRF."
    descriptionEn: The security misconceptions behind real breaches, from hashing vs encryption and JWTs to XSS, CSRF, CORS, access control, secrets and SSRF.

# The editorial plan: 300 seed articles by the official ReadIn account (SPEC §19.4). Each corrects a common
# misconception. content/articles/{field}/{topic}/{slug}/ holds the written ones (ContentStudio plan-status).
plannedArticles:
  # ── understanding-llms (15) ──
  - slug: ai-ml-deep-learning-are-not-synonyms
    field: ai-fundamentals
    topic: ai-concepts
    titleEn: "AI, Machine Learning, Deep Learning and LLMs: How They Actually Nest"
    titleAr: إيه الفرق بين الـ AI والـ Machine Learning والـ Deep Learning والـ LLMs؟
    misconception: AI, machine learning, deep learning and LLMs are interchangeable names for the same technology.
    level: beginner
    learningPath: understanding-llms
    order: 1
    versionBadge: null
    plannedSources:
      - https://developers.google.com/machine-learning/intro-to-ml/what-is-ml
      - https://developers.google.com/machine-learning/crash-course/neural-networks
      - https://developers.google.com/machine-learning/crash-course/llm
  - slug: llms-predict-tokens-not-look-up-answers
    field: deep-learning-llms
    topic: transformers
    titleEn: "An LLM Doesn't Look Up Answers: It Predicts the Next Token"
    titleAr: "الموديل مش بيدوّر على إجابة جاهزة: الـ LLM بيتوقع الـ token اللي بعده"
    misconception: An LLM answers by searching a stored database of facts and returning the matching entry.
    level: beginner
    learningPath: understanding-llms
    order: 2
    versionBadge: null
    plannedSources:
      - https://developers.google.com/machine-learning/crash-course/llm
      - https://arxiv.org/abs/2005.14165
      - https://www.anthropic.com/research/tracing-thoughts-language-model
  - slug: tokens-are-not-words
    field: deep-learning-llms
    topic: transformers
    titleEn: "Tokens Aren't Words: Why Arabic Costs More and Models Miscount Letters"
    titleAr: ليه الـ token مش كلمة؟ وده بيأثر إزاي على تكلفة العربي وعدّ الحروف
    misconception: A token is basically a word, so 1,000 words cost about 1,000 tokens in any language.
    level: beginner
    learningPath: understanding-llms
    order: 3
    versionBadge: null
    plannedSources:
      - https://arxiv.org/abs/1508.07909
      - https://arxiv.org/abs/2305.15425
      - https://platform.claude.com/docs/en/build-with-claude/token-counting
  - slug: context-window-is-not-memory
    field: ai-fundamentals
    topic: ai-concepts
    titleEn: "The Context Window Is Not Memory: LLMs Are Stateless Between Calls"
    titleAr: ليه الـ Context Window مش ذاكرة؟ الموديل مش فاكر حاجة بين الـ requests
    misconception: The model remembers earlier chats and learns from them, because the conversation is stored inside it.
    level: beginner
    learningPath: understanding-llms
    order: 4
    versionBadge: null
