name: readin
description: "ReadIn — مقال كل يوم يفرق معاك. Read daily. Grow daily."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, DI, navigation
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.2

  # Networking & models
  dio: ^5.11.1
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  flutter_secure_storage: ^11.2.0

  # i18n
  intl: ^0.20.2
  flutter_timezone: ^5.1.1

  # Firebase: Cloud Messaging + Realtime Database only (SPEC §21). firebase_auth reads the
  # database with a custom token from POST /realtime/token.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_database: ^13.0.1
  flutter_local_notifications: ^22.3.3

  # Google / Apple sign-in: the provider's ID token goes to POST /auth/external,
  # which returns a ReadIn session (no Firebase Auth). crypto hashes Apple's nonce.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8

  # UI
  re_highlight: ^0.0.3
  # The article editor (SPEC F05, §3.3): AppFlowy Editor main @ 01eccc6ee3, vendored with a small file_picker 13 /
  # device_info_plus 13 patch until a compatible release is published (packages/appflowy_editor/README.vendored.md).
  appflowy_editor:
    path: packages/appflowy_editor
  cached_network_image: ^4.0.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

  # Media (SPEC §3.3, F26): compress before upload, BlurHash placeholders,
  # a size-limited disk cache, pickers and the share sheet.
  flutter_image_compress: ^2.5.1
  flutter_blurhash: ^0.9.1
  flutter_cache_manager: ^3.4.8
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6

  # Phone + password sign in (SPEC §9.4): libphonenumber rules in pure Dart, bundled flag images (no network) and
  # the device model for X-Device-Name. Exact versions, each published at least two weeks before they were added.
  phone_numbers_parser: 9.0.28
  country_flags: 4.1.2
  device_info_plus: 13.3.0

  # The comment box's emoji picker (SPEC F11): emoji are ordinary text. Exact version, published 2026-09-01.
  emoji_picker_flutter: 4.5.4

  # The installed version and package name for the forced update check (`GET /app/update-policy`). Exact version,
  # published 2026-10-01.
  package_info_plus: 10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation. freezed is pinned to 3.2.5 and injectable_generator to < 3.1.3:
  # newer releases need Dart >= 3.13 or a dart_style that conflicts with Flutter's pinned `meta`.
  build_runner: ^2.15.1
  injectable_generator: ">=2.10.0 <3.1.3"
  retrofit_generator: ^10.3.3
  freezed: 3.2.5
  json_serializable: ^6.15.2

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  # Timers and clocks in the reading tracker tests (already resolved through flutter_test).
  fake_async: ^1.3.3
  # In-memory preferences for the emoji picker's recent emoji in widget tests (already resolved through
  # emoji_picker_flutter).
  shared_preferences: 2.5.6

# appflowy_editor's transitive packages, pinned to releases at least two weeks old when they were added (the
# resolver otherwise picks ones from the last days). Drop each pin once a newer release has aged.
dependency_overrides:
  archive: 4.5.2
  flutter_svg: 2.3.0
  posix: 6.5.2
  qr: 3.0.2
  vector_graphics: 1.2.4
  vector_graphics_compiler: 1.3.2
  # emoji_picker_flutter's (through shared_preferences, its recent emoji): 2.5.x had four releases in ten days.
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled (not fetched at runtime) so golden tests render deterministically (SPEC §15.3).
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
