# Vendored AppFlowy Editor (see README.vendored.md). Upstream main @ 01eccc6ee3 with the file_picker 13 /
# device_info_plus 13 patch; dev_dependencies, the example, tests and docs are left out.
name: appflowy_editor
version: 6.1.0
publish_to: none

homepage: https://github.com/AppFlowy-IO/appflowy-editor

description: A highly customizable rich-text editor for Flutter. The AppFlowy Editor project for AppFlowy and beyond.

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  collection: ^1.18.0
  # Patched (upstream: device_info_plus ^12.3.0, file_picker ^10.3.10) to match the app's versions.
  device_info_plus: ^13.3.0
  diff_match_patch: ^0.4.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.6
  html: ^0.15.5
  http: ^1.2.0
  intl: ^0.20.2
  keyboard_height_plugin: ^0.1.5
  logging: ^1.2.0
  markdown: ^7.2.1
  nanoid: ^1.0.0
  numerus: ^2.1.2
  pdf: ^3.10.7
  provider: ^6.0.5
  scroll_to_index: ^3.0.1
  string_validator: ^1.0.0
  universal_html: ^2.2.4
  universal_platform: ^1.1.0
  url_launcher: ^6.1.11

flutter:
  assets:
    - assets/images/toolbar/
    - assets/images/selection_menu/
    - assets/images/image_toolbar/
    - assets/images/
    - assets/mobile/toolbar_icons/
