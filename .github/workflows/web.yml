name: web

# Runs on main and on the dev → main pull request, not on dev pushes (user decision, 2026-11-06: GitHub minutes stay for iOS builds).
on:
  push:
    branches: [main]
    paths: ["web/**", "design/tokens.json", "tools/tokens/**", "shared/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "design/tokens.json", "tools/tokens/**", "shared/**", ".github/workflows/web.yml"]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Playwright suite (ar/light and en/dark)
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Design tokens are up to date
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (SSR)
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  # Visual baselines are not committed yet; run on demand until they are, then make this part of every PR.
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
