name: backend

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", "shared/rdoc/**", "content/**", "docker/sqlserver/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "shared/rdoc/**", "content/**", "docker/sqlserver/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore ReadIn.slnx

      - name: Build
        run: dotnet build ReadIn.slnx --no-restore -c Release

      # SQL Server with Full-Text Search for the integration tests (search, F16, ADR 0017), built from docker/sqlserver.
      # Its apt layer (mssql-server-fts, ~2.7 GB, minutes to install) lives in the GitHub Actions cache, so it is built
      # again only when the Dockerfile or the SQL Server base image changes. Loaded under the tag the tests look for
      # (readin-sqlserver-fts:local): Testcontainers then uses it as it is, and the suite runs on the real full-text engine.
      - uses: docker/setup-buildx-action@v3

      - name: SQL Server test image
        uses: docker/build-push-action@v6
        with:
          context: docker/sqlserver
          tags: readin-sqlserver-fts:local
          load: true
          cache-from: type=gha,scope=sqlserver-fts
          cache-to: type=gha,scope=sqlserver-fts,mode=max,ignore-error=true

      # The image is in Docker now: the builder's copy of its layers would only take disk space.
      - name: Free the builder's disk space
        run: docker buildx prune --all --force

      # Unit + architecture + integration tests (Testcontainers runs the image above on the runner's Docker).
      - name: Test
        run: dotnet test --solution ReadIn.slnx --no-build -c Release

      - name: Vulnerable packages
        run: |
          dotnet list ReadIn.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  publish-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SDK container publishing: no Dockerfile needed.
      - name: Publish API image
        run: >
          dotnet publish src/ReadIn.Api -c Release /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/readin-api
          -p:ContainerImageTags='"${{ github.sha }};latest"'
