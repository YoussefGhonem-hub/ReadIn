name: backend

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", "shared/rdoc/**", "content/**", "docker/sqlserver/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "shared/rdoc/**", "content/**", "docker/sqlserver/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore ReadIn.slnx

      - name: Build
        run: dotnet build ReadIn.slnx --no-restore -c Release

      # SQL Server with Full-Text Search for the integration tests (search, F16, ADR 0017), built from docker/sqlserver
      # under the tag the tests look for (readin-sqlserver-fts:local): Testcontainers then uses it as it is, and the
      # suite runs on the real full-text engine. The image is about 5 GB, more than the runner has free next to the
      # .NET build, so the preinstalled Android SDK, GHC and CodeQL go first. Plain `docker build` writes straight
      # into Docker (a Buildx container builder would need a second copy to load it). The apt layer takes about 80 s.
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: SQL Server test image
        working-directory: .
        run: docker build --tag readin-sqlserver-fts:local docker/sqlserver

      # Unit + architecture + integration tests (Testcontainers runs the image above on the runner's Docker).
      - name: Test
        run: dotnet test --solution ReadIn.slnx --no-build -c Release

      - name: Vulnerable packages
        run: |
          dotnet list ReadIn.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  publish-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SDK container publishing: no Dockerfile needed.
      - name: Publish API image
        run: >
          dotnet publish src/ReadIn.Api -c Release /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/readin-api
          -p:ContainerImageTags='"${{ github.sha }};latest"'
