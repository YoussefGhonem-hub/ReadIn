name: ios-testflight

# On demand only. A build starts on:
#   - a push to `uat` that changes something under mobile/ (with the API and web deploy in uat.yml; user decision,
#     2026-11-07: no TestFlight build, and no build number spent, when the app didn't change);
#   - a tag that starts with `ios-` (works from dev): git tag ios-<n> && git push origin ios-<n>. GitHub doesn't apply
#     `paths` to tag pushes, so a tag always builds.
# "Run workflow" in the Actions tab also works once this file exists on the default branch (main).
# Setup (App Store Connect app record, API key, repository secrets): docs/setup/ios.md
on:
  push:
    branches: [uat]
    tags: ["ios-*"]
    paths: ["mobile/**"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "::error::Missing APP_STORE_CONNECT_* secrets. See docs/setup/ios.md"
            exit 1
          fi
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - run: flutter pub get

      # google_sign_in_ios 6.3.x only allows GoogleSignIn 9, which needs gtm-session-fetcher 3.x, while firebase-ios-sdk 13
      # needs 4 or newer, so Swift Package Manager can't resolve them. 6.4.0 has the same native code with these same range
      # changes, but needs Flutter 3.47. Remove this step when the project moves to Flutter 3.47 and google_sign_in_ios 6.4.
      - name: Allow GoogleSignIn 10 in google_sign_in_ios
        run: |
          pkg="$(ls "${PUB_CACHE:-$HOME/.pub-cache}"/hosted/pub.dev/google_sign_in_ios-6.3.*/darwin/google_sign_in_ios/Package.swift)"
          sed -i '' -e 's/from: "9.0.0"/"9.0.0"..<"11.0.0"/' -e 's/\.iOS("13.0")/.iOS("15.0")/' -e 's/\.macOS("10.15")/.macOS("12.0")/' "$pkg"
          grep -q '"9.0.0"..<"11.0.0"' "$pkg"
          grep -q '\.iOS("15.0")' "$pkg"

      # Builds the Flutter side with the prod config and build number; signing happens in the archive step.
      - name: Flutter build (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/prod.json
          --build-number=${{ github.run_number }}

      - name: Archive (automatic signing via API key)
        run: >
          xcodebuild
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          archive

      # ExportOptions.plist has destination=upload, so this exports and uploads to TestFlight in one step.
      - name: Export and upload to TestFlight
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -exportOptionsPlist ios/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
