<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · الصفحة غير موجودة · ReadIn</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    :root { color-scheme: light dark; --bg: #FAF8F4; --text: #1A1A1A; --muted: #6B6B6B; --primary: #0F5E52; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121413; --text: #ECEAE6; --muted: #A3A39E; --primary: #3FB8A3; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--bg); color: var(--text); font: 17px/1.7 "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 24px; margin: 16px 0 4px; }
    p { color: var(--muted); margin: 0 0 6px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="ReadIn" width="72" height="72">

</body>
</html>
